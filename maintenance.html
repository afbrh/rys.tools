<script>
(function () {
/* ================= access list ================= */
// SHA-256 of each approved account's lowercased email, so the addresses themselves aren't
// printed in the page source. This only decides what the UI shows: the page contains no
// data of its own, everything is read from the signed-in user's own Drive file.
const ALLOWED_HASHES = ["7632439ab9eed19264bc3e1aa4ad1a2c4a0cfcbd0334a6a3d9d1ef5231bec8b7", "d86c22090aa6b4f235012ebb9376f1651f6e26bf33879165000a6075b661928b", "08d75589e1d251a55018e1f5c3e769f40720a44bef0dc28f689b5dbd067e26e5", "9aba2ffbc6f32a548f8b91fdab8e456cadb68b5a851aff20b5b8fb1d0ec122d5"];
async function sha256Hex(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function isAllowedEmail(email) {
  if (!email || !window.crypto || !crypto.subtle) return false;
  return ALLOWED_HASHES.indexOf(await sha256Hex(email.trim().toLowerCase())) !== -1;
}


  const GoogleDriveSync = (function () {
    // Client IDs are meant to be public (unlike API tokens) — the real gate is the
    // Google sign-in + consent screen each user goes through, not a hidden secret.
    const CLIENT_ID = '575902569700-4l05lkmf0kbrgq5kdr58canigcvafv3j.apps.googleusercontent.com';
    // Only what this page needs: Drive (app-created files) for saving, and the account
    // email shown on the Save button.
    const SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
    const FILE_NAME = 'munny-data.json';
    const FILE_ID_KEY = 'munny_drive_file_id';
    const TOKEN_KEY = 'munny_google_token';

    let tokenClient = null;
    let accessToken = null;
    let refreshTimer = null;

    function getCachedFileId() {
      try { return localStorage.getItem(FILE_ID_KEY) || ''; } catch (e) { return ''; }
    }
    function setCachedFileId(id) {
      try {
        if (id) localStorage.setItem(FILE_ID_KEY, id);
        else localStorage.removeItem(FILE_ID_KEY);
      } catch (e) {}
    }

    // Re-arms itself every time a token is (re)persisted, a few minutes ahead of that
    // token's real expiry, so an open tab silently refreshes itself via trySilentSignIn
    // well before anything actually 401s — the "indefinite" feel comes from this timer,
    // not just from restoreSession() at page load.
    function scheduleProactiveRefresh(expiresInSeconds) {
      if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
      const bufferMs = 5 * 60 * 1000;
      const delay = Math.max((expiresInSeconds || 3600) * 1000 - bufferMs, 30000);
      refreshTimer = setTimeout(() => { trySilentSignIn(); }, delay);
    }

    function persistToken(token, expiresInSeconds) {
      try {

          access_token: token,

      } catch (e) {}

    }

    }

    // still-valid access token has to be saved and re-hydrated by hand. Once the real
    // expiry passes (usually ~1hr), the next Drive request 401s and clears it — though
    // in practice scheduleProactiveRefresh should silently renew it well before then.
    function restoreSession() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { stored = null; }

      if (Date.now() > stored.expires_at - 60000) { clearPersistedToken(); return false; }

      scheduleProactiveRefresh((stored.expires_at - Date.now()) / 1000);
      return true;
    }

    function isSignedIn() {
      return !!accessToken;
    }

    function signIn() {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          reject(new Error('Google sign-in script hasn\'t loaded yet — try again in a moment.'));
          return;
        }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {} // replaced per-request below
          });
        }
        let settled = false;
        // If the popup gets closed/dismissed without Google ever calling back
        // (e.g. blocked, or the user closes it), don't hang forever.
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error('Sign-in timed out — the popup may have been closed or blocked. Try again.'));
        }, 60000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { reject(new Error(resp.error)); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in);
          resolve(accessToken);
        };

        // seems to open the popup, fail to complete quietly, and close itself before you
        // can interact with it. Forcing consent every time is a little more friction but
        // actually shows the real interactive screen instead of a flash-and-close window.
        // (trySilentSignIn below uses prompt:'' anyway, for the automatic — not clicked —
        // reauth path, where there's no interactive screen to lose in the first place.)
        tokenClient.requestAccessToken({ prompt: 'consent' });

    // reauth attempt that relies on the browser still having an active Google session
    // plus this app's prior consent on file. Called automatically (not from a click), on
    // page load when there's no valid cached session and proactively before the current
    // one expires (see scheduleProactiveRefresh), so a browser that's still logged into
    // Google never needs an explicit re-sign-in click, the same way Gmail itself doesn't.
    // Resolves to false instead of rejecting on any failure (no existing Google session,
    // consent revoked, popup blocked since this isn't a real click, timeout, script not
    // loaded yet) — every one of those just means falling back to the ordinary "click
    // Google Sign-In" experience, not a real error worth surfacing.
    function trySilentSignIn() {
      return new Promise((resolve) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) { resolve(false); return; }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {}
          });
        }
        let settled = false;
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          resolve(false);
        }, 8000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { resolve(false); return; }

          persistToken(accessToken, resp.expires_in);
          resolve(true);
        };

          tokenClient.requestAccessToken({ prompt: '' });
        } catch (e) {
          settled = true;
          clearTimeout(timer);
          resolve(false);
        }

    async function api(url, options) {

      const headers = Object.assign({ 'Authorization': 'Bearer ' + accessToken }, (options && options.headers) || {});

      const timer = setTimeout(() => controller.abort(), (options && options.timeoutMs) || 15000);

      try {
        resp = await fetch(url, Object.assign({ cache: 'no-store' }, options, { headers, signal: controller.signal }));
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('Google Drive request timed out — check your connection and try again.');
        throw new Error('Network error talking to Google Drive: ' + e.message);

        clearTimeout(timer);
      }
      if (resp.status === 401) { accessToken = null; clearPersistedToken(); } // expired/revoked — isSignedIn() will now correctly report false
      return resp;
    }

    async function findFileId() {
      const cached = getCachedFileId();
      if (cached) return cached;
      const q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
      const resp = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      if (json.files && json.files.length) {
        setCachedFileId(json.files[0].id);
        return json.files[0].id;
      }
      return null;
    }

    async function createFile(dataObj) {
      const metadata = { name: FILE_NAME, mimeType: 'application/json' };
      const boundary = 'munnyboundary' + Date.now();
      const body =
        '--' + boundary + '\r\n' +
        'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
        JSON.stringify(metadata) + '\r\n' +
        '--' + boundary + '\r\n' +
        'Content-Type: application/json\r\n\r\n' +
        JSON.stringify(dataObj, null, 2) + '\r\n' +
        '--' + boundary + '--';
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
        body
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      setCachedFileId(json.id);
      return json.id;
    }

    async function load() {
      if (!accessToken) return null;
      const fileId = await findFileId();
      if (!fileId) return null;
      const resp = await api('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
      if (resp.status === 404 || resp.status === 403) {
        setCachedFileId('');
        return null;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }

    async function save(dataObj) {
      if (!accessToken) throw new Error('not signed in');
      let fileId = getCachedFileId() || await findFileId();
      if (!fileId) {
        await createFile(dataObj);
        return true;
      }
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataObj, null, 2)
      });
      if (resp.status === 404 || resp.status === 403) {
        setCachedFileId('');
        await createFile(dataObj);
        return true;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return true;
    }

    async function getUserEmail() {
      const resp = await api('https://www.googleapis.com/oauth2/v3/userinfo');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      return json.email || '';
    }

    // survive even if this page disappears. (drive.file scope: this app can only touch files it made.)
    const FOLDER_NAME = 'rys.tools attachments';
    const FOLDER_KEY = 'munny_drive_attach_folder';
    async function ensureFolder() {
      let id = '';
      try { id = localStorage.getItem(FOLDER_KEY) || ''; } catch (e) {}
      if (id) {
        const r0 = await api('https://www.googleapis.com/drive/v3/files/' + id + '?fields=id,trashed');
        if (r0.ok) { const j0 = await r0.json(); if (!j0.trashed) return id; }
      }
      const q = encodeURIComponent("name='" + FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      let r = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)&spaces=drive');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j.files && j.files.length) id = j.files[0].id;
      else {
        r = await api('https://www.googleapis.com/drive/v3/files?fields=id', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        id = (await r.json()).id;
      }
      try { localStorage.setItem(FOLDER_KEY, id); } catch (e) {}
      return id;
    }
    async function uploadFile(file, description) {
      const parent = await ensureFolder();
      const boundary = 'rysattach' + Date.now();
      const meta = { name: file.name, parents: [parent], description: description || '' };
      const body = new Blob([
        '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n' +
        '--' + boundary + '\r\nContent-Type: ' + (file.type || 'application/octet-stream') + '\r\n\r\n',
        file,
        '\r\n--' + boundary + '--'
      ]);
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size,webViewLink', {
        method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body, timeoutMs: 180000
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }
    async function trashFile(id) {
      const resp = await api('https://www.googleapis.com/drive/v3/files/' + id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true })
      });
      return resp.ok;
    }
    return { isSignedIn, signIn, trySilentSignIn, load, save, getUserEmail, restoreSession, uploadFile, trashFile };
  })();

/* ================= shared Drive file ================= */
// One Drive file holds every tool's data, each under tools[<name>]. Saving here only ever
// replaces tools.maintenance and leaves the other tools' slices untouched.
const CURRENT_TOOL = "maintenance";
function withToolsWrapper(remote) {
  if (!remote) return {};
  if (remote.tools) return Object.assign({}, remote.tools);
  return { budget: remote };
}
async function mergeAndSave(toolData) {
  const remote = await GoogleDriveSync.load();
  const tools = withToolsWrapper(remote);
  tools[CURRENT_TOOL] = toolData;
  await GoogleDriveSync.save({ tools: tools });
}

/* ================= page state ================= */
// The page holds no data of its own. Groups and stories come from the signed-in user's Drive file.
const STATUSES = ["Backlog", "Planned", "In Progress", "When it breaks", "Done"];
// Sections are fixed and always shown in this order.
const SECTION_ORDER = ["In Progress", "Planned", "Backlog", "When it breaks", "Done"];

let groups = [], items = [], filter = "Open", openId = null;
const inFilter = i => filter === "Done" ? i.status === "Done" : i.status !== "Done";

function updateButton() {

}
function showGate(message, withImport) {

const app = $("app");

    `<button type="button" class="addtop" data-addtop="1">+ Add</button>`;
}
function optionList(list, cur) {
  const vals = list.includes(cur) || cur == null ? list : list.concat([cur]);
  return vals.map(v => `<option ${v === (cur || "") ? "selected" : ""} value="${esc(v)}">${v === "" ? "—" : esc(v)}</option>`).join("");
}
const ISO = /^\d{4}-\d{2}-\d{2}$/;
const fmtDue = v => { if (!ISO.test(v || "")) return v || ""; const [y, m, d] = v.split("-").map(Number); return "Due " + new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
const fmtSize = n => { n = Number(n) || 0; return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n ? n + " B" : ""; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtMonth = v => { const m = /^(\d{4})-(\d{2})$/.exec(v || ""); return m ? MON[+m[2] - 1] + " " + m[1] : (v || ""); };
const fmtEst = v => { v = String(v || "").trim(); if (!v) return ""; const n = parseFloat(v.replace(/[~$,\s]/g, "")); return /^~?\$?[\d,.]+$/.test(v) && !isNaN(n) ? "~$" + n.toLocaleString("en-US") : v; };
// Old free-text "Last installed" values (2016, Spring 2019, 3/2020, Mar 2020...) become YYYY-MM; anything unreadable is kept in the notes.
function toYM(v) {
  v = String(v == null ? "" : v).trim(); if (!v) return "";
  if (/^\d{4}-(0[1-9]|1[0-2])$/.test(v)) return v;
  const yr = /(?:^|\D)((?:19|20)\d{2})(?!\d)/.exec(v); let y = yr && yr[1], mo = "";
  let m;
  if ((m = /^(\d{4})-(\d{1,2})-\d{1,2}$/.exec(v))) { y = m[1]; mo = m[2]; }
  else if ((m = /^(\d{1,2})[\/\-.](?:\d{1,2}[\/\-.])?((?:19|20)\d{2})$/.exec(v))) { mo = m[1]; y = m[2]; }
  else if ((m = /(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.exec(v))) mo = String(MON.findIndex(x => x.toLowerCase() === m[1].toLowerCase()) + 1);
  else if (/spring/i.test(v)) mo = "4"; else if (/summer/i.test(v)) mo = "7"; else if (/fall|autumn/i.test(v)) mo = "10"; else if (/winter/i.test(v)) mo = "1";
  if (!y) return null;
  mo = +mo; if (!(mo >= 1 && mo <= 12)) mo = 1;
  return y + "-" + String(mo).padStart(2, "0");
}
// Cost boxes show whole dollars with a $; an older text estimate (like "2 days") is shown as typed until it is edited.
const dollarVal = v => { v = String(v == null ? "" : v).trim(); if (!v) return ""; const n = parseFloat(v.replace(/[~$,\s]/g, "")); return /^~?\$?[\d,.]+$/.test(v) && !isNaN(n) ? (Math.round(n) ? "$" + Math.round(n).toLocaleString("en-US") : "") : v; };
// Month/year selector: click a Timing box and a year + month grid folds down under it.

}
function metaHtml(it) {

}
function rowHtml(it) {

        <div class="alist">${(it.attachments || []).map((a, i) => `<div class="arow"><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.name)}</a><small>${esc(fmtSize(a.size))}</small><button type="button" class="rm" data-rmatt="${i}" aria-label="Remove attachment" title="Remove">×</button></div>`).join("")}</div>

  return `<div class="it st-${sKey(it.status)} ${it.status === "Done" ? "done" : ""}" data-id="${it.id}">
    <div class="ln">
      <div class="tx" data-open="${it.id}">${openId === it.id ? `<input type="text" class="ti-edit" data-f="title" aria-label="Story title" value="${esc(it.title)}">` : `<span class="ti">${esc(it.title)}</span>`} <span class="me">${metaHtml(it)}</span></div>
      <span class="co">${fmt0(it.cost || 0)}</span></div>${detail}</div>`;
}
function render() {
  renderChips();
  app.innerHTML = groups.filter(g => inFilter({ status: g.id })).map(g => {
    const all = items.filter(i => i.group === g.id), shown = all.filter(inFilter);
    const sum = all.reduce((a, i) => a + (i.cost || 0), 0);
    return `<section data-group="${g.id}"><div class="sh"><h2>${esc(g.title)}</h2></div>
      <div class="rows">${shown.map(rowHtml).join("") || '<div class="empty">Nothing here.</div>'}</div></section>`;
  }).join("");
}
const keepScroll = fn => { const y = scrollY; fn(); render(); scrollTo(0, y); };

/* ---------- attachments ---------- */
const MAX_ATTACH = 25 * 1024 * 1024;
async function uploadAttachments(it, files) {
  if (!files.length) return;
  if (!GoogleDriveSync.isSignedIn()) { setStatus("Sign in to add attachments.", "err"); return; }
  let added = 0; const failed = [];
  for (const f of files) {
    if (f.size > MAX_ATTACH) { failed.push(f.name + " (over 25 MB)"); continue; }
    setStatus("Uploading " + f.name + "…", "");
    try {
      const r = await GoogleDriveSync.uploadFile(f, "Maintenance story: " + it.title);
      (it.attachments = it.attachments || []).push({ id: r.id, name: r.name || f.name, type: r.mimeType || f.type, size: Number(r.size) || f.size, link: r.webViewLink || ("https://drive.google.com/file/d/" + r.id + "/view") });
      added++;
    } catch (err) { failed.push(f.name + " (" + err.message + ")"); }
  }
  if (added) markDirty();
  setStatus(failed.length ? "Couldn't upload: " + failed.join(", ") : added ? "Attached. Click Save to keep it on the story." : "", failed.length ? "err" : "ok");
  keepScroll(() => {});
}

/* ---------- editing ---------- */
const byId = id => items.find(i => i.id === id);
app.addEventListener("change", e => {
  const el = e.target, row = el.closest(".it"); if (!row) return;
  const it = byId(row.dataset.id); if (!it) return;
  if (el.dataset.status) { it.status = it.group = el.value; markDirty(); keepScroll(() => {}); return; }
  if (el.dataset.attach) { const files = Array.from(el.files || []); el.value = ""; uploadAttachments(it, files); return; }
  const k = el.dataset.f; if (!k) return;
  if (k === "cost") { const n = parseFloat(String(el.value).replace(/[$,\s]/g, "")); it.cost = isNaN(n) ? 0 : Math.round(n); }
  else if (k === "estimate") { const v = String(el.value).trim(), n = parseFloat(v.replace(/[~$,\s]/g, "")); it.estimate = !v ? "" : /^~?\$?[\d,.]+$/.test(v) && !isNaN(n) ? (Math.round(n) ? String(Math.round(n)) : "") : v; }
  else it[k] = el.value;
  markDirty();
  // A date box fires change while it is still being typed in, so only refresh the line, not the whole list.
  if (el.type === "date" || el.type === "month") { const me = row.querySelector(".me"); if (me) me.innerHTML = metaHtml(it); return; }
  keepScroll(() => {});
});
app.addEventListener("click", e => {
  if (justDragged) { justDragged = false; return; }
  const d = e.target.dataset, tx = e.target.closest("[data-open]");
  if (d.type) {
    const row = e.target.closest(".it"), it = row && byId(row.dataset.id);
    if (it) { it.type = it.type === d.type ? "" : d.type; markDirty(); keepScroll(() => {}); }
    return;
  }
  if (d.pick) { const inp = e.target.parentNode.querySelector("[data-attach]"); if (inp) inp.click(); return; }
  if (d.rmatt !== undefined) {
    const row = e.target.closest(".it"), it = row && byId(row.dataset.id), a = it && (it.attachments || [])[+d.rmatt];
    if (a && confirm('Remove "' + a.name + '"? The file is moved to the trash in your Google Drive.')) {
      it.attachments.splice(+d.rmatt, 1); markDirty(); keepScroll(() => {});
      GoogleDriveSync.trashFile(a.id).catch(() => {});
    }
    return;
  }
  if (d.mp) {
    const row = e.target.closest(".it"), it = row && byId(row.dataset.id);
    if (it) {
      if (pick && pick.id === it.id && pick.k === d.mp) pick = null;
      else { const m = /^(\d{4})/.exec(String(it[d.mp] || "")); pick = { id: it.id, k: d.mp, y: m ? +m[1] : new Date().getFullYear() }; }
      keepScroll(() => {});
    }
    return;
  }
  if (d.mpy || d.mpm || d.mpclear) {
    const row = e.target.closest(".it"), it = row && byId(row.dataset.id);
    if (it && pick && pick.id === it.id) {
      if (d.mpy) pick.y += +d.mpy;
      else { it[pick.k] = d.mpclear ? "" : d.mpm; pick = null; markDirty(); }
      keepScroll(() => {});
    }
    return;
  }
  if (d.done) {
    const row = e.target.closest(".it"), it = row && byId(row.dataset.id);
    if (it) { it.status = it.group = it.status === "Done" ? "When it breaks" : "Done"; markDirty(); keepScroll(() => {}); }
    return;
  }
  if (d.del) {
    const row = e.target.closest(".it"), it = row && byId(row.dataset.id);
    if (it && confirm('Delete "' + it.title + '"?')) { items = items.filter(x => x !== it); if (openId === it.id) openId = null; markDirty(); keepScroll(() => {}); }
    return;
  }
  if (d.save) {
    e.target.disabled = true;
    saveToDrive().then(ok => { if (ok) { openId = null; keepScroll(() => {}); } else e.target.disabled = false; });
    return;
  }
  if (e.target.closest(".ti-edit")) return;
  if (tx) { pick = null; openId = openId === tx.dataset.open ? null : tx.dataset.open; keepScroll(() => {}); return; }
});
function addStory() {
  // One Add button for the whole page: a new story starts in Backlog and opens for editing.
  const it = { id: "u" + Date.now(), group: "Backlog", status: "Backlog", priority: "", lastInstalled: "", timing: "", dependency: "", type: "", room: "", title: "New story", cost: 0, duration: "", who: "", bids: "", notes: "" };
  const last = items.map((x, i) => x.group === "Backlog" ? i : -1).filter(i => i >= 0).pop();
  items.splice(last === undefined ? items.length : last + 1, 0, it);
  filter = "Open"; openId = it.id; markDirty(); render();
  const el = app.querySelector('[data-id="' + it.id + '"]'); if (el) el.scrollIntoView({ block: "center" });
}
$("chips").addEventListener("click", e => {
  if (e.target.closest("[data-addtop]")) { addStory(); return; }
  if (e.target.closest("[data-f]") === null) return;
  filter = e.target.closest("[data-f]").dataset.f; render();
});

/* ---------- drag to reorder (pointer events, works with touch) ---------- */
let drag = null, pending = null, justDragged = false, lastPointerType = "mouse";
const HOLD_MS = 320, MOVE_PX = 6;
// A story can be dragged from any blank part of its line. A mouse drags once it moves a few pixels; a finger
// holds for a moment first (moving sooner just scrolls the list), and then the drag takes over from scrolling.
function clearSelection() { try { const s = getSelection(); if (s) s.removeAllRanges(); } catch (err) {} }
function startDrag(p, y) {
  clearTimeout(p.timer); pending = null;
  try { p.ln.setPointerCapture(p.id); } catch (err) {}
  drag = { row: p.row, grip: p.ln, id: p.id, y };
  p.row.classList.add("dragging"); document.body.classList.add("is-dragging"); clearSelection();
  if (p.touch && navigator.vibrate) navigator.vibrate(12);
}
app.addEventListener("pointerdown", e => {
  lastPointerType = e.pointerType;
  if (e.button > 0 || e.target.closest(".grip, button, select, input, textarea, a")) return;
  const ln = e.target.closest(".ln"); if (!ln) return;
  const p = { ln, row: ln.closest(".it"), id: e.pointerId, x: e.clientX, y: e.clientY, touch: e.pointerType === "touch" };
  if (p.touch) p.timer = setTimeout(() => { if (pending === p) startDrag(p, p.y); }, HOLD_MS);
  pending = p;
});
app.addEventListener("pointermove", e => {
  if (!pending || drag || e.pointerId !== pending.id) return;
  const moved = Math.hypot(e.clientX - pending.x, e.clientY - pending.y);
  if (pending.touch) { if (moved > 8) { clearTimeout(pending.timer); pending = null; } return; }
  if (moved >= MOVE_PX) startDrag(pending, e.clientY);
});
const clearPending = () => { if (pending) clearTimeout(pending.timer); pending = null; };
app.addEventListener("pointerup", clearPending);
app.addEventListener("pointercancel", clearPending);
// While a story is being dragged by finger the page must not scroll, and a long press must not open a menu.
app.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
app.addEventListener("contextmenu", e => { if (lastPointerType === "touch" && e.target.closest(".ln")) e.preventDefault(); });
app.addEventListener("selectstart", e => { if (drag || pending) e.preventDefault(); });
app.addEventListener("pointerdown", e => {
  const grip = e.target.closest(".grip"); if (!grip) return;
  const row = grip.closest(".it"); if (!row) return;
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  drag = { row, grip, id: e.pointerId, y: e.clientY };
  row.classList.add("dragging"); document.body.classList.add("is-dragging"); clearSelection();
});
app.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.y = e.clientY;
  if (e.clientY < 70) scrollBy(0, -14); else if (e.clientY > innerHeight - 70) scrollBy(0, 14);
  const under = document.elementFromPoint(e.clientX, e.clientY);
  if (!under) return;
  const over = under.closest(".it"), rows = under.closest("section") && under.closest("section").querySelector(".rows");
  if (over && over !== drag.row) {
    const r = over.getBoundingClientRect();
    over.parentNode.insertBefore(drag.row, e.clientY < r.top + r.height / 2 ? over : over.nextSibling);
  } else if (!over && rows && !rows.contains(drag.row)) {
    rows.appendChild(drag.row);
  }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  drag.row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
  const order = [];
  app.querySelectorAll("section").forEach(sec => sec.querySelectorAll(".it").forEach(r => {
    const it = byId(r.dataset.id); if (it) { it.group = it.status = sec.dataset.group; order.push(it); }
  }));
  drag = null;
  justDragged = true; setTimeout(() => { justDragged = false; }, 80);
  // Stories hidden by the filter keep their slots; the visible ones are placed in the new order.
  const vis = new Set(order);
  if (order.length === items.filter(inFilter).length) {
    let k = 0; items = items.map(i => vis.has(i) ? order[k++] : i); markDirty();
  }
  keepScroll(() => {});
}
app.addEventListener("pointerup", endDrag);
app.addEventListener("pointercancel", endDrag);

/* ---------- data in / out ---------- */
function applyData(d) {
  if (!d || !Array.isArray(d.items) || !Array.isArray(d.groups)) throw new Error("That file isn't a valid data file.");
  // Sections are now the statuses. Older data used topic sections (Maintenance, Upgrades, ...):
  // fold that into the Maintain / Upgrade type and remember the old section as `origin`.
  const oldTitle = {}; d.groups.forEach(g => { oldTitle[g.id] = g.title; });
  items = d.items;
  items.forEach(i => {
    if (i.group in oldTitle && !STATUSES.includes(i.group)) {
      if (!i.origin) i.origin = oldTitle[i.group];
      if (i.group === "maintenance") i.type = "Maintain";
      else if (i.group === "upgrades") i.type = "Upgrade";
    }
    // Due Date is a real date now; keep any older free-text note by moving it into the notes.
    if (i.dependency && !ISO.test(i.dependency)) { i.notes = "Timing note: " + i.dependency + (i.notes ? "\n" + i.notes : ""); i.dependency = ""; }
    if (i.lastInstalled) { const ym = toYM(i.lastInstalled); if (ym === null) { i.notes = "Last installed: " + i.lastInstalled + (i.notes ? "\n" + i.notes : ""); i.lastInstalled = ""; } else i.lastInstalled = ym; }
    // One-time (data version 3): a cost with no estimate was really an estimate, so move it over. Items with both are left alone.
    if (!(d.v >= 3) && i.cost > 0 && !String(i.estimate || "").trim()) { i.estimate = String(i.cost); i.cost = 0; }
    if (i.status === "Getting Bids") i.status = "Planned";
    if (!STATUSES.includes(i.status)) i.status = "Backlog";
    // One-time (data version 2): the old Contingency items (furnace on down) wait for "When it breaks".
    if (!(d.v >= 2) && /^Contingency/.test(i.origin || "") && i.status === "Backlog") i.status = "When it breaks";
    i.group = i.status;
    // Older data had extra priorities and types; fold them into the current options.
    if (i.priority === "Med High") i.priority = "High";
    if (!PRIORITIES.includes(i.priority)) i.priority = "";
    if (i.type === "Replace") i.type = "Maintain";
    if (!TYPES.includes(i.type)) i.type = "";
  });
  groups = SECTION_ORDER.map(id => ({ id, title: id }));
  filter = "Open"; openId = null;
}
const getData = () => ({ v: 3, groups, items });

async function afterSignIn() {
  setStatus("", "");
  try { accountEmail = (await GoogleDriveSync.getUserEmail()) || ""; } catch (e) { accountEmail = ""; }
  allowed = await isAllowedEmail(accountEmail);
  updateButton();
  if (!allowed) {
    groups = []; items = [];
    showGate("This account doesn't have access to this tool. Use the menu to open the Budget, or switch to an approved account.", false);
    return;
  }
  const link = document.getElementById("side-maint-link"); if (link) link.hidden = false;
  showGate("Loading your data from Google Drive…", false);
  try {
    const remote = await GoogleDriveSync.load();
    const own = withToolsWrapper(remote)[CURRENT_TOOL];
    if (own && Array.isArray(own.items)) { applyData(own); dirty = false; showApp(); }
    else showGate("No data in your Google Drive yet. Choose your data file to load it, then click Save.", true);
  } catch (e) { showGate("Couldn't load from Google Drive: " + e.message, false); }
}
async function saveToDrive() {
  if (!items.length && !groups.length) { setStatus("Nothing to save yet. Import your data file first.", "err"); return false; }
  const btn = $("acct-btn"); btn.disabled = true;
  setStatus("Saving…", "");
  try {
    await mergeAndSave(getData());
    dirty = false; setStatus("Saved", "ok");
    setTimeout(() => { if ($("save-status").textContent === "Saved") setStatus("", ""); }, 2500);
    return true;
  } catch (e) {
    setStatus(GoogleDriveSync.isSignedIn() ? "Save failed: " + e.message : "Session expired. Click Google Sign-In, then Save again.", "err");
    updateButton();
    return false;
  } finally { btn.disabled = false; }
}
async function signInFlow() {
  setStatus("Signing in to Google…", "");
  try { await GoogleDriveSync.signIn(); await afterSignIn(); }
  catch (e) { setStatus("Google sign-in failed: " + e.message, "err"); }
}
$("acct-btn").addEventListener("click", () => { if (GoogleDriveSync.isSignedIn() && allowed) saveToDrive(); else signInFlow(); });
$("importFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (items.length && !confirm("Replace the current stories with this file?")) return;
  try {
    applyData(JSON.parse(await file.text()));
    dirty = true; showApp();
    setStatus("Loaded. Click Save to store it in your Google Drive.", "ok");
  } catch (err) { setStatus("Import failed: " + err.message, "err"); }
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

async function boot() {
  showGate("Sign in with Google to open this tool.", false);
  let ok = GoogleDriveSync.restoreSession();
  if (!ok) ok = await GoogleDriveSync.trySilentSignIn();
  updateButton();
  if (ok) await afterSignIn();
}
window.addEventListener("load", boot);
})();
