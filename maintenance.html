  showGate("Loading your data…", false);
  try {
    const out = await GoogleDriveSync.load(CURRENT_TOOL);
    if (out.data && Array.isArray(out.data.items)) { applyData(out.data); dirty = false; showApp(); }
    else if (out.owner) showGate("Nothing is saved on the server yet. Bring over the data you had in Google Drive, then click Save.", "drive");
    else showGate("Nothing has been saved here yet. Ask the owner to add the data.", false);
  } catch (e) {
    if (e.code === "forbidden") {
      allowed = false; updateButton(); groups = []; items = [];
      showGate("This account doesn't have access to this tool. Switch to an approved account.", false);
    } else showGate("Couldn't load your data: " + e.message, false);
  }
}
async function importFromDrive() {
  setStatus("Asking Google for one-time access to your old Drive data…", "");
  try {
    const remote = await GoogleDriveSync.legacyLoadFromDrive();
    const own = remote && remote.tools ? remote.tools[CURRENT_TOOL] : null;
    if (!own || !Array.isArray(own.items)) { setStatus("No Maintenance data found in your Google Drive.", "err"); return; }
    applyData(own); dirty = true; showApp();
    setStatus("Loaded from your Drive. Click Save to store it on the server.", "ok");
  } catch (e) { setStatus("Couldn't read your Drive: " + e.message, "err"); }
}
async function saveToDrive() {
  if (!items.length && !groups.length) { setStatus("Nothing to save yet. Import your data file first.", "err"); return false; }
  const btn = $("acct-btn"); btn.disabled = true;
  setStatus("Saving…", "");
  try {
    await GoogleDriveSync.save(CURRENT_TOOL, getData());
    dirty = false; setStatus("Saved", "ok");
    setTimeout(() => { if ($("save-status").textContent === "Saved") setStatus("", ""); }, 2500);
    return true;
  } catch (e) {
    if (e.code === "conflict") {
      const who = (e.remote && e.remote.updatedBy) || "someone else";
      if (confirm("Changes were saved by " + who + " since you opened this.\n\nOK = load their version (your unsaved edits here are lost)\nCancel = keep your version and replace theirs")) {
        applyData(e.remote.data); GoogleDriveSync.adopt(CURRENT_TOOL, e.remote); dirty = false; showApp();
        setStatus("Loaded the latest version.", "ok");
        return false;
      }
      try { await GoogleDriveSync.save(CURRENT_TOOL, getData(), true); dirty = false; setStatus("Saved (replaced their changes)", "ok"); return true; }
      catch (e2) { setStatus("Save failed: " + e2.message, "err"); return false; }
    }
    setStatus(GoogleDriveSync.isSignedIn() ? "Save failed: " + e.message : "Session expired. Click Google Sign-In, then Save again.", "err");
    updateButton();
    return false;
  } finally { btn.disabled = false; }
}
async function signInFlow() {
  setStatus("Signing in to Google…", "");
  try { await GoogleDriveSync.signIn(); await afterSignIn(); }
  catch (e) { setStatus("Google sign-in failed: " + e.message, "err"); }
}
$("acct-btn").addEventListener("click", () => { if (GoogleDriveSync.isSignedIn() && allowed) saveToDrive(); else signInFlow(); });
$("importFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (items.length && !confirm("Replace the current stories with this file?")) return;
  try {
    const parsed = JSON.parse(await file.text());
    applyData(parsed && parsed.tools && parsed.tools[CURRENT_TOOL] ? parsed.tools[CURRENT_TOOL] : parsed);
    dirty = true; showApp();
    setStatus("Loaded. Click Save to store it.", "ok");
  } catch (err) { setStatus("Import failed: " + err.message, "err"); }
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

async function boot() {
  showGate("Sign in with Google to open this tool.", false);
  let ok = GoogleDriveSync.restoreSession();
  if (!ok) ok = await GoogleDriveSync.trySilentSignIn();
  updateButton();
  if (ok) await afterSignIn();
}
window.addEventListener("load", boot);
})();
</script>
<script>
(function () {
  var btn = document.getElementById('menu-btn'), body = document.body;
  function setOpen(open) {
    body.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  btn.addEventListener('click', function () { setOpen(!body.classList.contains('menu-open')); });
  document.getElementById('side-overlay').addEventListener('click', function () { setOpen(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
<script>
(function(){
  var b=document.getElementById("splash-btn"),m=document.getElementById("splash-msg");
  b.addEventListener("click",function(){
    b.disabled=true;m.textContent="Opening Google sign-in…";
    document.getElementById("acct-btn").click();
    setTimeout(function(){b.disabled=false;if(!window.__signinErr)m.textContent="Sign in to continue.";},6000);
  });
  var t=setInterval(function(){
    var a=document.getElementById("acct-btn");if(!window.__denied&&a&&a.textContent.trim()!=="Google Sign-In"){document.body.classList.remove("locked");clearInterval(t);}
  },200);
  // Signed in with an account that isn't on the allowed list: lock the whole page again, flat denial.
  window.__deny=function(){
    window.__denied=true;
    document.body.classList.add("locked");
    b.hidden=false;b.disabled=false;b.textContent="Try a different account";
    m.textContent="Access denied.";
    b.onclick=function(e){e.stopImmediatePropagation();location.reload();};
  };
})();
</script>
