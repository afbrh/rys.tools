<html lang="en"><head>

<style>
  :root {
    --paper: #f4ecd8;
    --card: #fbf6e9;
    --paper-line: #e2d7bd;
    --ink: #3b3226;
    --ink-soft: #85796a;
    --income: #3F6B33;
    --income-bg: #E4EDD7;
    --expense: #a8402a;
    --expense-bg: #F1DCC9;
    --gold: #6b4f2a;
    --gold-bg: #ecdfc0;
    --danger: #a8402a;
    --font-header: "Palatino Linotype", Palatino, "Iowan Old Style", Georgia, serif;
    --font-body: "Palatino Linotype", Palatino, "Iowan Old Style", Georgia, serif;
    --font-mono: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --bg-texture: none;
    --letter-spacing-header: -0.01em;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    transition: background-color .15s ease, color .15s ease;
    padding: 0 0 80px;
    overflow-x: hidden;
    font-variant-numeric: lining-nums tabular-nums;
  }

  .app-footnote { color: #b9b2a3 !important; }
  /* ---------- app shell / tabs ---------- */
  .app-shell { max-width: none; margin: 0; }
  /* Same header treatment as the Home Cost Explorer: a full-width band in the card colour
     with a thin rule underneath, content centred in a 960px column. */
  .app-header-sticky { position: sticky; top: 0; z-index: 100; background: var(--card); border-bottom: 1px solid var(--paper-line); padding: 12px 16px; }
  .app-header-inner { max-width: 960px; margin: 0 auto; }
/* ---------- slide-out menu ---------- */
.menu-btn { width: 34px; height: 34px; padding: 0; flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--paper-line); border-radius: 8px; background: var(--card); cursor: pointer; }
.menu-btn:hover { border-color: var(--gold); background: var(--card); }
.menu-btn span { display: block; width: 16px; height: 2px; border-radius: 1px; background: var(--ink); }
.side-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 200; }
.side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; max-width: 80vw; padding: 20px 14px; background: var(--card); border-right: 1px solid var(--paper-line); transform: translateX(-100%); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; z-index: 201; font-family: var(--font-body); }
body.menu-open .side-overlay { opacity: 1; pointer-events: auto; }
body.menu-open .side-menu { transform: none; visibility: visible; transition-delay: 0s; }
.side-title { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 8px 12px; }
.side-link { display: block; padding: 11px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 600; }
  .side-link[hidden] { display: none; }
  .side-link:hover { background: var(--paper-line); }
.side-link[aria-current="page"] { background: var(--paper-line); }
@media print { .menu-btn, .side-menu, .side-overlay { display: none !important; } }

  /* ---------- fixed totals window ---------- */
  .summary-bar { padding-top: 2px; }
  .sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; }
  .sum-grid.multi { grid-template-columns: minmax(60px, auto) repeat(3, minmax(0, 1fr)); }
  .sum-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .sum-val { background: var(--paper); border-radius: 10px; padding: 8px 12px; font-family: var(--font-mono); font-size: 22px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum-val.income { color: var(--income); }
  .sum-val.net { background: var(--gold-bg); color: var(--gold); }
  .sum-name { align-self: center; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sum-grid.multi .sum-val { padding: 5px 12px; font-size: 18px; }
  @media (max-width: 560px) { .sum-val, .sum-grid.multi .sum-val { font-size: 13px; padding: 6px 8px; } .sum-name { font-size: 11px; } .sum-grid.multi { grid-template-columns: minmax(48px, auto) repeat(3, minmax(0, 1fr)); } }

  /* ---------- single-scroll cards ---------- */
  #app-content { max-width: 992px; margin: 0 auto; padding: 16px; }
  .tab-panel { margin: 0 0 14px; padding: 0; overflow: hidden; border: 1px solid var(--paper-line); border-radius: 12px; background: var(--card); }
  .card-title { margin: 0; padding: 10px 14px; background: var(--paper); border-bottom: 1px solid var(--paper-line); font-family: var(--font-header); font-size: 14px; font-weight: 600; color: var(--ink); }
  #app-content .tab-panel .page, #app-content .tab-panel .sheet { max-width: none; margin: 0; padding: 12px 16px 6px; }
  @media (max-width: 560px) { #app-content { padding: 12px 10px; } #app-content .tab-panel .page, #app-content .tab-panel .sheet { padding: 10px 10px 4px; } }

  .save-bar { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .app-title { font-size: 16px; font-weight: 600; margin: 0; }
  .tool-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-left: auto; }
  .tool-controls[hidden] { display: none; }
  .save-btn {
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  .save-btn:hover { opacity: 0.88; }
  .save-btn[hidden] { display: none; }
  .save-btn.export-btn { height: auto; padding: 6px 12px; border-radius: 8px; background: var(--card); color: var(--ink); border: 1px solid var(--paper-line); font-size: 13px; font-weight: 400; }
  .save-btn.export-btn:hover { opacity: 1; border-color: var(--gold); }
  .save-status { font-size: 13px; color: var(--income); min-height: 16px; }
  .app-footnote {
    max-width: 820px;
    margin: 30px auto 0;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }

  /* ================= Mortgage tab (scoped) ================= */
  #tab-mortgage .page { max-width: 820px; margin: 0 auto; }
  #tab-mortgage .header-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; gap: 16px; }
  #tab-mortgage h1 {
    font-family: var(--font-header);
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 28px;
    letter-spacing: var(--letter-spacing-header);
  }
  #tab-mortgage .add-btn {
    flex-shrink: 0;
    align-self: center;
    background: none;
    border: 1px dashed var(--ink-soft);
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;

  }

  #tab-mortgage .table-scroll { overflow-x: auto; padding-bottom: 4px; }
  #tab-mortgage .flex-row { display: flex; align-items: center; min-width: max-content; }
  #tab-mortgage .row-label { width: 180px; flex: 0 0 180px; padding-right: 10px; }

    font-weight: 600;
    font-size: 14px;
    border: none;
    background: transparent;
    color: var(--ink);
    text-align: right;
    flex: 1 1 auto;
    min-width: 0;

  }
  #tab-mortgage .col-head-cell input.name:focus { outline: none; border-bottom: 1px solid var(--ink-soft); }
  #tab-mortgage .col-head-cell .remove-btn {
    display: block; margin: 3px 0 0 auto; background: none; border: none;
    color: var(--ink-soft); font-size: 12px; cursor: pointer; padding: 0;
  }
  #tab-mortgage .col-head-cell .remove-btn:hover { color: var(--expense); }
  #tab-mortgage .section { margin-bottom: 26px; }
  #tab-mortgage .section-head { border-bottom: 1px solid var(--paper-line); padding-bottom: 6px; margin-bottom: 2px; }
  #tab-mortgage .section-head h2 { font-family: var(--font-header); font-size: 15px; font-weight: 600; margin: 0; }
  #tab-mortgage .row { padding: 11px 0; border-bottom: 1px solid var(--paper-line); }
  #tab-mortgage .field { display: flex; align-items: center; justify-content: flex-end; font-family: var(--font-mono); font-size: 14px; }
  #tab-mortgage .field span { color: var(--ink-soft); margin: 0 1px; }
  #tab-mortgage .field input[type="number"] {
    width: 4ch;
    min-width: 0;
    text-align: right;
    border: none;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink);
    padding: 4px 0;
    -moz-appearance: textfield;
  }
  #tab-mortgage .field input::-webkit-outer-spin-button,
  #tab-mortgage .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #tab-mortgage .field input:focus { outline: none; border-bottom: 1px solid var(--ink-soft); }
  #tab-mortgage .field select {
    border: none;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    padding: 4px 2px;
    text-align: right;
    width: 100%;
  }
  #tab-mortgage .field select:focus { outline: none; }
  #tab-mortgage .summary-block { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--paper-line); }
  #tab-mortgage .summary-block .row { padding: 8px 0; border-bottom: none; }
  #tab-mortgage .value-text { font-family: var(--font-mono); font-weight: 500; text-align: right; font-size: 14px; display: block; }
  #tab-mortgage .principal-row .value-text { color: var(--income); }
  #tab-mortgage .interest-row .value-text { color: var(--expense); }
  #tab-mortgage .payment-block { margin-top: 22px; }
  #tab-mortgage .payment-row { padding: 16px 18px; border-radius: 8px; background: var(--gold-bg); margin-bottom: 6px; }
  #tab-mortgage .payment-row .field-label { font-family: var(--font-header); font-weight: 600; font-size: 14px; color: var(--gold); }
  #tab-mortgage .payment-row .value-text { font-size: 17px; color: var(--gold); }
  #tab-mortgage .footnote { margin-top: 30px; font-size: 12px; color: var(--ink-soft); text-align: center; }
  #tab-mortgage .fill-rates-status { margin: 10px 0 0; font-size: 12px; color: var(--danger); text-align: right; }
  #tab-mortgage .fill-rates-status:empty { display: none; }

  /* scenario controls in the column heads (add / clone / remove a scenario) */
  #tab-mortgage .col-head-cell .col-head-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }
  #tab-mortgage .col-head-cell .remove-btn, #tab-mortgage .col-head-cell .clone-btn {
    display: inline-block; margin: 0; background: none; border: none; color: var(--ink-soft); font-size: 12px; cursor: pointer; padding: 0;
  }
  #tab-mortgage .col-head-cell .remove-btn:hover { color: var(--expense); }
  #tab-mortgage .col-head-cell .clone-btn:hover { color: var(--gold); }
</style>

<div class="app-shell">
  <div class="app-header-sticky">
  <div class="app-header-inner">
  <div class="save-bar">
    <button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="side-menu"><span></span><span></span><span></span></button>
    <h1 class="app-title">Mortgage Calculator</h1>
    <div class="tool-controls" id="tool-controls">
      <button class="save-btn export-btn" id="google-signin-btn" onclick="handleAccountButton()">Google Sign-In</button>
      <span class="save-status" id="save-status"></span>
    </div>
  </div>
  <div class="summary-bar" id="summary-bar"></div>
  </div>

  <div id="app-content">
  <div id="tab-mortgage" class="tab-panel">
    <h2 class="card-title">Home loan</h2>
    <div class="page">
      <div class="table-scroll">
        <div id="table-root"></div>
      </div>
      <p class="fill-rates-status" id="mortgage-fill-rates-status"></p>
      <p class="footnote">Estimate only. Excludes HOA dues and PMI. Add a scenario to compare a different price, down payment, rate or term side by side.</p>
    </div>

</div>

<script>
  /* ================= currency input sizing (shared across tabs) ================= */
  // Every "$"-prefixed (or "%"-suffixed) amount field is a <span> plus a fixed-width
  // <input type="number">, which used to leave a big gap between the "$" and the
  // right-aligned digits. Sizing each input to its own content keeps the "$"/"%" snug
  // against the number while still right-aligning the whole thing like a ledger column.
  function sizeCurrencyInput(input) {
    const len = Math.max(String(input.value || '').length, String(input.placeholder || '').length, 1);
    input.style.width = len + 'ch';
  }
  function sizeAllCurrencyInputs() {
    document.querySelectorAll('.amount-wrap input[type="number"], .field input[type="number"]').forEach(sizeCurrencyInput);
  }
  document.addEventListener('input', function (e) {
    if (e.target.matches && e.target.matches('.amount-wrap input[type="number"], .field input[type="number"]')) {
      sizeCurrencyInput(e.target);
    }
  });

  /* ================= Shared scenario registry ================= */
  // A single, synced list of scenario names shared by every expense tab (Housing, Food, Car,
  // Utilities, Savings, Subscriptions) — adding, removing, or renaming a scenario in any one
  // tab does the same everywhere else. Each tab keeps only its own per-scenario dollar values,
  // keyed by these shared ids. rename() itself doesn't notify: the input being typed into stays
  // the visible source of truth for its own tab while the user is still mid-keystroke, so a
  // notify()-triggered re-render there can't fight the cursor. Each tab's name <input> calls
  // commitRename() on blur (and Enter) instead, once typing is actually done, which both
  // notifies (pushing the new name out to every other tab's next render) and saves.
  const ScenarioRegistry = (function () {
    let scenarios = [{ id: 'sc1', name: 'Scenario A' }];
    let nextLetter = 66; // 'B'
    const listeners = [];

    function list() { return scenarios; }

    function subscribe(fn) { listeners.push(fn); }

    // Every subscriber gets the same event object, so a tab can tell a plain
    // add/remove/load apart from a clone (which needs to copy a source scenario's
    // values instead of just defaulting the new column blank).
    function notify(event) { listeners.forEach(fn => fn(event || { type: 'change' })); }

    function add() {
      const id = 'sc' + Date.now();
      scenarios.push({ id, name: 'Scenario ' + String.fromCharCode(nextLetter) });
      nextLetter++;
      notify({ type: 'add', id });
      return id;
    }

    function remove(id) {
      if (scenarios.length <= 1) return;
      scenarios = scenarios.filter(s => s.id !== id);
      notify({ type: 'remove', id });
    }

    // Picks "<name> copy", or "<name> copy 2", "<name> copy 3", ... if that's taken —
    // stripping any existing " copy"/" copy N" suffix first, so cloning a clone doesn't
    // pile up into "Scenario A copy copy copy".
    function cloneName(baseName) {
      const stripped = baseName.replace(/\s+copy(\s+\d+)?$/i, '');
      const taken = new Set(scenarios.map(s => s.name));
      if (!taken.has(stripped + ' copy')) return stripped + ' copy';
      let n = 2;
      while (taken.has(stripped + ' copy ' + n)) n++;
      return stripped + ' copy ' + n;
    }

    function clone(sourceId) {
      const source = scenarios.find(s => s.id === sourceId);
      if (!source) return;
      const id = 'sc' + Date.now();
      scenarios.push({ id, name: cloneName(source.name) });
      notify({ type: 'clone', id, sourceId });
      return id;
    }

    function rename(id, name) {
      const s = scenarios.find(s => s.id === id);
      if (s) s.name = name;
    }

    // Called once the user is done typing a scenario name (blur/Enter) — pushes the
    // new name out to every other tab's next render and saves it.
    function commitRename() {
      notify({ type: 'rename' });
    }

    function getState() {
      return { scenarios: JSON.parse(JSON.stringify(scenarios)), nextLetter };
    }

    function setState(state) {
      if (state && Array.isArray(state.scenarios) && state.scenarios.length) {
        scenarios = state.scenarios.map(s => ({ id: s.id, name: s.name }));
        nextLetter = state.nextLetter || nextLetter;
      } else {
        scenarios = [{ id: 'sc1', name: 'Scenario A' }];
        nextLetter = 66;
      }
      notify({ type: 'load' });
    }

    return { list, subscribe, add, remove, clone, rename, commitRename, getState, setState };
  })();

  /* ================= Mortgage app (namespaced) ================= */
  const MortgageApp = (function () {
    const LOAN_FIELDS = [
      { key: 'price', label: 'Purchase price', type: 'currency' },
      { key: 'down', label: 'Down payment', type: 'percent' },
      { key: 'rate', label: 'Interest rate', type: 'percent' },
      { key: 'term', label: 'Loan term', type: 'select' }
    ];
    const TAX_FIELDS = [
      { key: 'tax', label: 'Property tax', type: 'currency', hint: 'per year' },
      { key: 'insurance', label: 'Home insurance', type: 'currency', hint: 'per year' }
    ];
    const DEFAULTS = { price: 0, down: 20, rate: 0, term: '30', tax: 0, insurance: 0 };
    const TERM_OPTIONS = [30, 20, 15, 10];

    // valuesByScenario[scenarioId] = this tab's own field values for that shared scenario.
    let valuesByScenario = {};

    function ensureValues() {
      ScenarioRegistry.list().forEach(s => {
        if (!valuesByScenario[s.id]) valuesByScenario[s.id] = Object.assign({}, DEFAULTS);
      });
    }

    function currency(n, decimals) {
      return '$' + n.toLocaleString('en-US', { minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals || 0 });
    }

    function el(tag, cls, html) {
      const e = document.createElement('div');
      e.className = cls || '';
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function updateValue(scenarioId, key, raw) {
      const values = valuesByScenario[scenarioId];
      if (!values) return;
      values[key] = raw;
      recalculateAll();
    }

    // "Fill" reads mortgage-rates.json, a same-origin file that a scheduled GitHub Actions
    // workflow (.github/workflows/update-mortgage-rates.yml) regenerates daily by fetching
    // Freddie Mac's Primary Mortgage Market Survey average (30yr/15yr fixed) from FRED
    // server-side. Same-origin means no CORS and nothing for a browser/extension to block.
    // 20yr/10yr aren't part of that survey, so they're estimated by linear interpolation/
    // extrapolation along the 15yr-to-30yr line.
    const FILL_BTN_DEFAULT_TITLE = 'Fill every scenario\'s interest rate with this week\'s average rate for its loan term, from Freddie Mac\'s national survey';
    const STALE_RATE_DATA_DAYS = 12; // survey publishes weekly; this gives a couple of missed-update cycles of slack

    async function fillMarketRates() {
      const btn = document.getElementById('mortgage-fill-rates-btn');
      const status = document.getElementById('mortgage-fill-rates-status');
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = 'Fetching…';
      btn.title = FILL_BTN_DEFAULT_TITLE;
      if (status) status.textContent = '';
      try {
        const res = await fetch('/mortgage-rates.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' loading mortgage-rates.json');
        const data = await res.json();
        const rate30 = parseFloat(data.rate30);
        const rate15 = parseFloat(data.rate15);
        if (isNaN(rate30) || isNaN(rate15)) throw new Error('mortgage-rates.json is missing rate data');

        const slopePerFiveYears = (rate30 - rate15) / 3; // (30 - 15) years = three 5-year steps
        const ratesByTerm = {
          '30': rate30,
          '20': rate15 + slopePerFiveYears,
          '15': rate15,
          '10': rate15 - slopePerFiveYears
        };
        ScenarioRegistry.list().forEach(scenario => {
          const values = valuesByScenario[scenario.id];
          const rate = ratesByTerm[String(values.term)];
          if (rate !== undefined) values.rate = Math.round(rate * 100) / 100;
        });
        render();

        const ageDays = data.asOf ? (Date.now() - new Date(data.asOf + 'T00:00:00Z').getTime()) / 86400000 : null;
        const stale = ageDays !== null && ageDays > STALE_RATE_DATA_DAYS;

        const freshBtn = document.getElementById('mortgage-fill-rates-btn');
        if (freshBtn) {
          freshBtn.textContent = stale ? ('Filled (stale, as of ' + data.asOf + ')') : 'Filled ✓';
          setTimeout(() => { const b = document.getElementById('mortgage-fill-rates-btn'); if (b) b.textContent = 'Fill'; }, stale ? 5000 : 2500);
        }
        const freshStatus = document.getElementById('mortgage-fill-rates-status');
        if (freshStatus && stale) {
          freshStatus.textContent = 'Rates are from ' + data.asOf + ' — the daily updater may be stuck; check the GitHub Actions tab.';
        }
      } catch (e) {
        console.error('fillMarketRates failed:', e.message);
        btn.disabled = false;
        btn.textContent = 'Fetch failed — retry';
        btn.title = e.message;
        if (status) status.textContent = e.message;
        setTimeout(() => { if (btn.textContent === 'Fetch failed — retry') btn.textContent = 'Fill'; }, 4000);
      }
    }

    // Scenario columns: rename, clone or remove one, or add another.
    function buildHeaderRow() {
      const row = el('div', 'flex-row col-head-row');

    function recalculateAll() {
      ScenarioRegistry.list().forEach(scenario => {
        const v = valuesByScenario[scenario.id];
        const price = parseFloat(v.price) || 0;
        const downPct = Math.min(Math.max(parseFloat(v.down) || 0, 0), 100);
        const downAmount = price * downPct / 100;
        const loanAmount = price - downAmount;
        const annualRate = parseFloat(v.rate) || 0;
        const years = parseInt(v.term, 10) || 30;

        const n = years * 12;
        const monthlyRate = annualRate / 100 / 12;

        let monthlyPayment;
        if (monthlyRate === 0) {
          monthlyPayment = n > 0 ? loanAmount / n : 0;
        } else {
          const factor = Math.pow(1 + monthlyRate, n);
          monthlyPayment = loanAmount * (monthlyRate * factor) / (factor - 1);
        }
        if (!isFinite(monthlyPayment)) monthlyPayment = 0;

        const totalPaid = monthlyPayment * n;
        const totalInterest = Math.max(totalPaid - loanAmount, 0);

        const annualTax = parseFloat(v.tax) || 0;
        const annualInsurance = parseFloat(v.insurance) || 0;
        const taxMonthly = annualTax / 12;
        const insuranceMonthly = annualInsurance / 12;
        const totalMonthly = monthlyPayment + taxMonthly + insuranceMonthly;

        const setText = (idPrefix, text) => {
          const elx = document.getElementById(idPrefix + '-' + scenario.id);
          if (elx) elx.textContent = text;
        };

        setText('down-amount', currency(downAmount));
        setText('loan-amount', currency(loanAmount));
        setText('total-interest', currency(totalInterest));
        setText('total-paid', currency(totalPaid));
        setText('pi-monthly', currency(monthlyPayment));
        setText('tax-monthly', currency(taxMonthly));
        setText('insurance-monthly', currency(insuranceMonthly));
        setText('monthly-payment', currency(totalMonthly));

        const setSummary = (idPrefix, text) => {
          const elx = document.getElementById(idPrefix + scenario.id);
          if (elx) elx.textContent = text;
        };
        setSummary('sum-down-', currency(downAmount));
        setSummary('sum-loan-', currency(loanAmount));
        setSummary('sum-pay-', currency(totalMonthly));
      });
    }

    function getState() {
      return { valuesByScenario: JSON.parse(JSON.stringify(valuesByScenario)) };
    }

    function setState(state) {
      valuesByScenario = (state && state.valuesByScenario) ? state.valuesByScenario : {};
      // Older saves stored a loan amount directly; convert it to the purchase price that
      // would give that loan at the default down payment.
      Object.keys(valuesByScenario).forEach(id => {
        const v = valuesByScenario[id];
        if (v.price === undefined) {
          const down = v.down === undefined ? DEFAULTS.down : v.down;
          v.down = down;
          v.price = v.loanAmount ? Math.round(v.loanAmount / (1 - down / 100)) : 0;
        }
        delete v.loanAmount;
        delete v.rent;
        delete v.rentersInsurance;
      });
      ensureValues();
      render();
    }

    ScenarioRegistry.subscribe(event => {
      if (event && event.type === 'clone' && valuesByScenario[event.sourceId]) {
        valuesByScenario[event.id] = JSON.parse(JSON.stringify(valuesByScenario[event.sourceId]));
      }
      ensureValues();
      render();
    });

    return { getState, setState };
  })();

  /* ================= GitHub sync (namespaced) ================= */
  const GoogleDriveSync = (function () {
    // Client IDs are meant to be public (unlike API tokens) — the real gate is the
    // Google sign-in + consent screen each user goes through, not a hidden secret.
    const CLIENT_ID = '575902569700-4l05lkmf0kbrgq5kdr58canigcvafv3j.apps.googleusercontent.com';
    // Only what this page needs: Drive (app-created files) for saving, and the account
    // email shown on the Save button.
    const SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
    const FILE_NAME = 'munny-data.json';
    const FILE_ID_KEY = 'munny_drive_file_id';
    const TOKEN_KEY = 'munny_google_token';

    let tokenClient = null;
    let accessToken = null;
    let refreshTimer = null;

    function getCachedFileId() {
      try { return localStorage.getItem(FILE_ID_KEY) || ''; } catch (e) { return ''; }
    }
    function setCachedFileId(id) {
      try {
        if (id) localStorage.setItem(FILE_ID_KEY, id);
        else localStorage.removeItem(FILE_ID_KEY);
      } catch (e) {}
    }

    // Re-arms itself every time a token is (re)persisted, a few minutes ahead of that
    // token's real expiry, so an open tab silently refreshes itself via trySilentSignIn
    // well before anything actually 401s — the "indefinite" feel comes from this timer,
    // not just from restoreSession() at page load.
    function scheduleProactiveRefresh(expiresInSeconds) {
      if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
      const bufferMs = 5 * 60 * 1000;
      const delay = Math.max((expiresInSeconds || 3600) * 1000 - bufferMs, 30000);
      refreshTimer = setTimeout(() => { trySilentSignIn(); }, delay);
    }

    function persistToken(token, expiresInSeconds) {
      try {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          access_token: token,
          expires_at: Date.now() + (expiresInSeconds || 3600) * 1000
        }));
      } catch (e) {}
      scheduleProactiveRefresh(expiresInSeconds);
    }
    function clearPersistedToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    // Google's token client never restores a session on its own after a reload — a
    // still-valid access token has to be saved and re-hydrated by hand. Once the real
    // expiry passes (usually ~1hr), the next Drive request 401s and clears it — though
    // in practice scheduleProactiveRefresh should silently renew it well before then.
    function restoreSession() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { stored = null; }
      if (!stored || !stored.access_token || !stored.expires_at) return false;
      if (Date.now() > stored.expires_at - 60000) { clearPersistedToken(); return false; }
      accessToken = stored.access_token;
      scheduleProactiveRefresh((stored.expires_at - Date.now()) / 1000);
      return true;
    }

    function isSignedIn() {
      return !!accessToken;
    }

    function signIn() {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          reject(new Error('Google sign-in script hasn\'t loaded yet — try again in a moment.'));
          return;
        }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {} // replaced per-request below
          });
        }
        let settled = false;
        // If the popup gets closed/dismissed without Google ever calling back
        // (e.g. blocked, or the user closes it), don't hang forever.
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error('Sign-in timed out — the popup may have been closed or blocked. Try again.'));
        }, 60000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { reject(new Error(resp.error)); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in);
          resolve(accessToken);
        };
        // prompt:'' asks Google to try a silent, invisible sign-in first — in Safari this
        // seems to open the popup, fail to complete quietly, and close itself before you
        // can interact with it. Forcing consent every time is a little more friction but
        // actually shows the real interactive screen instead of a flash-and-close window.
        // (trySilentSignIn below uses prompt:'' anyway, for the automatic — not clicked —
        // reauth path, where there's no interactive screen to lose in the first place.)
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });
    }

    // Like signIn(), but prompt:'' instead of prompt:'consent' — a silent, invisible
    // reauth attempt that relies on the browser still having an active Google session
    // plus this app's prior consent on file. Called automatically (not from a click), on
    // page load when there's no valid cached session and proactively before the current
    // one expires (see scheduleProactiveRefresh), so a browser that's still logged into
    // Google never needs an explicit re-sign-in click, the same way Gmail itself doesn't.
    // Resolves to false instead of rejecting on any failure (no existing Google session,
    // consent revoked, popup blocked since this isn't a real click, timeout, script not
    // loaded yet) — every one of those just means falling back to the ordinary "click
    // Google Sign-In" experience, not a real error worth surfacing.
    function trySilentSignIn() {
      return new Promise((resolve) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) { resolve(false); return; }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {}
          });
        }
        let settled = false;
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          resolve(false);
        }, 8000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { resolve(false); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in);
          resolve(true);
        };
        try {
          tokenClient.requestAccessToken({ prompt: '' });
        } catch (e) {
          settled = true;
          clearTimeout(timer);
          resolve(false);
        }
      });
    }

    async function api(url, options) {
      if (!accessToken) throw new Error('not signed in');
      const headers = Object.assign({ 'Authorization': 'Bearer ' + accessToken }, (options && options.headers) || {});
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      let resp;
      try {
        resp = await fetch(url, Object.assign({ cache: 'no-store' }, options, { headers, signal: controller.signal }));
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('Google Drive request timed out — check your connection and try again.');
        throw new Error('Network error talking to Google Drive: ' + e.message);
      } finally {
        clearTimeout(timer);
      }
      if (resp.status === 401) { accessToken = null; clearPersistedToken(); } // expired/revoked — isSignedIn() will now correctly report false
      return resp;
    }

    async function findFileId() {
      const cached = getCachedFileId();
      if (cached) return cached;
      const q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
      const resp = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      if (json.files && json.files.length) {
        setCachedFileId(json.files[0].id);
        return json.files[0].id;
      }
      return null;
    }

    async function createFile(dataObj) {
      const metadata = { name: FILE_NAME, mimeType: 'application/json' };
      const boundary = 'munnyboundary' + Date.now();
      const body =
        '--' + boundary + '\r\n' +
        'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
        JSON.stringify(metadata) + '\r\n' +
        '--' + boundary + '\r\n' +
        'Content-Type: application/json\r\n\r\n' +
        JSON.stringify(dataObj, null, 2) + '\r\n' +
        '--' + boundary + '--';
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
        body
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      setCachedFileId(json.id);
      return json.id;
    }

    async function load() {
      if (!accessToken) return null;
      const fileId = await findFileId();
      if (!fileId) return null;
      const resp = await api('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
      if (resp.status === 404) {
        setCachedFileId('');
        return null;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }

    async function save(dataObj) {
      if (!accessToken) throw new Error('not signed in');
      let fileId = getCachedFileId() || await findFileId();
      if (!fileId) {
        await createFile(dataObj);
        return true;
      }
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataObj, null, 2)
      });
      if (resp.status === 404) {
        setCachedFileId('');
        await createFile(dataObj);
        return true;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return true;
    }

    async function getUserEmail() {
      const resp = await api('https://www.googleapis.com/oauth2/v3/userinfo');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      return json.email || '';
    }

    return { isSignedIn, signIn, trySilentSignIn, load, save, getUserEmail, restoreSession };
  })();

  // All tools share one Drive file (one sign-in, one Google account), each keeping its
  // own slice under `tools[CURRENT_TOOL]` so saving from one tool's page never touches
  // another tool's data. Pre-multi-tool saves have no `tools` wrapper at all — Budget
  // Planner was the only tool back then, so an unwrapped file is treated as its data.
  // Kept in sync with the same helpers in every other tool page.
  function withToolsWrapper(remote) {
    if (!remote) return {};
    if (remote.tools) return Object.assign({}, remote.tools);
    return { budget: remote };
  }

  function extractOwnToolData(remote) {
    const tools = withToolsWrapper(remote);
    if (tools.mortgage) return tools.mortgage;
    // The calculator used to be the "Housing" card of the Budget Planner: pick up what was saved there.
    const b = tools.budget;
    if (b && b.mortgage && b.scenarios && Array.isArray(b.scenarios.scenarios) && b.scenarios.scenarios.length) return { scenarios: b.scenarios, mortgage: b.mortgage };
    return null;
  }

  const HOME_ACCESS_HASHES = ["7632439ab9eed19264bc3e1aa4ad1a2c4a0cfcbd0334a6a3d9d1ef5231bec8b7", "d86c22090aa6b4f235012ebb9376f1651f6e26bf33879165000a6075b661928b", "08d75589e1d251a55018e1f5c3e769f40720a44bef0dc28f689b5dbd067e26e5", "9aba2ffbc6f32a548f8b91fdab8e456cadb68b5a851aff20b5b8fb1d0ec122d5"];
  async function hasHomeAccess(email) {
    if (!email || !window.crypto || !crypto.subtle) return false;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(email.trim().toLowerCase()));
    const hex = Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
    return HOME_ACCESS_HASHES.indexOf(hex) !== -1;
  }

    const status = document.getElementById('save-status');
    if (btn) btn.disabled = true;
    status.style.color = 'var(--gold)';
    status.textContent = 'Saving…';
    try {
      await mergeAndSave(collectAllData());
      status.style.color = 'var(--income)';
      status.textContent = 'Saved';
      setTimeout(() => { if (status.textContent === 'Saved') status.textContent = ''; }, 2500);
    } catch (e) {
      status.style.color = 'var(--expense)';
      status.textContent = GoogleDriveSync.isSignedIn() ? 'Save failed: ' + e.message : 'Session expired. Click Google Sign-In, then Save again.';
      updateAccountButton();
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function handleGoogleSignIn() {
    const status = document.getElementById('save-status');
    status.style.color = 'var(--gold)';
    status.textContent = 'Signing in to Google…';
    try {
      await GoogleDriveSync.signIn();
      setGoogleSignedInUi(true);
      status.textContent = 'Loading your data from Drive…';
      const remote = await GoogleDriveSync.load();
      applyLoadedData(extractOwnToolData(remote)); // null (brand-new Drive file, or no saved data for this tool yet) leaves fields at their default
      status.textContent = '';
      await loadAccountEmail();
    } catch (e) {
      status.style.color = 'var(--expense)';
      status.textContent = 'Google sign-in failed: ' + e.message;
    }
  }

  function applyLoadedData(saved) {
    ScenarioRegistry.setState(saved ? saved.scenarios : null);
    MortgageApp.setState(saved ? saved.mortgage : null);
    sizeAllCurrencyInputs();
  }

  async function loadApp() {
    // A still-valid access token from an earlier sign-in (saved in localStorage) can be
    // restored without any popup — so a refresh doesn't force signing in again until that
    // token actually expires. If it already has, trySilentSignIn attempts a silent,
    // invisible reauth before falling back to requiring an explicit "Google Sign-In"
    // click — so a browser that's still logged into Google (and has granted this app
    // access before) stays signed in indefinitely, same as Gmail itself.
    applyLoadedData(null);
    setGoogleSignedInUi(false);

    let signedIn = GoogleDriveSync.restoreSession();
    if (!signedIn) signedIn = await GoogleDriveSync.trySilentSignIn();
    if (signedIn) {
      setGoogleSignedInUi(true);
      const status = document.getElementById('save-status');
      status.style.color = 'var(--gold)';
      status.textContent = 'Loading your data from Drive…';
      try {
        const remote = await GoogleDriveSync.load();
        applyLoadedData(extractOwnToolData(remote));
        status.textContent = '';
        await loadAccountEmail();
      } catch (e) {
        status.style.color = 'var(--expense)';
        status.textContent = 'Google Drive load failed: ' + e.message;
        setGoogleSignedInUi(false);
      }
    }
  }

  loadApp();
</script>

<script>
(function () {
  var btn = document.getElementById('menu-btn'), body = document.body;
  function setOpen(open) {
    body.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  btn.addEventListener('click', function () { setOpen(!body.classList.contains('menu-open')); });
  document.getElementById('side-overlay').addEventListener('click', function () { setOpen(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
