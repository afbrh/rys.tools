<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seasonal Upkeep Tasks</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    color-scheme:light;
    --bg:#f4ecd8; --card:#fbf6e9; --ink:#3b3226; --muted:#85796a; --line:#e2d7bd;
    --accent:#6b4f2a; --accent-soft:#ecdfc0; --neg:#a8402a; --hide:#efe5cb;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:var(--ink);
    font:16px/1.45 "Palatino Linotype",Palatino,"Iowan Old Style",Georgia,serif; }
  [hidden] { display:none !important; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:8px 16px 10px; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .titlebar { display:flex; align-items:center; gap:10px; }
  .acct { margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:nowrap; justify-content:flex-end; }
  .acct .st { font-size:12px; color:var(--muted); }
  .acct .st.err { color:var(--neg); }
  .acct .st.ok { color:var(--accent); }
  #acct-btn { max-width:46vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { font:inherit; font-size:13px; padding:6px 12px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button:hover { border-color:var(--accent); }
  main { padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; }
  .sh { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--line); }
  .sh h2 { margin:0; font-size:14px; font-weight:600; flex:1; }
  .sh .cnt { color:var(--muted); font-size:12px; font-weight:400; margin-left:8px; }
  .sh .now { font-size:11px; padding:0 7px; border-radius:999px; background:var(--accent); color:#fff; margin-left:8px; font-weight:600; }
  .sh button { padding:3px 9px; font-size:12px; white-space:nowrap; }
  .t { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); }
  .t:last-child { border-bottom:0; }
  .t input[type=checkbox] { width:18px; height:18px; flex:none; accent-color:var(--accent); cursor:pointer; }
  .t label { flex:1; min-width:0; cursor:pointer; font-weight:500; }
  .t.done label { text-decoration:line-through; opacity:.5; }
  .t select { font:inherit; font-size:12px; padding:3px 6px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  .t .x { background:none; border:0; color:#c0261b; font-size:18px; line-height:1; padding:0 4px; opacity:.55; }
  .t .x:hover { opacity:1; }
  .empty { padding:12px 14px; color:var(--muted); font-size:13px; }
  .addform { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 14px; border-top:1px solid var(--line); background:var(--hide); }
  .addform input[type=text] { flex:1 1 200px; font:inherit; font-size:14px; padding:6px 9px; border:1px solid var(--accent); border-radius:8px; background:var(--card); color:var(--ink); }
  .addform .ok { background:var(--accent); color:#fff; border-color:var(--accent); }
  .foot { display:flex; justify-content:space-between; gap:10px; padding:8px 14px; border-top:1px solid var(--line); background:var(--bg); font-size:12px; color:var(--muted); }
  .foot button { padding:2px 9px; font-size:12px; }
  .note { color:#b9b2a3; font-size:12px; margin:4px 0 16px; }
  /* slide-out menu */
  .menu-btn { width:34px; height:34px; padding:0; flex:none; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border:1px solid var(--line); border-radius:8px; background:var(--card); cursor:pointer; }
  .menu-btn span { display:block; width:16px; height:2px; border-radius:1px; background:var(--ink); }
  .side-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:200; }
  .side-menu { position:fixed; top:0; left:0; bottom:0; width:260px; max-width:80vw; padding:20px 14px; background:var(--card); border-right:1px solid var(--line); transform:translateX(-100%); visibility:hidden; transition:transform .25s ease, visibility 0s linear .25s; z-index:201; }
  body.menu-open .side-overlay { opacity:1; pointer-events:auto; }
  body.menu-open .side-menu { transform:none; visibility:visible; transition-delay:0s; }
  .side-title { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 8px 12px; }
  .side-link { display:block; padding:11px 12px; border-radius:8px; color:var(--ink); text-decoration:none; font-size:16px; font-weight:600; }
  .side-link:hover { background:var(--bg); }
  .side-link[aria-current="page"] { background:var(--hide); }
  @media (max-width:560px) { #acct-btn { max-width:30vw; } .acct .st { font-size:11px; max-width:30vw; } h1 { font-size:15px; white-space:nowrap; } }
  @media print { header, .addform, .sh button, .t .x, .t select, .foot, .menu-btn, .side-menu, .side-overlay { display:none !important; } body { background:#fff; } }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="side-overlay" id="side-overlay"></div>
<nav class="side-menu" id="side-menu" aria-label="Tools">
  <div class="side-title">Ry's Tools</div>
  <a class="side-link" href="budget.html">Budget Planner</a>
  <a class="side-link" href="mortgage.html">Mortgage Calculator</a>
  <a class="side-link" href="seasonal.html" aria-current="page">Seasonal Upkeep Tasks</a>
  <a class="side-link" href="maintenance.html" id="side-maint-link" hidden>Maintenance &amp; Upgrades</a>
</nav>
<header><div class="wrap">
  <div class="titlebar"><button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="side-menu"><span></span><span></span><span></span></button><h1>Seasonal Upkeep Tasks</h1>
    <div class="acct"><span class="st" id="save-status"></span><button type="button" id="acct-btn">Google Sign-In</button></div></div>
</div></header>
<main><div class="wrap" id="app"></div>
<div class="wrap note" id="note">Not signed in: changes are kept in this browser only. Sign in with Google to keep them in your Drive.</div></main>

<script>
(function () {
  const GoogleDriveSync = (function () {
    // Client IDs are meant to be public (unlike API tokens) — the real gate is the
    // Google sign-in + consent screen each user goes through, not a hidden secret.
    const CLIENT_ID = '575902569700-4l05lkmf0kbrgq5kdr58canigcvafv3j.apps.googleusercontent.com';
    // Only what this page needs: Drive (app-created files) for saving, and the account
    // email shown on the Save button.
    const SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
    const FILE_NAME = 'munny-data.json';
    const FILE_ID_KEY = 'munny_drive_file_id';
    const TOKEN_KEY = 'munny_google_token';

    let tokenClient = null;
    let accessToken = null;
    let refreshTimer = null;

    function getCachedFileId() {
      try { return localStorage.getItem(FILE_ID_KEY) || ''; } catch (e) { return ''; }
    }
    function setCachedFileId(id) {
      try {
        if (id) localStorage.setItem(FILE_ID_KEY, id);
        else localStorage.removeItem(FILE_ID_KEY);
      } catch (e) {}
    }

    // Re-arms itself every time a token is (re)persisted, a few minutes ahead of that
    // token's real expiry, so an open tab silently refreshes itself via trySilentSignIn
    // well before anything actually 401s — the "indefinite" feel comes from this timer,
    // not just from restoreSession() at page load.
    function scheduleProactiveRefresh(expiresInSeconds) {
      if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
      const bufferMs = 5 * 60 * 1000;
      const delay = Math.max((expiresInSeconds || 3600) * 1000 - bufferMs, 30000);
      refreshTimer = setTimeout(() => { trySilentSignIn(); }, delay);
    }

    function persistToken(token, expiresInSeconds) {
      try {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          access_token: token,
          expires_at: Date.now() + (expiresInSeconds || 3600) * 1000
        }));
      } catch (e) {}
      scheduleProactiveRefresh(expiresInSeconds);
    }
    function clearPersistedToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    // Google's token client never restores a session on its own after a reload — a
    // still-valid access token has to be saved and re-hydrated by hand. Once the real
    // expiry passes (usually ~1hr), the next Drive request 401s and clears it — though
    // in practice scheduleProactiveRefresh should silently renew it well before then.
    function restoreSession() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { stored = null; }
      if (!stored || !stored.access_token || !stored.expires_at) return false;
      if (Date.now() > stored.expires_at - 60000) { clearPersistedToken(); return false; }
      accessToken = stored.access_token;
      scheduleProactiveRefresh((stored.expires_at - Date.now()) / 1000);
      return true;
    }

    function isSignedIn() {
      return !!accessToken;
    }

    function signIn() {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          reject(new Error('Google sign-in script hasn\'t loaded yet — try again in a moment.'));
          return;
        }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {} // replaced per-request below
          });
        }
        let settled = false;
        // If the popup gets closed/dismissed without Google ever calling back
        // (e.g. blocked, or the user closes it), don't hang forever.
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error('Sign-in timed out — the popup may have been closed or blocked. Try again.'));
        }, 60000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { reject(new Error(resp.error)); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in);
          resolve(accessToken);
        };
        // prompt:'' asks Google to try a silent, invisible sign-in first — in Safari this
        // seems to open the popup, fail to complete quietly, and close itself before you
        // can interact with it. Forcing consent every time is a little more friction but
        // actually shows the real interactive screen instead of a flash-and-close window.
        // (trySilentSignIn below uses prompt:'' anyway, for the automatic — not clicked —
        // reauth path, where there's no interactive screen to lose in the first place.)
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });
    }

    // Like signIn(), but prompt:'' instead of prompt:'consent' — a silent, invisible
    // reauth attempt that relies on the browser still having an active Google session
    // plus this app's prior consent on file. Called automatically (not from a click), on
    // page load when there's no valid cached session and proactively before the current
    // one expires (see scheduleProactiveRefresh), so a browser that's still logged into
    // Google never needs an explicit re-sign-in click, the same way Gmail itself doesn't.
    // Resolves to false instead of rejecting on any failure (no existing Google session,
    // consent revoked, popup blocked since this isn't a real click, timeout, script not
    // loaded yet) — every one of those just means falling back to the ordinary "click
    // Google Sign-In" experience, not a real error worth surfacing.
    function trySilentSignIn() {
      return new Promise((resolve) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) { resolve(false); return; }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {}
          });
        }
        let settled = false;
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          resolve(false);
        }, 8000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { resolve(false); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in);
          resolve(true);
        };
        try {
          tokenClient.requestAccessToken({ prompt: '' });
        } catch (e) {
          settled = true;
          clearTimeout(timer);
          resolve(false);
        }
      });
    }

    async function api(url, options) {
      if (!accessToken) throw new Error('not signed in');
      const headers = Object.assign({ 'Authorization': 'Bearer ' + accessToken }, (options && options.headers) || {});
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      let resp;
      try {
        resp = await fetch(url, Object.assign({ cache: 'no-store' }, options, { headers, signal: controller.signal }));
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('Google Drive request timed out — check your connection and try again.');
        throw new Error('Network error talking to Google Drive: ' + e.message);
      } finally {
        clearTimeout(timer);
      }
      if (resp.status === 401) { accessToken = null; clearPersistedToken(); } // expired/revoked — isSignedIn() will now correctly report false
      return resp;
    }

    async function findFileId() {
      const cached = getCachedFileId();
      if (cached) return cached;
      const q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
      const resp = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      if (json.files && json.files.length) {
        setCachedFileId(json.files[0].id);
        return json.files[0].id;
      }
      return null;
    }

    async function createFile(dataObj) {
      const metadata = { name: FILE_NAME, mimeType: 'application/json' };
      const boundary = 'munnyboundary' + Date.now();
      const body =
        '--' + boundary + '\r\n' +
        'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
        JSON.stringify(metadata) + '\r\n' +
        '--' + boundary + '\r\n' +
        'Content-Type: application/json\r\n\r\n' +
        JSON.stringify(dataObj, null, 2) + '\r\n' +
        '--' + boundary + '--';
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
        body
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      setCachedFileId(json.id);
      return json.id;
    }

    async function load() {
      if (!accessToken) return null;
      const fileId = await findFileId();
      if (!fileId) return null;
      const resp = await api('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
      if (resp.status === 404) {
        setCachedFileId('');
        return null;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }

    async function save(dataObj) {
      if (!accessToken) throw new Error('not signed in');
      let fileId = getCachedFileId() || await findFileId();
      if (!fileId) {
        await createFile(dataObj);
        return true;
      }
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataObj, null, 2)
      });
      if (resp.status === 404) {
        setCachedFileId('');
        await createFile(dataObj);
        return true;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return true;
    }

    async function getUserEmail() {
      const resp = await api('https://www.googleapis.com/oauth2/v3/userinfo');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      return json.email || '';
    }

    return { isSignedIn, signIn, trySilentSignIn, load, save, getUserEmail, restoreSession };
  })();


/* ================= shared Drive file ================= */
// One Drive file holds every tool's data, each under tools[<name>]. Saving here only ever
// replaces tools.seasonal and leaves the other tools' slices untouched.
const CURRENT_TOOL = "seasonal";
function withToolsWrapper(remote) {
  if (!remote) return {};
  if (remote.tools) return Object.assign({}, remote.tools);
  return { budget: remote };
}
async function mergeAndSave(toolData) {
  const remote = await GoogleDriveSync.load();
  const tools = withToolsWrapper(remote);
  tools[CURRENT_TOOL] = toolData;
  await GoogleDriveSync.save({ tools: tools });
}

/* ================= page state ================= */
const SEASONS = ["Spring", "Summer", "Fall", "Winter"];
const LS_KEY = "rys_seasonal_tasks";
const DEFAULTS = [
  ["Fall", "Cover external air conditioner components"],
  ["Fall", "Take in hoses"],
  ["Fall", "Stow porch furniture"],
  ["Fall", "Stow pots and planters"],
  ["Fall", "Disconnect gutters from subterranean gutters"],
  ["Fall", "External dryer vent"],
  ["Spring", "Set out porch furniture"],
  ["Spring", "Set out pots and planters"],
  ["Spring", "Uncover external air conditioner components"],
  ["Spring", "Put out hoses"],
  ["Spring", "Reconnect gutters to subterranean gutters"]
];
let tasks = [], addingTo = null, accountEmail = "", uid = 0;
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const newId = () => "t" + Date.now().toString(36) + (uid++);
const defaultTasks = () => DEFAULTS.map(([season, title]) => ({ id: newId(), season, title, done: false }));
const currentSeason = () => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? "Spring" : m >= 5 && m <= 7 ? "Summer" : m >= 8 && m <= 10 ? "Fall" : "Winter"; };

function setStatus(text, cls) { const el = $("save-status"); el.textContent = text; el.className = "st" + (cls ? " " + cls : ""); }
function updateButton() {
  const btn = $("acct-btn");
  btn.textContent = GoogleDriveSync.isSignedIn() ? (accountEmail ? "Synced: " + accountEmail : "Synced to Drive") : "Google Sign-In";
  $("note").hidden = GoogleDriveSync.isSignedIn();
}

/* ---------- storage: this browser always, Drive when signed in ---------- */
const getData = () => ({ v: 1, tasks });
function cleanTasks(arr) {
  return arr.filter(t => t && typeof t.title === "string").map(t => ({
    id: String(t.id || newId()), title: t.title, season: SEASONS.includes(t.season) ? t.season : "Spring", done: !!t.done }));
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(getData())); } catch (e) {} }
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (d && Array.isArray(d.tasks)) return cleanTasks(d.tasks); } catch (e) {}
  return null;
}
let saveTimer = null;
function queueSave() {
  saveLocal();
  if (!GoogleDriveSync.isSignedIn()) return;
  setStatus("Saving…", "");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await mergeAndSave(getData()); setStatus("Saved", "ok"); setTimeout(() => { if ($("save-status").textContent === "Saved") setStatus("", ""); }, 2000); }
    catch (e) { setStatus(GoogleDriveSync.isSignedIn() ? "Save failed: " + e.message : "Session expired. Sign in again.", "err"); updateButton(); }
  }, 600);
}

/* ---------- rendering ---------- */
function taskHtml(t) {
  return `<div class="t ${t.done ? "done" : ""}" data-id="${t.id}">
    <input type="checkbox" id="c-${t.id}" ${t.done ? "checked" : ""} data-check="1">
    <label for="c-${t.id}">${esc(t.title)}</label>
    <select data-season="1" aria-label="Season">${SEASONS.map(s => `<option ${s === t.season ? "selected" : ""}>${s}</option>`).join("")}</select>
    <button type="button" class="x" data-del="1" aria-label="Delete task" title="Delete">×</button></div>`;
}
function render() {
  const now = currentSeason();
  $("app").innerHTML = SEASONS.map(s => {
    const list = tasks.filter(t => t.season === s), nDone = list.filter(t => t.done).length;
    const form = addingTo === s ? `<form class="addform" data-form="${s}"><input type="text" name="title" placeholder="New ${s.toLowerCase()} task" autocomplete="off" required><button type="submit" class="ok">Add</button><button type="button" data-cancel="1">Cancel</button></form>` : "";
    return `<section data-season="${s}"><div class="sh"><h2>${s}${s === now ? '<span class="now">Now</span>' : ""}<span class="cnt">${nDone} of ${list.length} done</span></h2>
      <button type="button" data-add="${s}">+ Add task</button></div>
      ${list.map(taskHtml).join("") || '<div class="empty">No tasks yet.</div>'}${form}
      ${nDone ? `<div class="foot"><span>${nDone} checked</span><button type="button" data-reset="${s}">Uncheck all</button></div>` : ""}</section>`;
  }).join("");
  const inp = document.querySelector(".addform input"); if (inp) inp.focus();
}
const keepScroll = fn => { const y = scrollY; fn(); render(); scrollTo(0, y); };

/* ---------- editing ---------- */
const app = $("app");
const byId = id => tasks.find(t => t.id === id);
app.addEventListener("change", e => {
  const row = e.target.closest(".t"), t = row && byId(row.dataset.id); if (!t) return;
  if (e.target.dataset.check) t.done = e.target.checked;
  else if (e.target.dataset.season) t.season = e.target.value;
  else return;
  queueSave(); keepScroll(() => {});
});
app.addEventListener("click", e => {
  const d = e.target.dataset;
  if (d.add) { addingTo = d.add; keepScroll(() => {}); return; }
  if (d.cancel) { addingTo = null; keepScroll(() => {}); return; }
  if (d.reset) { tasks.forEach(t => { if (t.season === d.reset) t.done = false; }); queueSave(); keepScroll(() => {}); return; }
  if (d.del) {
    const row = e.target.closest(".t"), t = row && byId(row.dataset.id);
    if (t && confirm('Delete "' + t.title + '"?')) { tasks = tasks.filter(x => x !== t); queueSave(); keepScroll(() => {}); }
  }
});
app.addEventListener("submit", e => {
  e.preventDefault();
  const season = e.target.dataset.form, title = e.target.elements.title.value.trim(); if (!title) return;
  tasks.push({ id: newId(), season, title, done: false });
  addingTo = season; queueSave(); keepScroll(() => {});
});

/* ---------- sign-in ---------- */
async function afterSignIn() {
  try { accountEmail = (await GoogleDriveSync.getUserEmail()) || ""; } catch (e) { accountEmail = ""; }
  updateButton();
  const link = $("side-maint-link");
  if (link && accountEmail) isAllowedEmail(accountEmail).then(ok => { link.hidden = !ok; });
  try {
    const own = withToolsWrapper(await GoogleDriveSync.load())[CURRENT_TOOL];
    if (own && Array.isArray(own.tasks)) { tasks = cleanTasks(own.tasks); saveLocal(); render(); setStatus("", ""); }
    else { await mergeAndSave(getData()); setStatus("Saved to Drive", "ok"); } // first sign-in: keep what is on screen
  } catch (e) { setStatus("Couldn't reach Google Drive: " + e.message, "err"); }
}
// Same SHA-256 allowlist as the other pages; it only decides whether the Maintenance menu link shows.
const ALLOWED_HASHES = ["7632439ab9eed19264bc3e1aa4ad1a2c4a0cfcbd0334a6a3d9d1ef5231bec8b7", "d86c22090aa6b4f235012ebb9376f1651f6e26bf33879165000a6075b661928b", "08d75589e1d251a55018e1f5c3e769f40720a44bef0dc28f689b5dbd067e26e5", "9aba2ffbc6f32a548f8b91fdab8e456cadb68b5a851aff20b5b8fb1d0ec122d5"];
async function isAllowedEmail(email) {
  if (!email || !window.crypto || !crypto.subtle) return false;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(email.trim().toLowerCase()));
  return ALLOWED_HASHES.indexOf(Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("")) !== -1;
}
async function signInFlow() {
  setStatus("Signing in to Google…", "");
  try { await GoogleDriveSync.signIn(); await afterSignIn(); }
  catch (e) { setStatus("Google sign-in failed: " + e.message, "err"); }
}
$("acct-btn").addEventListener("click", () => { if (!GoogleDriveSync.isSignedIn()) signInFlow(); });

tasks = loadLocal() || defaultTasks();
saveLocal();
render();
window.addEventListener("load", async () => {
  let ok = GoogleDriveSync.restoreSession();
  if (!ok) ok = await GoogleDriveSync.trySilentSignIn();
  updateButton();
  if (ok) await afterSignIn();
});
})();
</script>
<script>
(function () {
  var btn = document.getElementById('menu-btn'), body = document.body;
  function setOpen(open) {
    body.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  btn.addEventListener('click', function () { setOpen(!body.classList.contains('menu-open')); });
  document.getElementById('side-overlay').addEventListener('click', function () { setOpen(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
