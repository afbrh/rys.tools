<style>

  .sh[data-season="Spring"] { background:#2e4a34; border:1px solid #3d6046; }

  .sh { border-radius:10px; color:#f3efe6; }

  /* headings instead of boxes */

  .pr.hdr .sh h2 { font-size:20px; font-weight:700; letter-spacing:.01em; }

  /* floating add button */
  .toolbar { position:fixed; right:18px; bottom:18px; z-index:50; margin:0; }

  .toolbar button:hover, .toolbar button:focus-visible { background:transparent; border-color:#fff; }

  .toolbar { display:flex; justify-content:flex-end; margin-bottom:12px; }
  .note { color:#b9b2a3; font-size:12px; margin:4px 0 16px; }
  /* slide-out menu */
  .menu-btn { width:34px; height:34px; padding:0; flex:none; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border:1px solid var(--line); border-radius:8px; background:var(--card); cursor:pointer; }

  .side-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:200; }
  .side-menu { position:fixed; top:0; left:0; bottom:0; width:260px; max-width:80vw; padding:20px 14px; background:var(--card); border-right:1px solid var(--line); transform:translateX(-100%); visibility:hidden; transition:transform .25s ease, visibility 0s linear .25s; z-index:201; }
  body.menu-open .side-overlay { opacity:1; pointer-events:auto; }
  body.menu-open .side-menu { transform:none; visibility:visible; transition-delay:0s; }
  .side-title { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 8px 12px; }
  .side-link { display:block; padding:11px 12px; border-radius:8px; color:var(--ink); text-decoration:none; font-size:16px; font-weight:600; }
  .side-link:hover { background:var(--bg); }

  @media (max-width:560px) { #acct-btn { max-width:30vw; } .acct .st { font-size:11px; max-width:30vw; } h1 { font-size:15px; white-space:nowrap; } }
  @media print { header, .addform, .sh button, .t .delbtn, .t select, .menu-btn, .side-menu, .side-overlay { display:none !important; } body { background:#fff; } }
</style>

<script>
(function () {
  const GoogleDriveSync = (function () {
    // Client IDs are meant to be public (unlike API tokens) — the real gate is the
    // Google sign-in + consent screen each user goes through, not a hidden secret.
    const CLIENT_ID = '575902569700-4l05lkmf0kbrgq5kdr58canigcvafv3j.apps.googleusercontent.com';
    // Only what this page needs: Drive (app-created files) for saving, and the account
    // email shown on the Save button.
    const SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
    const FILE_NAME = 'munny-data.json';
    const FILE_ID_KEY = 'munny_drive_file_id';
    const TOKEN_KEY = 'munny_google_token';

    let tokenClient = null;
    let accessToken = null;
    let refreshTimer = null;

    function getCachedFileId() {
      try { return localStorage.getItem(FILE_ID_KEY) || ''; } catch (e) { return ''; }
    }
    function setCachedFileId(id) {
      try {
        if (id) localStorage.setItem(FILE_ID_KEY, id);
        else localStorage.removeItem(FILE_ID_KEY);
      } catch (e) {}
    }

    // Re-arms itself every time a token is (re)persisted, a few minutes ahead of that
    // token's real expiry, so an open tab silently refreshes itself via trySilentSignIn
    // well before anything actually 401s — the "indefinite" feel comes from this timer,
    // not just from restoreSession() at page load.
    function scheduleProactiveRefresh(expiresInSeconds) {
      if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
      const bufferMs = 5 * 60 * 1000;
      const delay = Math.max((expiresInSeconds || 3600) * 1000 - bufferMs, 30000);
      refreshTimer = setTimeout(() => { trySilentSignIn(); }, delay);
    }

    function persistToken(token, expiresInSeconds) {
      try {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          access_token: token,
          expires_at: Date.now() + (expiresInSeconds || 3600) * 1000
        }));
      } catch (e) {}
      scheduleProactiveRefresh(expiresInSeconds);
    }
    function clearPersistedToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    // Google's token client never restores a session on its own after a reload — a
    // still-valid access token has to be saved and re-hydrated by hand. Once the real
    // expiry passes (usually ~1hr), the next Drive request 401s and clears it — though
    // in practice scheduleProactiveRefresh should silently renew it well before then.
    function restoreSession() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { stored = null; }
      if (!stored || !stored.access_token || !stored.expires_at) return false;
      if (Date.now() > stored.expires_at - 60000) { clearPersistedToken(); return false; }
      accessToken = stored.access_token;
      scheduleProactiveRefresh((stored.expires_at - Date.now()) / 1000);
      return true;
    }

    function isSignedIn() {
      return !!accessToken;
    }

    function signIn() {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          reject(new Error('Google sign-in script hasn\'t loaded yet — try again in a moment.'));
          return;
        }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {}, // replaced per-request below
            error_callback: (err) => {
              // Tell the person why Google's window never showed up (shown on the sign-in screen).
              var m = document.getElementById('splash-msg'), t = err && err.type;
              window.__signinErr = true;
              if (m) m.textContent = t === 'popup_failed_to_open' ? "Your browser blocked Google's sign-in window. Allow pop-ups for rys.tools, then tap Sign in again." : t === 'popup_closed' ? 'The sign-in window was closed. Tap Sign in to try again.' : 'Sign-in could not start (' + (t || 'unknown') + ').';
              setTimeout(function () { window.__signinErr = false; }, 60000);
            }
          });
        }
        let settled = false;
        // If the popup gets closed/dismissed without Google ever calling back
        // (e.g. blocked, or the user closes it), don't hang forever.
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error('Sign-in timed out — the popup may have been closed or blocked. Try again.'));
        }, 60000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { reject(new Error(resp.error)); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in);
          resolve(accessToken);
        };
        // prompt:'' asks Google to try a silent, invisible sign-in first — in Safari this
        // seems to open the popup, fail to complete quietly, and close itself before you
        // can interact with it. Forcing consent every time is a little more friction but
        // actually shows the real interactive screen instead of a flash-and-close window.
        // (trySilentSignIn below uses prompt:'' anyway, for the automatic — not clicked —
        // reauth path, where there's no interactive screen to lose in the first place.)
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });
    }

    // Like signIn(), but prompt:'' instead of prompt:'consent' — a silent, invisible
    // reauth attempt that relies on the browser still having an active Google session
    // plus this app's prior consent on file. Called automatically (not from a click), on
    // page load when there's no valid cached session and proactively before the current
    // one expires (see scheduleProactiveRefresh), so a browser that's still logged into
    // Google never needs an explicit re-sign-in click, the same way Gmail itself doesn't.
    // Resolves to false instead of rejecting on any failure (no existing Google session,
    // consent revoked, popup blocked since this isn't a real click, timeout, script not
    // loaded yet) — every one of those just means falling back to the ordinary "click
    // Google Sign-In" experience, not a real error worth surfacing.
    function trySilentSignIn() {
      return new Promise((resolve) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) { resolve(false); return; }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {}
          });
        }
        let settled = false;
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          resolve(false);
        }, 8000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { resolve(false); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in);
          resolve(true);
        };
        try {
          tokenClient.requestAccessToken({ prompt: '' });
        } catch (e) {
          settled = true;
          clearTimeout(timer);
          resolve(false);
        }
      });
    }

    async function api(url, options) {
      if (!accessToken) throw new Error('not signed in');
      const headers = Object.assign({ 'Authorization': 'Bearer ' + accessToken }, (options && options.headers) || {});
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      let resp;
      try {
        resp = await fetch(url, Object.assign({ cache: 'no-store' }, options, { headers, signal: controller.signal }));
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('Google Drive request timed out — check your connection and try again.');
        throw new Error('Network error talking to Google Drive: ' + e.message);
      } finally {
        clearTimeout(timer);
      }
      if (resp.status === 401) { accessToken = null; clearPersistedToken(); } // expired/revoked — isSignedIn() will now correctly report false
      return resp;
    }

    async function findFileId() {
      const cached = getCachedFileId();
      if (cached) return cached;
      const q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
      const resp = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      if (json.files && json.files.length) {
        setCachedFileId(json.files[0].id);
        return json.files[0].id;
      }
      return null;
    }

    async function createFile(dataObj) {
      const metadata = { name: FILE_NAME, mimeType: 'application/json' };
      const boundary = 'munnyboundary' + Date.now();
      const body =
        '--' + boundary + '\r\n' +
        'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
        JSON.stringify(metadata) + '\r\n' +
        '--' + boundary + '\r\n' +
        'Content-Type: application/json\r\n\r\n' +
        JSON.stringify(dataObj, null, 2) + '\r\n' +
        '--' + boundary + '--';
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
        body
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      setCachedFileId(json.id);
      return json.id;
    }

    async function load() {
      if (!accessToken) return null;
      const fileId = await findFileId();
      if (!fileId) return null;
      const resp = await api('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
      if (resp.status === 404 || resp.status === 403) {
        setCachedFileId('');
        return null;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }

    async function save(dataObj) {
      if (!accessToken) throw new Error('not signed in');
      let fileId = getCachedFileId() || await findFileId();
      if (!fileId) {
        await createFile(dataObj);
        return true;
      }
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataObj, null, 2)
      });
      if (resp.status === 404 || resp.status === 403) {
        setCachedFileId('');
        await createFile(dataObj);
        return true;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return true;
    }

    async function getUserEmail() {
      const resp = await api('https://www.googleapis.com/oauth2/v3/userinfo');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      return json.email || '';
    }

    return { isSignedIn, signIn, trySilentSignIn, load, save, getUserEmail, restoreSession };
  })();


/* ================= shared Drive file ================= */
// One Drive file holds every tool's data, each under tools[<name>]. Saving here only ever
// replaces tools.seasonal2 and leaves the other tools' slices untouched.
const CURRENT_TOOL = "seasonal2";
function withToolsWrapper(remote) {
  if (!remote) return {};
  if (remote.tools) return Object.assign({}, remote.tools);
  return { budget: remote };
}
async function mergeAndSave(toolData) {
  const remote = await GoogleDriveSync.load();
  const tools = withToolsWrapper(remote);
  tools[CURRENT_TOOL] = toolData;
  await GoogleDriveSync.save({ tools: tools });
}

/* ================= page state ================= */
// Each task is a PAIR: a fall version and a spring version. Only one side shows at a time (p.phase).
// Checking the visible side hides it and brings the other side into view.
const LS_KEY = "rys_seasonal2_pairs";
const OLD_LS_KEY = "rys_seasonal_tasks";
const DEFAULT_PAIRS = [
  ["Cover external air conditioner components", "Uncover external air conditioner components"],
  ["Take in hoses", "Put out hoses"],
  ["Stow porch furniture", "Set out porch furniture"],
  ["Stow pots and planters", "Set out pots and planters"],
  ["Disconnect gutters from subterranean gutters", "Reconnect gutters to subterranean gutters"],
  ["External dryer vent", ""]
];
const COLS = [["fall", "Fall"], ["spring", "Spring"]];
let pairs = [], addingFrom = null, openId = null, accountEmail = "", uid = 0;
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const newId = () => "p" + Date.now().toString(36) + (uid++);
const defaultPairs = () => DEFAULT_PAIRS.map(([f, s]) => ({ id: newId(), fall: { title: f, notes: "" }, spring: { title: s, notes: "" }, phase: "fall", done: false }));
const other = k => k === "fall" ? "spring" : "fall";
const isOff = k => currentSeason() !== (k === "fall" ? "Fall" : "Spring"); // a column is dimmed outside its own season
const currentSeason = () => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? "Spring" : m >= 5 && m <= 7 ? "Summer" : m >= 8 && m <= 10 ? "Fall" : "Winter"; };

function setStatus(text, cls) { const el = $("save-status"); el.textContent = text; el.className = "st" + (cls ? " " + cls : ""); }
function updateButton() {
  const btn = $("acct-btn");
  btn.textContent = GoogleDriveSync.isSignedIn() ? (accountEmail ? "Synced: " + accountEmail : "Synced to Drive") : "Google Sign-In";
  $("note").hidden = GoogleDriveSync.isSignedIn();
}

/* ---------- data helpers ---------- */
const getData = () => ({ v: 2, pairs });
const side = o => ({ title: o && typeof o.title === "string" ? o.title : "", notes: o && typeof o.notes === "string" ? o.notes : "" });
function cleanPairs(arr) {
  return arr.filter(p => p && p.fall && p.spring).map(p => {
    const q = { id: String(p.id || newId()), fall: side(p.fall), spring: side(p.spring), phase: p.phase === "spring" ? "spring" : "fall", done: !!p.done };
    if (!q[q.phase].title.trim() && q[other(q.phase)].title.trim()) q.phase = other(q.phase);
    return q;
  });
}
// Build pairs from the old Seasonal page: row i of Fall lines up with row i of Spring.
function pairsFromSeasonal(arr) {
  const t = (arr || []).filter(x => x && typeof x.title === "string");
  const f = t.filter(x => x.season === "Fall"), s = t.filter(x => x.season === "Spring");
  const out = [];
  for (let i = 0; i < Math.max(f.length, s.length); i++) {
    const a = f[i], b = s[i];
    out.push({ id: newId(), fall: side(a), spring: side(b), phase: (!a || (a.done && b && !b.done)) ? "spring" : "fall", done: false });
  }
  return cleanPairs(out);
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(getData())); } catch (e) {} }
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (d && Array.isArray(d.pairs)) return cleanPairs(d.pairs); } catch (e) {}
  try { const d = JSON.parse(localStorage.getItem(OLD_LS_KEY) || "null"); if (d && Array.isArray(d.tasks)) { const p = pairsFromSeasonal(d.tasks); if (p.length) return p; } } catch (e) {}
  return null;
}
let saveTimer = null;
function queueSave() {
  saveLocal();
  if (!GoogleDriveSync.isSignedIn()) return;
  setStatus("Saving…", "");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await mergeAndSave(getData()); setStatus("Saved", "ok"); setTimeout(() => { if ($("save-status").textContent === "Saved") setStatus("", ""); }, 2000); }
    catch (e) { setStatus(GoogleDriveSync.isSignedIn() ? "Save failed: " + e.message : "Session expired. Sign in again.", "err"); updateButton(); }
  }, 600);
}

/* ---------- rendering ---------- */
function taskHtml(p, k) {
  const sd = p[k], open = openId === p.id, o = p[other(k)], inPlace = p.done && !o.title.trim();
  const det = open ? `<div class="det">
      <label>${k === "fall" ? "Fall" : "Spring"} task<input type="text" data-f="title" value="${esc(sd.title)}" autocomplete="off"></label>
      <label>Notes<textarea data-f="notes" placeholder="Add notes…">${esc(sd.notes)}</textarea></label>
      ${o.title ? `<div class="pairnote">Comes back as: ${esc(o.title)}</div>` : ""}
      <div class="acts"><button type="button" class="delbtn" data-del="1">Delete</button></div></div>` : "";
  return `<div class="t ${inPlace ? "done" : ""} ${isOff(k) ? "off" : ""}" data-k="${k}">
    <div class="ln"><input type="checkbox" ${inPlace ? "checked" : ""} data-check="1" aria-label="Done">
    <span class="tx" data-edit="1">${esc(sd.title)}${sd.notes ? ' <span class="hasnote" title="Has notes">📝</span>' : ""}</span></div>${det}</div>`;
}
function addFormHtml() {
  if (!addingFrom) return `<div class="toolbar"><button type="button" data-add="1" aria-label="Add task" title="Add task">+</button></div>`;
  return `<form class="addform2" data-form="1">
    <div class="afcols">
      <div><h3>Fall version</h3><input type="text" name="ft" placeholder="Fall task title" autocomplete="off" required><textarea name="fn" placeholder="Fall notes (optional)"></textarea></div>
      <div><h3>Spring version</h3><input type="text" name="st" placeholder="Spring task title" autocomplete="off" required><textarea name="sn" placeholder="Spring notes (optional)"></textarea></div>
    </div>
    <div class="afbtn"><button type="submit" class="ok">Add task</button><button type="button" data-cancel="1">Cancel</button></div></form>`;
}
function render() {
  const now = currentSeason();
  $("addwrap").innerHTML = addFormHtml();
  const head = `<div class="pr hdr">${COLS.map(([k, label]) => `<div class="sh ${isOff(k) ? "off" : ""}" data-season="${label}"><h2>${label}${label === now ? '<span class="now">Now</span>' : ""}<span class="cnt">${pairs.filter(p => p.phase === k).length}</span></h2></div>`).join("")}</div>`;
  $("app").innerHTML = head + pairs.map(p => `<div class="pr" data-id="${p.id}">${COLS.map(([k]) => p.phase === k ? taskHtml(p, k) : '<div class="t blank"></div>').join("")}</div>`).join("");
  const inp = document.querySelector("#addwrap input"); if (inp) inp.focus();
}
const keepScroll = fn => { const y = scrollY; fn(); render(); scrollTo(0, y); };

/* ---------- editing ---------- */
const app = $("app"), addwrap = $("addwrap");
const byId = id => pairs.find(p => p.id === id);
const rowInfo = el => {
  const cell = el.closest(".t"); if (!cell || cell.classList.contains("blank")) return null;
  const pr = cell.closest(".pr"), p = pr && byId(pr.dataset.id);
  return p ? { row: cell, p, k: cell.dataset.k } : null;
};
app.addEventListener("change", e => {
  const i = rowInfo(e.target); if (!i) return;
  const { row, p, k } = i;
  if (e.target.dataset.f) {
    const f = e.target.dataset.f;
    if (f === "title") {
      const v = e.target.value.trim();
      if (!v) { e.target.value = p[k].title; return; }
      p[k].title = v; const tx = row.querySelector(".tx"); if (tx) tx.firstChild.textContent = v;
    } else p[k].notes = e.target.value;
    queueSave(); return;
  }
  if (!e.target.dataset.check) return;
  if (p[other(k)].title.trim()) { p.phase = other(k); p.done = false; if (openId === p.id) openId = null; }
  else p.done = e.target.checked; // no counterpart: just mark it done in place
  queueSave(); keepScroll(() => {});
});
app.addEventListener("click", e => {
  if (justDragged) { justDragged = false; return; }
  const d = e.target.dataset, i = rowInfo(e.target);
  if (d.edit && i) { openId = openId === i.p.id ? null : i.p.id; keepScroll(() => {}); return; }
  if (d.del && i && confirm('Delete "' + i.p[i.k].title + '" and its ' + other(i.k) + ' version?')) { pairs = pairs.filter(x => x !== i.p); queueSave(); keepScroll(() => {}); }
});
addwrap.addEventListener("click", e => {
  if (e.target.dataset.add) { addingFrom = true; keepScroll(() => {}); }
  else if (e.target.dataset.cancel) { addingFrom = null; keepScroll(() => {}); }
});
addwrap.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.elements, ft = f.ft.value.trim(), st = f.st.value.trim(); if (!ft || !st) return;
  pairs.push({ id: newId(), fall: { title: ft, notes: f.fn.value }, spring: { title: st, notes: f.sn.value }, phase: "fall", done: false });
  addingFrom = null; queueSave(); keepScroll(() => {});
});

/* ---------- drag to reorder rows (mouse drags from the row, touch holds first) ---------- */
let drag = null, pending = null, justDragged = false, lastPointerType = "mouse";
const HOLD_MS = 320, MOVE_PX = 6;
function clearSelection() { try { const s = getSelection(); if (s) s.removeAllRanges(); } catch (err) {} }
function startDrag(p) {
  clearTimeout(p.timer); pending = null;
  try { p.cell.setPointerCapture(p.id); } catch (err) {}
  drag = { row: p.row, cell: p.cell, id: p.id };
  p.cell.classList.add("dragging"); document.body.classList.add("is-dragging"); clearSelection();
  if (p.touch && navigator.vibrate) navigator.vibrate(12);
}
app.addEventListener("pointerdown", e => {
  lastPointerType = e.pointerType;
  if (e.button > 0 || e.target.closest("input, button, select, textarea, a")) return;
  const ln = e.target.closest(".ln"); if (!ln) return;
  const cell = ln.closest(".t"), row = ln.closest(".pr");
  const p = { cell, row, id: e.pointerId, x: e.clientX, y: e.clientY, touch: e.pointerType === "touch" };
  if (p.touch) p.timer = setTimeout(() => { if (pending === p) startDrag(p); }, HOLD_MS);
  pending = p;
});
app.addEventListener("pointermove", e => {
  if (pending && !drag && e.pointerId === pending.id) {
    const moved = Math.hypot(e.clientX - pending.x, e.clientY - pending.y);
    if (pending.touch) { if (moved > 8) { clearTimeout(pending.timer); pending = null; } }
    else if (moved >= MOVE_PX) startDrag(pending);
    return;
  }
  if (!drag || e.pointerId !== drag.id) return;
  if (e.clientY < 70) scrollBy(0, -14); else if (e.clientY > innerHeight - 70) scrollBy(0, 14);
  const under = document.elementFromPoint(e.clientX, e.clientY); if (!under) return;
  const over = under.closest(".pr");
  if (over && over !== drag.row && !over.classList.contains("hdr")) {
    const r = over.getBoundingClientRect();
    over.parentNode.insertBefore(drag.row, e.clientY < r.top + r.height / 2 ? over : over.nextSibling);
  }
});
function clearPending() { if (pending) clearTimeout(pending.timer); pending = null; }
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) { clearPending(); return; }
  drag.cell.classList.remove("dragging"); document.body.classList.remove("is-dragging");
  const newOrder = Array.from(app.querySelectorAll(".pr[data-id]")).map(r => byId(r.dataset.id)).filter(Boolean);
  if (newOrder.length === pairs.length) pairs = newOrder;
  drag = null; justDragged = true; setTimeout(() => { justDragged = false; }, 80);
  queueSave(); keepScroll(() => {});
}
app.addEventListener("pointerup", e => { clearPending(); endDrag(e); });
app.addEventListener("pointercancel", e => { clearPending(); endDrag(e); });
app.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
app.addEventListener("contextmenu", e => { if (lastPointerType === "touch" && e.target.closest(".t")) e.preventDefault(); });
app.addEventListener("selectstart", e => { if ((drag || pending) && !e.target.closest(".det")) e.preventDefault(); });

/* ---------- sign-in ---------- */
async function afterSignIn() {
  try { accountEmail = (await GoogleDriveSync.getUserEmail()) || ""; } catch (e) { accountEmail = ""; }
  updateButton();
  const link = $("side-maint-link");
  if (link && accountEmail) isAllowedEmail(accountEmail).then(ok => { link.hidden = !ok; });
  try {
    const tools = withToolsWrapper(await GoogleDriveSync.load());
    const own = tools[CURRENT_TOOL];
    if (own && Array.isArray(own.pairs)) { pairs = cleanPairs(own.pairs); saveLocal(); render(); setStatus("", ""); }
    else {
      // First time here: start from the order on the original Seasonal page.
      const old = tools.seasonal && Array.isArray(tools.seasonal.tasks) ? pairsFromSeasonal(tools.seasonal.tasks) : [];
      if (old.length) { pairs = old; saveLocal(); render(); }
      await mergeAndSave(getData()); setStatus("Saved to Drive", "ok");
    }
  } catch (e) { setStatus("Couldn't reach Google Drive: " + e.message, "err"); }
}
// Same SHA-256 allowlist as the other pages; it only decides whether the Maintenance menu link shows.
const ALLOWED_HASHES = ["7632439ab9eed19264bc3e1aa4ad1a2c4a0cfcbd0334a6a3d9d1ef5231bec8b7", "d86c22090aa6b4f235012ebb9376f1651f6e26bf33879165000a6075b661928b", "08d75589e1d251a55018e1f5c3e769f40720a44bef0dc28f689b5dbd067e26e5", "9aba2ffbc6f32a548f8b91fdab8e456cadb68b5a851aff20b5b8fb1d0ec122d5"];
async function isAllowedEmail(email) {
  if (!email || !window.crypto || !crypto.subtle) return false;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(email.trim().toLowerCase()));
  return ALLOWED_HASHES.indexOf(Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("")) !== -1;
}
async function signInFlow() {
  setStatus("Signing in to Google…", "");
  try { await GoogleDriveSync.signIn(); await afterSignIn(); }
  catch (e) { setStatus("Google sign-in failed: " + e.message, "err"); }
}
$("acct-btn").addEventListener("click", () => { if (!GoogleDriveSync.isSignedIn()) signInFlow(); });

pairs = loadLocal() || defaultPairs();
saveLocal();
render();
window.addEventListener("load", async () => {
  let ok = GoogleDriveSync.restoreSession();
  if (!ok) ok = await GoogleDriveSync.trySilentSignIn();
  updateButton();
  if (ok) await afterSignIn();
});
})();
</script>
<script>
(function () {
  var btn = document.getElementById('menu-btn'), body = document.body;
  function setOpen(open) {
    body.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  btn.addEventListener('click', function () { setOpen(!body.classList.contains('menu-open')); });
  document.getElementById('side-overlay').addEventListener('click', function () { setOpen(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
<script>
(function(){
  var b=document.getElementById("splash-btn"),m=document.getElementById("splash-msg");
  b.addEventListener("click",function(){
    b.disabled=true;m.textContent="Opening Google sign-in…";
    document.getElementById("acct-btn").click();
    setTimeout(function(){b.disabled=false;if(!window.__signinErr)m.textContent="Sign in to continue.";},6000);
  });
  var t=setInterval(function(){
    var a=document.getElementById("acct-btn");if(a&&a.textContent.trim()!=="Google Sign-In"){document.body.classList.remove("locked");clearInterval(t);}
  },200);
})();
</script>
<script>
/* Access gate: only accounts on the owner's allowed list may use this tool. Anyone else gets a flat denial. */
(function () {
  var TOOL = "seasonal";
  var API = "https://script.google.com/macros/s/AKfycbxZEStK6QE1yp8kf9wHSoqKPqu6bBRkn00jYri3EXq3JV3LLP7b8sX-RzHe1YTyMbC0bg/exec";
  var KEY = "munny_google_token";
  var hold = false, busy = false, seen = "", wait = 0;
  function el(id) { return document.getElementById(id); }
  function lock(msg, retry) {
    hold = true; document.body.classList.add("locked");
    var m = el("splash-msg"), b = el("splash-btn");
    if (m) m.textContent = msg;
    if (b) {
      b.hidden = !retry; b.disabled = false;
      if (retry) { b.textContent = "Try a different account"; b.onclick = function (e) { e.stopImmediatePropagation(); location.reload(); }; }
    }
  }
  function release() {
    hold = false;
    var m = el("splash-msg"), b = el("splash-btn");
    if (m) m.textContent = "Sign in to continue.";
    if (b) { b.hidden = false; b.disabled = false; b.textContent = "Sign in with Google"; b.onclick = null; }
  }
  new MutationObserver(function () { if (hold && !document.body.classList.contains("locked")) document.body.classList.add("locked"); })
    .observe(document.body, { attributes: true, attributeFilter: ["class"] });
  function failed() {
    seen = ""; busy = false; wait = Date.now() + 5000;
    lock("Couldn't verify access. Retrying\u2026", true);
    var b = el("splash-btn");
    if (b) { b.textContent = "Sign in again"; b.onclick = function (e) { e.stopImmediatePropagation(); try { localStorage.removeItem(KEY); } catch (x) {} location.reload(); }; }
  }
  function token() {
    try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); return s && s.access_token && Date.now() < s.expires_at ? s.access_token : ""; } catch (e) { return ""; }
  }
  function check() {
    var t = token();
    if (!t || t === seen || busy || Date.now() < wait) return;
    busy = true; lock("Checking access…", false);
    var ac = new AbortController(); setTimeout(function () { ac.abort(); }, 15000);
    fetch(API, { signal: ac.signal, method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ token: t, action: "whoami" }), cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        busy = false;
        if (out && out.ok && out.tools && out.tools.indexOf(TOOL) > -1) {
          seen = t; hold = false; window.__gateOk = true;
          var a = el("acct-btn");
          if (a && a.textContent.trim() !== "Google Sign-In") document.body.classList.remove("locked");
          else release();
        } else if (out && (out.ok || out.error === "forbidden")) {
          seen = t; window.__gateDenied = true;
          try { localStorage.removeItem(KEY); } catch (e) {}
          lock("Access denied.", true);
        } else if (out && out.error === "unauthenticated") {
          // Sign-in proof expired or invalid: drop it and let the page ask for a fresh sign-in.
          try { localStorage.removeItem(KEY); } catch (e) {}
          seen = ""; release();
        } else { failed(); }
      })
      .catch(function () { failed(); });
  }
  setInterval(check, 250); check();
})();
</script>
