<!DOCTYPE html>
<html lang="en"><head>
<script>(function(){try{var a=localStorage.getItem('munny_appearance');if(a!=='light'&&a!=='dark'&&a!=='elder'&&a!=='machina'){var s=localStorage.getItem('munny_skin');if(s==='elder'||s==='machina'){a=s;}else{a=(localStorage.getItem('munny_theme')==='light')?'light':'dark';}}if(a==='elder'||a==='machina'){document.documentElement.setAttribute('data-skin',a);}else if(a==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ry's Tools</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Sans+Pro:wght@400;600&amp;family=MedievalSharp&amp;family=IM+Fell+English&amp;family=Orbitron:wght@500;700&amp;display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async="" defer=""></script>
<style>
  :root {
    --paper: #F3E9CE;
    --paper-line: #D9C79C;
    --ink: #3B2A16;
    --ink-soft: #7A6142;
    --income: #3F6B33;
    --income-bg: #E4EDD7;
    --expense: #93402A;
    --expense-bg: #F1DCC9;
    --gold: #8A6423;
    --gold-bg: #EBDBAF;
    --danger: #93402A;
    --font-header: 'Source Sans Pro', sans-serif;
    --font-body: 'Source Sans Pro', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --bg-texture: none;
    --letter-spacing-header: -0.01em;
  }
  :root[data-theme="dark"] {
    --paper: #000000;
    --paper-line: #1C1C1C;
    --ink: #F0F0EA;
    --ink-soft: #8C8C84;
    --income: #6FCF7A;
    --income-bg: #101F13;
    --expense: #E2685A;
    --expense-bg: #241211;
    --gold: #D9B25E;
    --gold-bg: #1F1A0E;
    --danger: #EF5350;
  }
  :root[data-skin="elder"] {
    --paper: #F3E9CE;
    --paper-line: #D9C79C;
    --ink: #3B2A16;
    --ink-soft: #7A6142;
    --income: #3F6B33;
    --income-bg: #E4EDD7;
    --expense: #93402A;
    --expense-bg: #F1DCC9;
    --gold: #8A6423;
    --gold-bg: #EBDBAF;
    --danger: #93402A;
    --font-header: 'MedievalSharp', cursive;
    --font-body: 'IM Fell English', serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --letter-spacing-header: 0.01em;
    --bg-texture:
      radial-gradient(ellipse at 20% 15%, rgba(154,111,53,0.08), transparent 60%),
      radial-gradient(ellipse at 85% 80%, rgba(140,58,43,0.06), transparent 55%),
      repeating-radial-gradient(circle at 50% 50%, rgba(59,42,22,0.03) 0, rgba(59,42,22,0.03) 1px, transparent 2px, transparent 4px);
  }
  :root[data-skin="machina"] {
    --paper: #050807;
    --paper-line: #10221C;
    --ink: #52FFC6;
    --ink-soft: #3C8A78;
    --income: #52FFC6;
    --income-bg: #06160F;
    --expense: #FF4470;
    --expense-bg: #180208;
    --gold: #FFC857;
    --gold-bg: #17130a;
    --danger: #FF4470;
    --font-header: 'Orbitron', sans-serif;
    --font-body: 'IBM Plex Mono', monospace;
    --font-mono: 'IBM Plex Mono', monospace;
    --letter-spacing-header: 0.04em;
    --bg-texture: repeating-linear-gradient(0deg, rgba(82,255,198,0.025) 0px, rgba(82,255,198,0.025) 1px, transparent 1px, transparent 3px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-texture), var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    transition: background-color .15s ease, color .15s ease;
    padding: 0 20px 80px;
    overflow-x: hidden;
    /* Stops the browser's native pull-to-refresh (mobile Chrome etc.) from firing
       and reloading the whole page — refreshing the inbox is the Refresh button's
       job now, not a swipe gesture. */
    overscroll-behavior-y: contain;
  }

  /* ---------- app shell / header (shared chrome — keep in sync with budget.html) ---------- */
  .app-shell { max-width: 820px; margin: 0 auto; }
  .app-header-sticky {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--paper);
    padding-top: 10px;
    padding-bottom: 1px;
    width: 100vw;
    margin-left: 50%;
    transform: translateX(-50%);
    border-bottom: 1px solid var(--paper-line);
  }
  .app-header-inner { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .save-bar { display: flex; align-items: flex-start; justify-content: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .mobile-menu-toggle { display: none; }
  .mobile-menu-close { display: none; }
  .mobile-menu-backdrop { display: none; }
  .header-controls { display: contents; }
  .brand-block { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .brand-mark {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 34px;
    font-family: var(--font-header);
    font-weight: 600;
    font-size: 23px;
    color: var(--ink);
  }
  .tool-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-left: auto; }
  .tool-controls[hidden] { display: none; }
  .tool-dropdown { position: relative; }
  .tool-dropdown-toggle {
    height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border-radius: 17px;
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tool-dropdown-toggle:hover, .tool-dropdown-toggle.is-open { background: var(--paper-line); }
  .tool-dropdown-caret {
    font-size: 9px;
    color: var(--ink-soft);
    transition: transform .15s ease;
  }
  .tool-dropdown-toggle.is-open .tool-dropdown-caret { transform: rotate(180deg); }
  .tool-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 160px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 50;
  }
  .tool-dropdown-menu.expanded {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .tool-dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tool-dropdown-item:hover { background: var(--paper-line); color: var(--ink); }
  .tool-dropdown-item.active { color: var(--ink); background: var(--gold-bg); }
  .dropdown-label-short { display: none; }
  .save-bar.labels-short .dropdown-label-full { display: none; }
  .save-bar.labels-short .dropdown-label-short { display: inline; }
  .theme-dropdown { position: relative; }
  .theme-dropdown-toggle {
    height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border-radius: 17px;
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .theme-dropdown-toggle:hover, .theme-dropdown-toggle.is-open { background: var(--paper-line); }
  .theme-dropdown-caret {
    font-size: 9px;
    color: var(--ink-soft);
    transition: transform .15s ease;
  }
  .theme-dropdown-toggle.is-open .theme-dropdown-caret { transform: rotate(180deg); }
  .theme-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 150px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 50;
  }
  .theme-dropdown-menu.expanded {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .theme-dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .theme-dropdown-item:hover { background: var(--paper-line); color: var(--ink); }
  .theme-dropdown-item.active { color: var(--ink); background: var(--gold-bg); }
  .save-btn {
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  .save-btn:hover { opacity: 0.88; }
  .save-btn[hidden] { display: none; }
  .save-btn.export-btn {
    background: none;
    color: var(--ink);
    border: 1.5px solid var(--ink);
  }
  .save-btn.export-btn:hover { opacity: 1; background: var(--paper-line); }
  .save-status { font-size: 13px; color: var(--income); min-height: 16px; }
  .signed-in-banner {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: left;
    min-height: 16px;
  }
  .app-footnote {
    max-width: 820px;
    margin: 30px auto 0;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }

  /* Below this width, the tool/theme dropdowns and Save/Sign-in row collapse behind a
     hamburger icon and slide out as a left-hand drawer instead of sitting inline in the
     header — desktop keeps the plain inline row above untouched. */
  @media (max-width: 680px) {
    .mobile-menu-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 34px;
      flex-shrink: 0;
      background: none;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .mobile-menu-toggle:hover { background: var(--paper-line); }
    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      position: fixed;
      top: 0;
      left: 0;
      width: 80vw;
      max-width: 300px;
      height: 100vh;
      margin: 0;
      background: var(--paper);
      border-right: 1.5px solid var(--ink);
      padding: 64px 18px 24px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 1001;
      transform: translateX(-100%);
      transition: transform .2s ease;
    }
    .header-controls.open { transform: translateX(0); }
    .header-controls .tool-dropdown,
    .header-controls .theme-dropdown { width: 100%; }
    .header-controls .tool-dropdown-toggle,
    .header-controls .theme-dropdown-toggle { width: 100%; justify-content: space-between; }
    .header-controls .tool-dropdown-menu,
    .header-controls .theme-dropdown-menu { min-width: 0; width: 100%; }
    .header-controls .tool-controls { margin-left: 0; flex-direction: column; align-items: stretch; gap: 10px; }
    .header-controls .save-btn { width: 100%; }
    .mobile-menu-close {
      display: block;
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--ink);
      font-size: 26px;
      line-height: 1;
      padding: 4px 8px;
      cursor: pointer;
    }
    .mobile-menu-backdrop.open {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
    }
  }

  /* ---------- E-Mail tool ---------- */
  /* Matches .app-header-inner's own 860px cap — same content width as the sticky header
     above it (and everywhere else in the app), so the list reads as filling the page
     properly instead of sitting oddly narrow inside a wider column. */
  .mail-app { max-width: 860px; margin: 12px auto 0; }
  /* Lives in the sticky header now (see #mail-header-toolbar in the markup) so it stays
     put while the list scrolls, instead of scrolling away with the rest of the page.
     The extra bottom margin is deliberate — without it, scrolled list content reaches
     the header's bottom edge with no buffer and looks like it's disappearing right
     underneath Compose/search instead of sliding behind the header. */
  .mail-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 10px 0 10px; }
  .mail-toolbar[hidden] { display: none; }
  .mail-toolbar .mail-status { font-size: 13px; color: var(--ink-soft); margin-left: 4px; }
  .mail-search { display: flex; flex: 1 1 200px; max-width: 320px; min-width: 140px; position: relative; }
  .mail-search input[type="search"] {
    flex: 1;
    min-width: 0;
    height: 34px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink);
    background: var(--paper-line);
    border: 1.5px solid var(--ink);
    border-radius: 17px;
    padding: 0 30px 0 14px;
  }
  .mail-search input[type="search"]:focus { outline: none; }
  /* Browsers with their own built-in clear "x" (Chrome/Edge) get suppressed so only the
     custom one below shows — consistent look across browsers, and only this one is
     wired to also drop back to the inbox view, not just clear the text. */
  .mail-search input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .mail-search-clear {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: none;
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .mail-search-clear:hover { color: var(--ink); background: rgba(0,0,0,0.08); }
  .mail-search-clear[hidden] { display: none; }
  /* One column, same on every screen size — a tap expands a message inline right below
     its row (see toggleInlineDetail), so there's no separate detail pane to lay out
     alongside the list. Fills .mail-app's own width (which matches the header above it)
     rather than being capped any narrower. */
  .mail-list {
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    overflow: hidden;
  }
  .mail-list-empty { padding: 20px; font-size: 14px; color: var(--ink-soft); text-align: center; }
  .mail-refresh-btn {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .mail-refresh-btn:hover { background: var(--paper-line); }
  .mail-swipe-row { position: relative; overflow: hidden; border-bottom: 1px solid var(--paper-line); }
  .mail-swipe-row:last-child { border-bottom: none; }
  .mail-swipe-action {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    color: var(--paper);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
  }
  .mail-swipe-action.action-archive { justify-content: flex-end; padding-right: 22px; background: var(--gold); }
  .mail-swipe-action.action-read { justify-content: flex-start; padding-left: 22px; background: var(--income); }
  .mail-list-item {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    background: var(--paper);
    border: none;
    padding: 12px 14px;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
    touch-action: pan-y;
    user-select: none;
  }
  .mail-list-item:hover { background: var(--paper-line); }
  .mail-list-item.active { background: var(--gold-bg); }
  .mail-list-item .mail-row-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 3px; }
  .mail-list-item .mail-from { font-weight: 600; overflow: hidden; text-overflow: clip; white-space: nowrap; }
  .mail-list-item.unread .mail-from, .mail-list-item.unread .mail-subject { font-weight: 700; color: var(--ink); }
  /* #D9B25E: Budget Planner's --gold in its Dark theme (the "Total income" figure) —
     hardcoded rather than themed, since this should stay this color in every theme here. */
  .mail-list-item .mail-date { flex-shrink: 0; color: #D9B25E; font-family: var(--font-mono); font-size: 11px; }
  .mail-list-item.unread .mail-date { color: var(--income); }
  .mail-list-item .mail-subject { font-size: 13.5px; margin-bottom: 2px; overflow: hidden; text-overflow: clip; white-space: nowrap; }
  .mail-list-item .mail-snippet { font-size: 12.5px; color: var(--ink-soft); overflow: hidden; text-overflow: clip; white-space: nowrap; }

  .mail-empty { color: var(--ink-soft); font-size: 14px; text-align: center; margin: 40px 0; }
  .mail-detail-subject { font-family: var(--font-header); font-size: 20px; font-weight: 600; margin: 0 0 10px; letter-spacing: var(--letter-spacing-header); }
  .mail-detail-meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .mail-detail-meta strong { color: var(--ink); font-weight: 600; }
  .mail-detail-actions { margin: 14px 0; display: flex; gap: 10px; }
  .mail-detail-body {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink);
    border-top: 1px solid var(--paper-line);
    padding-top: 16px;
  }
  .mail-detail-body a { color: var(--gold); text-decoration: underline; }
  .mail-detail-body a:hover { color: var(--ink); }

  /* Multi-message threads render like a chat conversation instead of the single-message
     view above — own messages on the right, the other side's on the left, with the
     From/To header lines dropped since who's who is already shown by which side a
     bubble sits on. */
  .chat-thread { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
  .chat-row { display: flex; flex-direction: column; max-width: 82%; }
  .chat-row-theirs { align-self: flex-start; align-items: flex-start; }
  .chat-row-mine { align-self: flex-end; align-items: flex-end; }
  .chat-meta { font-size: 11px; color: #D9B25E; margin: 0 6px 4px; }
  .chat-bubble {
    padding: 10px 14px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-row-theirs .chat-bubble { background: var(--paper-line); color: var(--ink); border-bottom-left-radius: 4px; }
  .chat-row-mine .chat-bubble { background: var(--gold); color: var(--paper); border-bottom-right-radius: 4px; }
  .chat-bubble a { color: inherit; }
  .chat-row-theirs .chat-bubble a:hover, .chat-row-mine .chat-bubble a:hover { opacity: 0.8; }

  .compose-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 1200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .compose-overlay.open { display: flex; }
  .compose-panel {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    box-sizing: border-box;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .compose-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .compose-head h2 { font-family: var(--font-header); font-size: 20px; font-weight: 600; margin: 0; }
  .compose-close { position: static; }
  .compose-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .compose-field input {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-line);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .compose-field input:focus { outline: none; border-color: var(--ink); }
  .compose-body {
    width: 100%;
    min-height: 200px;
    resize: vertical;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-line);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 10px;
    box-sizing: border-box;
    margin-bottom: 14px;
  }
  .compose-body:focus { outline: none; border-color: var(--ink); }
  .compose-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .compose-status { font-size: 13px; color: var(--gold); }
  .compose-status.error { color: var(--expense); }

  /* Same everywhere, not just mobile — tapping a row expands its detail inline (right
     below that row) instead of opening a separate detail pane. There's no other layout
     to switch to at any width. */
  .mail-inline-detail {
    margin: 8px;
    padding: 14px;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    background: var(--paper);
  }

  @media (max-width: 720px) {
    /* Below 16px, iOS Safari auto-zooms the page on focus (its heuristic for "this text
       is too small to read/type into") — bumping these to 16px only on mobile avoids
       that without changing their size on desktop. Same fix applies to the Compose
       fields, which have the same problem. */
    .mail-search input[type="search"],
    .compose-field input,
    .compose-body { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-header-sticky">
  <div class="app-header-inner">
  <div class="save-bar">
    <button class="mobile-menu-toggle" id="mobile-menu-toggle" onclick="toggleMobileMenu(event)" aria-haspopup="true" aria-expanded="false" aria-controls="header-controls" aria-label="Open menu">
      <span aria-hidden="true">&#9776;</span>
    </button>
    <div class="brand-block">
      <div class="brand-mark"><span>Ry's Tools</span></div>
      <div class="signed-in-banner" id="signed-in-banner"></div>
    </div>
    <div class="header-controls" id="header-controls">
      <button class="mobile-menu-close" id="mobile-menu-close" onclick="closeMobileMenu()" aria-label="Close menu">&times;</button>
      <div class="tool-dropdown">
        <button class="tool-dropdown-toggle" id="tool-dropdown-toggle" onclick="toggleToolMenu(event)" aria-haspopup="true" aria-expanded="false">
          <span id="tool-dropdown-label" class="dropdown-label-full">E-Mail</span>
          <span id="tool-dropdown-label-short" class="dropdown-label-short" aria-hidden="true">E</span>
          <span class="tool-dropdown-caret">&#9662;</span>
        </button>
        <div class="tool-dropdown-menu" id="tool-menu" role="menu" aria-label="Tool">
          <button type="button" class="tool-dropdown-item" data-value="budget" role="menuitemradio" onclick="setActiveTool('budget')">Budget Planner</button>
          <button type="button" class="tool-dropdown-item" data-value="email" role="menuitemradio" onclick="setActiveTool('email')">E-Mail</button>
          <button type="button" class="tool-dropdown-item" data-value="calendar" role="menuitemradio" onclick="setActiveTool('calendar')">Calendar</button>
        </div>
      </div>
      <div class="theme-dropdown">
        <button class="theme-dropdown-toggle" id="theme-dropdown-toggle" onclick="toggleSettingsPanel(event)" aria-haspopup="true" aria-expanded="false">
          <span id="theme-dropdown-label" class="dropdown-label-full">Dark</span>
          <span id="theme-dropdown-label-short" class="dropdown-label-short" aria-hidden="true">D</span>
          <span class="theme-dropdown-caret">&#9662;</span>
        </button>
        <div class="theme-dropdown-menu" id="appearance-group" role="menu" aria-label="Appearance">
          <button type="button" class="theme-dropdown-item" data-value="light" role="menuitemradio" onclick="setAppearance('light')">Light</button>
          <button type="button" class="theme-dropdown-item" data-value="dark" role="menuitemradio" onclick="setAppearance('dark')">Dark</button>
          <button type="button" class="theme-dropdown-item" data-value="elder" role="menuitemradio" onclick="setAppearance('elder')">Elder</button>
          <button type="button" class="theme-dropdown-item" data-value="machina" role="menuitemradio" onclick="setAppearance('machina')">Machina</button>
        </div>
      </div>
      <div class="tool-controls" id="tool-controls">
        <button class="save-btn export-btn" id="google-signin-btn" onclick="handleGoogleSignIn()">Google Sign-In</button>
        <span class="save-status" id="save-status"></span>

  </div>
  <div class="mobile-menu-backdrop" id="mobile-menu-backdrop" onclick="closeMobileMenu()"></div>
  <div class="mail-toolbar" id="mail-header-toolbar" hidden="">
    <button class="save-btn" onclick="MailApp.openCompose()">Compose</button>
    <button type="button" class="mail-refresh-btn" onclick="MailApp.refreshInbox()" aria-label="Refresh inbox">&#8635;</button>
    <div class="mail-search">
      <input type="search" id="mail-search-input" placeholder="Search mail" oninput="MailApp.onSearchInput()" onkeydown="if (event.key === 'Enter') { event.preventDefault(); MailApp.runSearch(); }">
      <button type="button" class="mail-search-clear" id="mail-search-clear" onclick="MailApp.clearSearch()" aria-label="Clear search" hidden="">&times;</button>
    </div>
    <span class="mail-status" id="mail-status"></span>
  </div>

  <div id="app-content">

    <div class="mail-list-col">
      <div class="mail-list" id="mail-list">
        <div class="mail-list-empty">Sign in to view your inbox.</div>
      </div>
    </div>
  </div>

  <div class="compose-overlay" id="compose-overlay" onclick="if (event.target === this) MailApp.closeCompose()">
    <div class="compose-panel">
      <div class="compose-head">
        <h2>New message</h2>
        <button class="mobile-menu-close compose-close" onclick="MailApp.closeCompose()" aria-label="Close">&times;</button>
      </div>

        <span>To</span>

<script>
  function setAppearance(appearance) {
    if (appearance === 'elder' || appearance === 'machina') {
      document.documentElement.setAttribute('data-skin', appearance);
      document.documentElement.removeAttribute('data-theme');
    } else if (appearance === 'dark') {
      document.documentElement.removeAttribute('data-skin');
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      appearance = 'light';
      document.documentElement.removeAttribute('data-skin');
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem('munny_appearance', appearance); } catch (e) {}
    syncAppearanceRadios(appearance);
    closeThemeDropdown();
  }

  // Shrinks the tool/theme dropdown toggle labels to a single initial only when the
  // current label text would otherwise force something onto a new line. Re-checked
  // whenever a label's text changes or the window resizes, never a fixed viewport
  // breakpoint. Kept in sync with the same function in budget.html.
  function updateDropdownLabelFit() {
    const saveBar = document.querySelector('.save-bar');
    const toolDropdown = document.querySelector('.tool-dropdown');
    const themeDropdown = document.querySelector('.theme-dropdown');
    const toolControls = document.getElementById('tool-controls');
    if (!saveBar || !toolDropdown || !themeDropdown) return;

    function rowTops() {
      const els = [toolDropdown, themeDropdown];
      if (toolControls && !toolControls.hidden) els.push(toolControls);
      return els.map(function (el) { return Math.round(el.getBoundingClientRect().top); });
    }

    function sameRow(tops) {
      return tops.every(function (t) { return t === tops[0]; });
    }

    saveBar.classList.remove('labels-short');
    if (sameRow(rowTops())) return;

    saveBar.classList.add('labels-short');
    if (!sameRow(rowTops())) {
      saveBar.classList.remove('labels-short');
    }
  }

  let dropdownLabelFitResizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(dropdownLabelFitResizeTimer);
    dropdownLabelFitResizeTimer = setTimeout(updateDropdownLabelFit, 100);
  });

  // No tab bar on this page yet — kept as a harmless no-op so shared init code that
  // calls it doesn't need a page-specific fork.
  function updateTabLabelFit() {
    const tabsEl = document.querySelector('.tabs');
    const scrollEl = document.querySelector('.tabs-scroll');
    if (!tabsEl || !scrollEl) return;
    function fits() { return scrollEl.scrollWidth <= scrollEl.clientWidth + 1; }

    tabsEl.classList.remove('labels-medium', 'labels-short');
    if (fits()) return;

    tabsEl.classList.add('labels-medium');
    if (fits()) return;

    tabsEl.classList.remove('labels-medium');
    tabsEl.classList.add('labels-short');
  }

  function syncAppearanceRadios(appearance) {
    const label = { light: 'Light', dark: 'Dark', elder: 'Elder', machina: 'Machina' }[appearance] || 'Dark';
    const toggleLabel = document.getElementById('theme-dropdown-label');
    if (toggleLabel) toggleLabel.textContent = label;
    const toggleLabelShort = document.getElementById('theme-dropdown-label-short');
    if (toggleLabelShort) toggleLabelShort.textContent = label.charAt(0);
    updateDropdownLabelFit();
    document.querySelectorAll('.theme-dropdown-item').forEach(function (item) {
      const isActive = item.dataset.value === appearance;
      item.classList.toggle('active', isActive);
      item.setAttribute('aria-checked', isActive ? 'true' : 'false');
    });
  }

  function toggleDropdown(e, toggleId, menuId) {
    if (e) e.stopPropagation();
    const panel = document.getElementById(menuId);
    const toggle = document.getElementById(toggleId);
    if (!panel || !toggle) return;
    const isOpen = panel.classList.toggle('expanded');
    toggle.classList.toggle('is-open', isOpen);
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  }

  function closeDropdown(toggleId, menuId) {
    const panel = document.getElementById(menuId);
    const toggle = document.getElementById(toggleId);
    if (panel) panel.classList.remove('expanded');
    if (toggle) { toggle.classList.remove('is-open'); toggle.setAttribute('aria-expanded', 'false'); }
  }

  function toggleSettingsPanel(e) { toggleDropdown(e, 'theme-dropdown-toggle', 'appearance-group'); }
  function closeThemeDropdown() { closeDropdown('theme-dropdown-toggle', 'appearance-group'); }
  function toggleToolMenu(e) { toggleDropdown(e, 'tool-dropdown-toggle', 'tool-menu'); }
  function closeToolMenu() { closeDropdown('tool-dropdown-toggle', 'tool-menu'); }

  // Mobile-only left-hand drawer: holds the tool/theme dropdowns, which sit inline in
  // the header on desktop (see the @media (max-width: 680px) block in CSS).
  function toggleMobileMenu(e) {
    if (e) e.stopPropagation();
    const panel = document.getElementById('header-controls');
    const toggle = document.getElementById('mobile-menu-toggle');
    const backdrop = document.getElementById('mobile-menu-backdrop');
    if (!panel || !toggle) return;
    const isOpen = panel.classList.toggle('open');
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (backdrop) backdrop.classList.toggle('open', isOpen);
  }

  function closeMobileMenu() {
    const panel = document.getElementById('header-controls');
    const toggle = document.getElementById('mobile-menu-toggle');
    const backdrop = document.getElementById('mobile-menu-backdrop');
    if (panel) panel.classList.remove('open');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
    if (backdrop) backdrop.classList.remove('open');
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeMobileMenu();
      const composeOverlay = document.getElementById('compose-overlay');
      if (composeOverlay && composeOverlay.classList.contains('open')) MailApp.closeCompose();
    }
  });

  let mobileMenuResizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(mobileMenuResizeTimer);
    mobileMenuResizeTimer = setTimeout(function () {
      if (window.matchMedia('(min-width: 681px)').matches) closeMobileMenu();
    }, 100);
  });

  document.addEventListener('click', function (e) {
    [
      ['theme-dropdown-toggle', 'appearance-group', '.theme-dropdown'],
      ['tool-dropdown-toggle', 'tool-menu', '.tool-dropdown']
    ].forEach(function (entry) {
      const toggleId = entry[0], menuId = entry[1], wrapSelector = entry[2];
      const panel = document.getElementById(menuId);
      const wrap = document.querySelector(wrapSelector);
      if (!panel || !wrap || !panel.classList.contains('expanded')) return;
      if (wrap.contains(e.target)) return;
      closeDropdown(toggleId, menuId);
    });
  });

  // Each tool lives on its own page — CURRENT_TOOL says which one this page is, so
  // selecting a different tool from the dropdown navigates instead of toggling in place.
  // Kept in sync with the matching block in budget.html.
  const CURRENT_TOOL = 'email';
  const TOOL_PAGES = { budget: 'budget.html', email: 'email.html', calendar: 'cal.html' };
  const TOOL_LABELS = { budget: 'Budget Planner', email: 'E-Mail', calendar: 'Calendar' };

  function setActiveTool(tool) {
    if (!TOOL_PAGES[tool]) tool = CURRENT_TOOL;
    if (tool !== CURRENT_TOOL) {
      window.location.href = TOOL_PAGES[tool];
      return;
    }
    syncToolMenu(tool);
    closeToolMenu();
  }

  function syncToolMenu(tool) {
    const label = TOOL_LABELS[tool] || TOOL_LABELS[CURRENT_TOOL];
    const toggleLabel = document.getElementById('tool-dropdown-label');
    if (toggleLabel) toggleLabel.textContent = label;
    const toggleLabelShort = document.getElementById('tool-dropdown-label-short');
    if (toggleLabelShort) toggleLabelShort.textContent = label.charAt(0);
    updateDropdownLabelFit();
    document.querySelectorAll('#tool-menu .tool-dropdown-item').forEach(function (item) {
      const isActive = item.dataset.value === tool;
      item.classList.toggle('active', isActive);
      item.setAttribute('aria-checked', isActive ? 'true' : 'false');
    });
  }

  // The Compose/search bar lives in the sticky header (so it stays put while the list
  // scrolls) rather than inside #app-content, so it needs its own visibility check —
  // shown only once Gmail is connected (no point showing Compose/search over the
  // "Connect Gmail" prompt). Called whenever that connection state could have changed
  // — from MailApp.render() and after sign-in.
  function updateMailHeaderToolbarVisibility() {
    const el = document.getElementById('mail-header-toolbar');
    if (!el) return;
    const mailReady = GoogleDriveSync.isSignedIn() && GoogleDriveSync.hasGmailScope();
    el.hidden = !mailReady;
  }

  function currentAppearance() {
    let appearance;
    try { appearance = localStorage.getItem('munny_appearance'); } catch (e) {}
    if (appearance === 'light' || appearance === 'dark' || appearance === 'elder' || appearance === 'machina') {
      return appearance;
    }
    let skin, theme;
    try { skin = localStorage.getItem('munny_skin'); } catch (e) {}
    if (skin === 'elder' || skin === 'machina') return skin;
    try { theme = localStorage.getItem('munny_theme'); } catch (e) {}
    return theme === 'light' ? 'light' : 'dark';
  }

  /* ================= Google Drive sync (shared across every tool page — kept in
     sync with the same module in budget.html) ================= */
  const GoogleDriveSync = (function () {
    // Client IDs are meant to be public (unlike API tokens) — the real gate is the
    // Google sign-in + consent screen each user goes through, not a hidden secret.
    const CLIENT_ID = '575902569700-4l05lkmf0kbrgq5kdr58canigcvafv3j.apps.googleusercontent.com';
    // Every tool page requests this same full set of scopes (not just what this page
    // itself uses) so signing in once, from any tool, grants everything every other
    // tool needs too — no per-tool "reconnect" prompts later. Keep this identical to
    // the SCOPE constant in budget.html/cal.html any time a tool's needs change.
    const SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/calendar.events';
    const FILE_NAME = 'munny-data.json';
    const FILE_ID_KEY = 'munny_drive_file_id';
    const TOKEN_KEY = 'munny_google_token';

    let tokenClient = null;
    let accessToken = null;

    function getCachedFileId() {
      try { return localStorage.getItem(FILE_ID_KEY) || ''; } catch (e) { return ''; }
    }
    function setCachedFileId(id) {
      try {
        if (id) localStorage.setItem(FILE_ID_KEY, id);
        else localStorage.removeItem(FILE_ID_KEY);
      } catch (e) {}
    }

    function persistToken(token, expiresInSeconds, scope) {
      try {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          access_token: token,
          expires_at: Date.now() + (expiresInSeconds || 3600) * 1000,
          scope: scope || ''
        }));
      } catch (e) {}
    }
    function clearPersistedToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    // Google's token client never restores a session on its own after a reload — a
    // still-valid access token has to be saved and re-hydrated by hand. Once the real
    // expiry passes (usually ~1hr), the next Drive request 401s and clears it.
    function restoreSession() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { stored = null; }
      if (!stored || !stored.access_token || !stored.expires_at) return false;
      if (Date.now() > stored.expires_at - 60000) { clearPersistedToken(); return false; }
      accessToken = stored.access_token;
      return true;
    }

    function isSignedIn() {
      return !!accessToken;
    }

    // A token saved by a Drive-only sign-in (from another tool page), or by an earlier
    // version of this page that requested fewer Gmail scopes, is still valid for
    // isSignedIn() but will 403 on some/all Gmail calls — this checks the scope actually
    // granted at sign-in time against everything this page currently needs, so the UI
    // can ask to reconnect instead of just failing partway through an action.
    const REQUIRED_GMAIL_SCOPES = ['gmail.readonly', 'gmail.send', 'gmail.modify'];
    function hasGmailScope() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { stored = null; }
      if (!stored || typeof stored.scope !== 'string') return false;
      return REQUIRED_GMAIL_SCOPES.every(s => stored.scope.indexOf(s) !== -1);
    }

    function signIn() {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          reject(new Error('Google sign-in script hasn\'t loaded yet — try again in a moment.'));
          return;
        }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: () => {} // replaced per-request below
          });
        }
        let settled = false;
        // If the popup gets closed/dismissed without Google ever calling back
        // (e.g. blocked, or the user closes it), don't hang forever.
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error('Sign-in timed out — the popup may have been closed or blocked. Try again.'));
        }, 60000);
        tokenClient.callback = (resp) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { reject(new Error(resp.error)); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in, resp.scope);
          resolve(accessToken);
        };
        // prompt:'' asks Google to try a silent, invisible sign-in first — in Safari this
        // seems to open the popup, fail to complete quietly, and close itself before you
        // can interact with it. Forcing consent every time is a little more friction but
        // actually shows the real interactive screen instead of a flash-and-close window.
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });
    }

    async function api(url, options) {
      if (!accessToken) throw new Error('not signed in');
      const headers = Object.assign({ 'Authorization': 'Bearer ' + accessToken }, (options && options.headers) || {});
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      let resp;
      try {
        resp = await fetch(url, Object.assign({ cache: 'no-store' }, options, { headers, signal: controller.signal }));
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('Google Drive request timed out — check your connection and try again.');
        throw new Error('Network error talking to Google Drive: ' + e.message);
      } finally {
        clearTimeout(timer);
      }
      if (resp.status === 401) { accessToken = null; clearPersistedToken(); } // expired/revoked — isSignedIn() will now correctly report false
      return resp;
    }

    async function findFileId() {
      const cached = getCachedFileId();
      if (cached) return cached;
      const q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
      const resp = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      if (json.files && json.files.length) {
        setCachedFileId(json.files[0].id);
        return json.files[0].id;
      }
      return null;
    }

    async function createFile(dataObj) {
      const metadata = { name: FILE_NAME, mimeType: 'application/json' };
      const boundary = 'munnyboundary' + Date.now();
      const body =
        '--' + boundary + '\r\n' +
        'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
        JSON.stringify(metadata) + '\r\n' +
        '--' + boundary + '\r\n' +
        'Content-Type: application/json\r\n\r\n' +
        JSON.stringify(dataObj, null, 2) + '\r\n' +
        '--' + boundary + '--';
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
        body
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      setCachedFileId(json.id);
      return json.id;
    }

    async function load() {
      if (!accessToken) return null;
      const fileId = await findFileId();
      if (!fileId) return null;
      const resp = await api('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
      if (resp.status === 404) {
        setCachedFileId('');
        return null;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }

    async function save(dataObj) {
      if (!accessToken) throw new Error('not signed in');
      let fileId = getCachedFileId() || await findFileId();
      if (!fileId) {
        await createFile(dataObj);
        return true;
      }
      const resp = await api('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataObj, null, 2)
      });
      if (resp.status === 404) {
        setCachedFileId('');
        await createFile(dataObj);
        return true;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return true;
    }

    async function getUserEmail() {
      const resp = await api('https://www.googleapis.com/oauth2/v3/userinfo');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      return json.email || '';
    }

    // Google's error responses carry a real explanation (e.g. "Gmail API has not been
    // used in project ... before or it is disabled", or an insufficient-scope message) —
    // surfacing that instead of just the status code is the difference between a useful
    // error and a guessing game.
    async function errorFromResponse(resp) {
      try {
        const json = await resp.json();
        if (json && json.error && json.error.message) return json.error.message;
      } catch (e) {}
      return 'HTTP ' + resp.status;
    }

    // ---- Gmail (this page's addition — the other tool pages don't need these) ----
    async function gmailListInbox(maxResults) {
      const resp = await api('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=' + (maxResults || 20) + '&labelIds=INBOX');
      if (!resp.ok) throw new Error(await errorFromResponse(resp));
      const json = await resp.json();
      return json.messages || [];
    }

    async function gmailGetMessage(id, format) {
      const resp = await api('https://gmail.googleapis.com/gmail/v1/users/me/messages/' + id + '?format=' + (format || 'full'));
      if (!resp.ok) throw new Error(await errorFromResponse(resp));
      return resp.json();
    }

    // Returns every message in the thread (Gmail orders them oldest-first, which is
    // exactly the order a chat-style reading view wants) in one call, instead of one
    // request per message.
    async function gmailGetThread(threadId, format) {
      const resp = await api('https://gmail.googleapis.com/gmail/v1/users/me/threads/' + threadId + '?format=' + (format || 'full'));
      if (!resp.ok) throw new Error(await errorFromResponse(resp));
      return resp.json();
    }

    // No labelIds filter — unlike gmailListInbox, this searches the whole mailbox (Gmail's
    // own search syntax works here, e.g. "from:" / "subject:" / plain text), which by
    // Gmail's normal search behavior covers Inbox and archived mail alike while still
    // leaving out Spam/Trash unless the query itself asks for those with in:spam/in:trash.

      let suppressClick = false;
      let isUnread = isUnreadInitial;

      function updateAction(dir) {
        if (dir < 0) {
          actionEl.className = 'mail-swipe-action action-archive';
          actionEl.textContent = isArchived ? 'Unarchive' : 'Archive';
        } else if (dir > 0) {
          actionEl.className = 'mail-swipe-action action-read';
          actionEl.textContent = isUnread ? 'Mark read' : 'Mark unread';
        }
      }

      function onDown(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        dragging = true; decided = false; horizontal = false; dx = 0;
        startX = e.clientX; startY = e.clientY;
        el.style.transition = 'none';
      }
      function onMove(e) {
        if (!dragging) return;
        const curDx = e.clientX - startX;
        const curDy = e.clientY - startY;
        if (!decided) {
          if (Math.abs(curDx) < 8 && Math.abs(curDy) < 8) return;
          decided = true;
          horizontal = Math.abs(curDx) > Math.abs(curDy);
          if (horizontal && el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (err) {} }
        }
        if (!horizontal) return; // let the list scroll vertically as normal
        e.preventDefault();
        dx = Math.max(-MAX, Math.min(MAX, curDx));
        updateAction(dx);
        el.style.transform = 'translateX(' + dx + 'px)';
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        el.style.transition = 'transform .18s ease';
        if (horizontal && dx <= -THRESHOLD) {
          suppressClick = true;
          el.style.transform = 'translateX(-100%)';
          toggleArchiveMessage(id, el.closest('.mail-swipe-row'), isArchived);
        } else if (horizontal && dx >= THRESHOLD) {
          suppressClick = true;
          el.style.transform = 'translateX(0)';
          toggleReadMessage(id, el, isUnread).then(function (newIsUnread) { isUnread = newIsUnread; });
        } else {
          if (horizontal && Math.abs(dx) > 4) suppressClick = true;
          el.style.transform = 'translateX(0)';
        }
        decided = false; horizontal = false; dx = 0;
      }
      el.addEventListener('pointerdown', onDown);
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
      el.addEventListener('click', function (e) {
        if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
        openMessage(id);
      });
    }

    async function toggleArchiveMessage(id, rowEl, isArchived) {
      try {
        if (isArchived) {
          await GoogleDriveSync.gmailUnarchive(id);
          setMailStatus('Moved back to inbox.');
        } else {
          await GoogleDriveSync.gmailArchive(id);
          setMailStatus('Archived.');
        }
        setTimeout(() => {
          if (rowEl) rowEl.remove();
          if (openMessageId === id) closeDetail();
          const listEl = document.getElementById('mail-list');
          if (listEl && !listEl.querySelector('.mail-swipe-row')) {
            const empty = document.createElement('div');
            empty.className = 'mail-list-empty';
            empty.textContent = searchActive ? 'No messages found.' : 'Your inbox is empty.';
            listEl.appendChild(empty);
          }
        }, 180);
      } catch (e) {
        setMailStatus('Couldn\'t ' + (isArchived ? 'unarchive' : 'archive') + ': ' + e.message, true);
        const btn = rowEl && rowEl.querySelector('.mail-list-item');
        if (btn) { btn.style.transition = 'transform .18s ease'; btn.style.transform = 'translateX(0)'; }
      }
    }

    // Unlike archive, the row stays right where it is — only its unread styling (bold
    // sender/subject, colored timestamp) changes, via the existing CSS for .unread.
    // Applied optimistically so the swipe feels instant, then reverted if the API call
    // fails. Returns the resulting unread state so the caller's closure stays in sync
    // for any later swipe on the same row.
    async function toggleReadMessage(id, btnEl, wasUnread) {
      const nowUnread = !wasUnread;
      btnEl.classList.toggle('unread', nowUnread);
      try {
        if (wasUnread) {
          await GoogleDriveSync.gmailMarkRead(id);
          setMailStatus('Marked as read.');
        } else {
          await GoogleDriveSync.gmailMarkUnread(id);
          setMailStatus('Marked as unread.');
        }
        return nowUnread;
      } catch (e) {
        btnEl.classList.toggle('unread', wasUnread);
        setMailStatus('Couldn\'t update read status: ' + e.message, true);
        return wasUnread;
      }
    }

    // Same at every width — no separate detail pane to reset, just whatever's expanded
    // inline in the list.
    function closeDetail() {
      openMessageId = null;
      document.querySelectorAll('.mail-list-item.active').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.mail-inline-detail').forEach(el => el.remove());
    }

    // A tap always expands the message inline, right below its row — same behavior at
    // every screen size, there's no separate desktop detail pane to open instead.
    function openMessage(id) {
      return toggleInlineDetail(id);
    }

    // Tapping a row's header again collapses it — toggling the same id closes
    // it, tapping a different row closes whatever else was open first (only one message
    // expanded at a time), matching how the .mail-list-item click handler always calls
    // this same function regardless of which row is currently expanded.
    async function toggleInlineDetail(id) {
      const listEl = document.getElementById('mail-list');
      const row = listEl && listEl.querySelector('.mail-swipe-row[data-id="' + id + '"]');
      if (!listEl || !row) return;
      const btn = row.querySelector('.mail-list-item');
      const existing = listEl.querySelector('.mail-inline-detail[data-detail-for="' + id + '"]');

      if (existing) {
        existing.remove();
        if (btn) btn.classList.remove('active');
        openMessageId = null;
        return;
      }

      listEl.querySelectorAll('.mail-inline-detail').forEach(el => el.remove());
      listEl.querySelectorAll('.mail-list-item.active').forEach(el => el.classList.remove('active'));
      if (btn) btn.classList.add('active');
      openMessageId = id;

      const detailContainer = document.createElement('div');
      detailContainer.className = 'mail-inline-detail';
      detailContainer.dataset.detailFor = id;
      const loading = document.createElement('p');
      loading.className = 'mail-empty';
      loading.textContent = 'Loading…';
      detailContainer.appendChild(loading);
      row.insertAdjacentElement('afterend', detailContainer);

      try {
        const threadId = row.dataset.threadId;
        // Fetching the whole thread (not just this one message) both covers the single-
        // message case (a thread of one) and tells us whether this is actually a back-
        // and-forth conversation that should render as chat bubbles instead.
        const thread = threadId ? await GoogleDriveSync.gmailGetThread(threadId, 'full') : null;
        if (openMessageId !== id) return; // collapsed, or a different row opened, while this was in flight
        detailContainer.innerHTML = '';
        const messages = thread && thread.messages && thread.messages.length ? thread.messages : null;
        if (messages && messages.length > 1) {
          detailContainer.appendChild(await buildThreadContent(messages));
        } else {
          const msg = (messages && messages[0]) || await GoogleDriveSync.gmailGetMessage(id, 'full');
          detailContainer.appendChild(buildDetailContent(msg));
        }
      } catch (e) {
        if (openMessageId !== id) return;
        detailContainer.innerHTML = '';
        const err = document.createElement('p');
        err.className = 'mail-empty';
        err.textContent = 'Couldn\'t load this message: ' + e.message;
        detailContainer.appendChild(err);
      }
    }

    // Shared by the desktop side pane and the mobile inline expansion — same subject/
    // from/to/reply/body markup either way, just placed in a different container.
    // Flattens a message body to plain text for pasting into the Forward compose box —
    // the compose textarea is plain text only, so a rich (HTML-derived) body's links get
    // their URL appended in parens rather than silently dropped.
    function plainTextForForward(payload) {
      const built = buildEmailBody(payload);
      if (!built) return '';
      if (built.kind === 'plain') return built.text;
      return built.parts.map(p => p.type === 'link' ? (p.value + ' (' + p.href + ')') : p.value).join('');
    }

    // Standard "---------- Forwarded message ---------" block Gmail itself uses, so a
    // forward looks the same whether it started here or in Gmail proper.
    function buildForwardBody(msg) {
      const headers = msg.payload ? msg.payload.headers : [];
      const from = header(headers, 'From');
      const to = header(headers, 'To');
      const subject = header(headers, 'Subject') || '(no subject)';
      const ms = msg.internalDate ? parseInt(msg.internalDate, 10) : 0;
      const dateLine = ms ? 'Date: ' + new Date(ms).toLocaleString() + '\n' : '';
      return '---------- Forwarded message ---------\n' +
        'From: ' + from + '\n' +
        dateLine +
        'Subject: ' + subject + '\n' +
        'To: ' + to + '\n' +
        '\n' +
        plainTextForForward(msg.payload);
    }

    function buildDetailContent(msg) {
      const headers = msg.payload ? msg.payload.headers : [];
      const from = header(headers, 'From');
      const to = header(headers, 'To');
      const subject = header(headers, 'Subject') || '(no subject)';

      const wrap = document.createElement('div');

      const subjectEl = document.createElement('h2');
      subjectEl.className = 'mail-detail-subject';
      subjectEl.textContent = subject;
      wrap.appendChild(subjectEl);

      const fromEl = document.createElement('div');
      fromEl.className = 'mail-detail-meta';
      const fromLabel = document.createElement('strong');
      fromLabel.textContent = 'From: ';
      fromEl.appendChild(fromLabel);
      fromEl.appendChild(document.createTextNode(from));
      wrap.appendChild(fromEl);

      if (to) {
        const toEl = document.createElement('div');
        toEl.className = 'mail-detail-meta';
        const toLabel = document.createElement('strong');
        toLabel.textContent = 'To: ';
        toEl.appendChild(toLabel);
        toEl.appendChild(document.createTextNode(to));
        wrap.appendChild(toEl);
      }

      const actions = document.createElement('div');
      actions.className = 'mail-detail-actions';
      const replyBtn = document.createElement('button');
      replyBtn.className = 'save-btn export-btn';
      replyBtn.textContent = 'Reply';
      replyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openCompose({
          to: from,
          subject: /^re:/i.test(subject) ? subject : ('Re: ' + subject),
          threadId: msg.threadId
        });
      });
      actions.appendChild(replyBtn);

      const forwardBtn = document.createElement('button');
      forwardBtn.className = 'save-btn export-btn';
      forwardBtn.textContent = 'Forward';
      forwardBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openCompose({
          to: '',
          subject: /^fwd:/i.test(subject) ? subject : ('Fwd: ' + subject),
          body: buildForwardBody(msg)
          // No threadId — a forward goes to someone new and starts its own thread
          // rather than replying into this one.
        });
      });
      actions.appendChild(forwardBtn);
      wrap.appendChild(actions);

      const bodyEl = document.createElement('div');
      bodyEl.className = 'mail-detail-body';
      renderEmailBody(bodyEl, msg.payload);
      wrap.appendChild(bodyEl);

      return wrap;
    }

    // A back-and-forth thread renders like a chat conversation — own messages on the
    // right, the other side's on the left — instead of the single-message view's
    // From/To header block repeated per message, which is exactly the "metadata that
    // gets in the way" for reading a conversation back and forth.
    async function buildThreadContent(messages) {
      const myEmail = await getMyEmail();

      const wrap = document.createElement('div');

      const firstHeaders = messages[0].payload ? messages[0].payload.headers : [];
      const subject = header(firstHeaders, 'Subject') || '(no subject)';
      const subjectEl = document.createElement('h2');
      subjectEl.className = 'mail-detail-subject';
      subjectEl.textContent = subject;
      wrap.appendChild(subjectEl);

      const thread = document.createElement('div');
      thread.className = 'chat-thread';

      messages.forEach(m => {
        const headers = m.payload ? m.payload.headers : [];
        const from = header(headers, 'From');
        const mine = !!myEmail && extractEmailAddress(from) === myEmail;

        const row = document.createElement('div');
        row.className = 'chat-row ' + (mine ? 'chat-row-mine' : 'chat-row-theirs');

        const meta = document.createElement('div');
        meta.className = 'chat-meta';
        meta.textContent = mine ? formatDate(m.internalDate) : (shortSenderName(from) + ', ' + formatDate(m.internalDate));
        row.appendChild(meta);

        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble';
        renderEmailBody(bubble, m.payload, true);
        row.appendChild(bubble);

        thread.appendChild(row);
      });
      wrap.appendChild(thread);

      // Reply to whoever sent the most recent message *from the other side* — if I sent
      // the last message myself (e.g. I was the one who spoke last), replying should
      // still go back to them, not to my own address.
      let replyTarget = messages[messages.length - 1];
      for (let i = messages.length - 1; i >= 0; i--) {
        const h = messages[i].payload ? messages[i].payload.headers : [];
        if (extractEmailAddress(header(h, 'From')) !== myEmail) { replyTarget = messages[i]; break; }
      }
      const lastHeaders = replyTarget.payload ? replyTarget.payload.headers : [];
      const lastFrom = header(lastHeaders, 'From');
      const actions = document.createElement('div');
      actions.className = 'mail-detail-actions';
      const replyBtn = document.createElement('button');
      replyBtn.className = 'save-btn export-btn';
      replyBtn.textContent = 'Reply';
      replyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openCompose({
          to: lastFrom,
          subject: /^re:/i.test(subject) ? subject : ('Re: ' + subject),
          threadId: replyTarget.threadId
        });
      });
      actions.appendChild(replyBtn);

      // Forwards the most recent message in the conversation (whoever sent it) — same
      // "no threadId" reasoning as the single-message Forward: it's headed to someone
      // new, so it starts a fresh thread rather than joining this one.
      const lastMsg = messages[messages.length - 1];
      const forwardBtn = document.createElement('button');
      forwardBtn.className = 'save-btn export-btn';
      forwardBtn.textContent = 'Forward';
      forwardBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openCompose({
          to: '',
          subject: /^fwd:/i.test(subject) ? subject : ('Fwd: ' + subject),
          body: buildForwardBody(lastMsg)
        });
      });
      actions.appendChild(forwardBtn);
      wrap.appendChild(actions);

      return wrap;
    }

    let replyThreadId = null;

    function openCompose(prefill) {
      replyThreadId = (prefill && prefill.threadId) || null;
      document.getElementById('compose-to').value = (prefill && prefill.to) || '';
      document.getElementById('compose-subject').value = (prefill && prefill.subject) || '';
      document.getElementById('compose-body').value = (prefill && prefill.body) || '';
      const statusEl = document.getElementById('compose-status');
      if (statusEl) { statusEl.textContent = ''; statusEl.classList.remove('error'); }
      document.getElementById('compose-overlay').classList.add('open');
    }

    function closeCompose() {
      document.getElementById('compose-overlay').classList.remove('open');
      replyThreadId = null;
    }

    async function send() {
      const to = document.getElementById('compose-to').value.trim();
      const subject = document.getElementById('compose-subject').value.trim();
      const body = document.getElementById('compose-body').value;
      const statusEl = document.getElementById('compose-status');
      const sendBtn = document.getElementById('compose-send-btn');

      if (!to) {
        statusEl.classList.add('error');
        statusEl.textContent = 'Enter a recipient first.';
        return;
      }

      sendBtn.disabled = true;
      statusEl.classList.remove('error');
      statusEl.textContent = 'Sending…';

      try {
        const mime =
          'To: ' + to + '\r\n' +
          'Subject: ' + subject + '\r\n' +
          'Content-Type: text/plain; charset="UTF-8"\r\n' +
          'MIME-Version: 1.0\r\n\r\n' +
          body;
        await GoogleDriveSync.gmailSend(base64UrlEncode(mime), replyThreadId);
        statusEl.textContent = 'Sent.';
        setTimeout(closeCompose, 900);
      } catch (e) {
        statusEl.classList.add('error');
        statusEl.textContent = 'Send failed: ' + e.message;
      } finally {
        sendBtn.disabled = false;
      }
    }

    return { render, refreshInbox, runSearch, updateSearchClear, onSearchInput, clearSearch, openMessage, openCompose, closeCompose, send };
  })();

  /* ================= combined save / load ================= */
  // No data model yet for this tool — an empty object is a harmless placeholder that
  // won't disturb other tools' slices in the shared Drive file (see mergeAndSave).
  function collectAllData() {
    return {};
  }

  function applyLoadedData(saved) {
    // Nothing to populate yet.
  }

  // All tools share one Drive file (one sign-in, one Google account), each keeping its
  // own slice under `tools[CURRENT_TOOL]` so saving from one tool's page never touches
  // another tool's data. Pre-multi-tool saves have no `tools` wrapper at all — Budget
  // Planner was the only tool back then, so an unwrapped file is treated as its data.
  // Kept in sync with the same helpers in every other tool page.
  function withToolsWrapper(remote) {
    if (!remote) return {};
    if (remote.tools) return Object.assign({}, remote.tools);
    return { budget: remote };
  }

  function extractOwnToolData(remote) {
    return withToolsWrapper(remote)[CURRENT_TOOL] || null;
  }

  async function mergeAndSave(toolData) {
    const remote = await GoogleDriveSync.load();
    const tools = withToolsWrapper(remote);
    tools[CURRENT_TOOL] = toolData;
    await GoogleDriveSync.save({ tools: tools });
  }

  function setGoogleSignedInUi(signedIn) {
    const signinBtn = document.getElementById('google-signin-btn');
    if (signinBtn) signinBtn.hidden = signedIn;
    updateDropdownLabelFit();
  }

  async function showSignedInBanner() {
    const banner = document.getElementById('signed-in-banner');
    if (!banner) return;
    try {
      const email = await GoogleDriveSync.getUserEmail();
      banner.textContent = email || 'Signed in to Google Drive';
    } catch (e) {
      banner.textContent = 'Signed in to Google Drive'; // email lookup failed — still confirm sign-in
    }
  }

  async function handleGoogleSignIn() {
    const status = document.getElementById('save-status');
    status.style.color = 'var(--gold)';
    status.textContent = 'Signing in to Google…';
    try {
      await GoogleDriveSync.signIn();
      setGoogleSignedInUi(true);
      status.textContent = 'Loading your data from Drive…';
      const remote = await GoogleDriveSync.load();
      applyLoadedData(extractOwnToolData(remote));
      status.textContent = '';
      await showSignedInBanner();
      MailApp.render();
    } catch (e) {
      status.style.color = 'var(--expense)';
      status.textContent = 'Google sign-in failed: ' + e.message;
    }
  }

  async function loadApp() {
    // Google's sign-in popup needs a real click, so a brand-new sign-in can't happen
    // automatically on page load. But a still-valid access token from an earlier sign-in
    // (saved in localStorage) can be restored without any popup — so a refresh doesn't
    // force signing in again until that token actually expires (usually ~1hr).
    setGoogleSignedInUi(false);
    setAppearance(currentAppearance());
    syncToolMenu(CURRENT_TOOL);
    updateMailHeaderToolbarVisibility();
    updateTabLabelFit();

    if (GoogleDriveSync.restoreSession()) {
      setGoogleSignedInUi(true);
      const status = document.getElementById('save-status');
      status.style.color = 'var(--gold)';
      status.textContent = 'Loading your data from Drive…';
      try {
        const remote = await GoogleDriveSync.load();
        applyLoadedData(extractOwnToolData(remote));
        status.textContent = '';
        await showSignedInBanner();
      } catch (e) {
        status.style.color = 'var(--expense)';
        status.textContent = 'Google Drive load failed: ' + e.message;
        setGoogleSignedInUi(false);
      }
    }
    MailApp.render();
  }

  loadApp();
</script>

</body></html>
