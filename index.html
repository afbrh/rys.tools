<!DOCTYPE html>
<html lang="en">
<head>
<script>if(location.protocol==="http:"&&location.hostname==="rys.tools")location.replace("https://rys.tools"+location.pathname+location.search+location.hash);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ry's Tools</title>
<link rel="icon" href="logo.png">
<style>
  html,body{margin:0;background:#000;color:#d6d6d9;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  p{margin:0;color:#9b9ba1;font-size:15px}
  nav a{color:#d6d6d9;margin:0 10px;font-size:16px}
</style>
<script>
// Send people to the tool they used last; first-time visitors go to Maintenance.
(function () {
  var APPS = ["maintenance", "budget", "seasonal"], last = "";
  try { last = localStorage.getItem("rys_last_app") || ""; } catch (e) {}
  var app = APPS.indexOf(last) > -1 ? last : "maintenance";
  location.replace(app + ".html" + location.search + location.hash);
})();
</script>
</head>
<body>
<main>
  <p>Opening your tool&hellip;</p>
  <nav><a href="maintenance.html">Maintenance</a><a href="seasonal.html">Seasonal</a><a href="budget.html">Budget</a></nav>
</main>
</body>
</html>
