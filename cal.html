<!DOCTYPE html>
<html lang="en"><head>
<script>(function(){try{var a=localStorage.getItem('munny_appearance');if(a!=='light'&&a!=='dark'){a=(localStorage.getItem('munny_theme')==='light')?'light':'dark';}if(a==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ry's Tools</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Sans+Pro:wght@400;600&amp;display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async="" defer=""></script>
<style>
  :root {
    --paper: #F3E9CE;
    --paper-line: #D9C79C;
    --ink: #3B2A16;
    --ink-soft: #7A6142;
    --income: #3F6B33;
    --income-bg: #E4EDD7;
    --expense: #93402A;
    --expense-bg: #F1DCC9;
    --gold: #8A6423;
    --gold-bg: #EBDBAF;
    --danger: #93402A;
    --font-header: 'Source Sans Pro', sans-serif;
    --font-body: 'Source Sans Pro', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --bg-texture: none;
    --letter-spacing-header: -0.01em;
  }
  :root[data-theme="dark"] {
    --paper: #000000;
    --paper-line: #1C1C1C;
    --ink: #F0F0EA;
    --ink-soft: #8C8C84;
    --income: #6FCF7A;
    --income-bg: #101F13;
    --expense: #E2685A;
    --expense-bg: #241211;
    --gold: #D9B25E;
    --gold-bg: #1F1A0E;
    --danger: #EF5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-texture), var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    transition: background-color .15s ease, color .15s ease;
    padding: 0 20px 80px;
    overflow-x: hidden;
  }

  /* ---------- app shell / header (shared chrome — keep in sync with budget.html/email.html) ---------- */
  .app-shell { max-width: 820px; margin: 0 auto; }
  .app-header-sticky {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--paper);
    padding-top: 10px;
    /* Bigger than budget.html/email.html's 1px — the Upcoming box (see .cal-upcoming)
       lives inside this sticky header too now, so it needs real breathing room below
       it before the border, not just under .save-bar. */
    padding-bottom: 14px;
    width: 100vw;
    margin-left: 50%;
    transform: translateX(-50%);
    border-bottom: 1px solid var(--paper-line);
  }
  .app-header-inner { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .save-bar { display: flex; align-items: flex-start; justify-content: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  /* The tool dropdown now sits where the page title used to be, with the signed-in
     banner still stacked underneath it — everything in the header stays inline and
     wraps naturally at any width now, no more separate mobile layout/drawer. */
  .brand-block { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .tool-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-left: auto; }
  .tool-controls[hidden] { display: none; }
  .tool-dropdown { position: relative; }
  .tool-dropdown-toggle {
    height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border-radius: 17px;
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tool-dropdown-toggle:hover, .tool-dropdown-toggle.is-open { background: var(--paper-line); }
  .tool-dropdown-caret {
    font-size: 9px;
    color: var(--ink-soft);
    transition: transform .15s ease;
  }
  .tool-dropdown-toggle.is-open .tool-dropdown-caret { transform: rotate(180deg); }
  .tool-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 160px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 50;
  }
  .tool-dropdown-menu.expanded {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .tool-dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tool-dropdown-item:hover { background: var(--paper-line); color: var(--ink); }
  .tool-dropdown-item.active { color: var(--ink); background: var(--gold-bg); }
  .dropdown-label-short { display: none; }
  .save-bar.labels-short .dropdown-label-full { display: none; }
  .save-bar.labels-short .dropdown-label-short { display: inline; }
  /* Classic sun/moon slider switch — a plain single-click toggle (not a dropdown),
     not an actual draggable range input. margin-left: auto keeps it pinned to the
     right edge of the header at every width. Entirely CSS-driven off the same
     :root[data-theme="dark"] attribute setAppearance() already toggles, so the
     thumb's slide and each icon's color need no JS beyond the existing click
     handler — see .theme-toggle-icon/.theme-toggle-thumb below. */
  .theme-toggle-btn {
    position: relative;
    width: 56px;
    height: 34px;
    padding: 0;
    border-radius: 17px;
    background: none;
    border: 1.5px solid var(--ink);
    cursor: pointer;
    margin-left: auto;
    flex-shrink: 0;
  }
  .theme-toggle-btn:hover { background: var(--paper-line); }
  .theme-toggle-icon {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    color: var(--ink-soft);
    transition: color .15s ease;
    pointer-events: none;
  }
  .theme-toggle-icon.sun { left: 8px; color: var(--ink); }
  .theme-toggle-icon.moon { right: 8px; }
  :root[data-theme="dark"] .theme-toggle-icon.sun { color: var(--ink-soft); }
  :root[data-theme="dark"] .theme-toggle-icon.moon { color: var(--ink); }
  .theme-toggle-thumb {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--gold-bg);
    transition: transform .2s ease;
  }
  :root[data-theme="dark"] .theme-toggle-thumb { transform: translateX(22px); }
  .save-btn {
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  .save-btn:hover { opacity: 0.88; }
  .save-btn[hidden] { display: none; }
  .save-btn.export-btn {
    background: none;
    color: var(--ink);
    border: 1.5px solid var(--ink);
  }
  .save-btn.export-btn:hover { opacity: 1; background: var(--paper-line); }
  .save-status { font-size: 13px; color: var(--income); min-height: 16px; }
  .signed-in-banner {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: left;
    min-height: 16px;
  }
  .app-footnote {
    max-width: 820px;
    margin: 30px auto 0;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }

  /* ---------- Calendar tool ---------- */
  .cal-app { max-width: 860px; margin: 12px auto 0; }
  .cal-status-row { min-height: 18px; margin-bottom: 8px; }
  .cal-status { font-size: 13px; color: var(--gold); }
  .cal-status.error { color: var(--expense); }
  /* Lives inside .app-header-sticky (not .cal-app) as of 2026-09-21, so it stays
     pinned in view with the rest of the header instead of scrolling away. */
  .cal-upcoming { padding: 14px 0 0; }
  .cal-upcoming[hidden] { display: none; }
  .cal-upcoming-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .cal-upcoming-title {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: 0;
  }
  .cal-upcoming-list { display: flex; flex-direction: column; gap: 10px; }
  /* Compound selector so this beats .cal-agenda-time's --gold regardless of source
     order — a currently-in-progress event gets the same green used for income
     figures elsewhere, instead of the plain gold used for a future start time. */
  .cal-agenda-time.cal-upcoming-now { color: var(--income); font-weight: 700; }
  /* No bordered/height-constrained box any more — the month grid is just part of the
     normal page flow, and scrolling the page itself up/down is how you move between
     months (see .cal-month-section), growing one more month at a time as you near
     either edge (see attachInfiniteScroll). There's no prev/next/Today control. */
  .cal-weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .cal-weekday-row span {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .cal-month-heading {
    font-family: var(--font-header);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    letter-spacing: var(--letter-spacing-header);
    margin: 14px 2px 6px;
  }
  .cal-month-section:first-child .cal-month-heading { margin-top: 2px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day {
    aspect-ratio: 1 / 1;
    padding: 6px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    background: var(--paper);
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-family: var(--font-body);
    overflow: hidden;
  }
  .cal-day:hover { background: var(--paper-line); }
  .cal-day.is-today { border-color: var(--gold); border-width: 2px; }
  .cal-day.has-selected { background: var(--gold-bg); border-color: var(--gold); }
  .cal-day-num { font-size: 13px; font-weight: 600; color: var(--ink); font-family: var(--font-mono); }
  .cal-day-events { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .cal-event-chip {
    font-size: 10.5px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--gold-bg);
    color: var(--gold);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }
  .cal-event-chip.all-day { background: var(--income-bg); color: var(--income); }
  .cal-day-more { font-size: 10px; color: var(--ink-soft); }

  /* .cal-agenda-* below styles the items rendered into #cal-upcoming-list — either the
     next 3 events (renderUpcoming) or a tapped day's events (renderSelectedDay). Each
     one is its own card (border box), matching the E-Mail tool's per-message cards,
     rather than all sharing one outer box. */
  .cal-agenda-empty { color: var(--ink-soft); font-size: 14px; }
  /* Every item in both the Upcoming and single-day views opens that event for
     editing on click. */
  .cal-agenda-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 10px 12px;
    transition: background .12s ease;
  }
  .cal-agenda-item:hover { background: var(--paper-line); }
  /* The next-3-events view spans several different days, so each item is one line:
     date, then time, then title, left to right (.cal-agenda-row) — no location.
     renderSelectedDay's items (already scoped to one day via the box's own title) skip
     the date/row entirely and just show the time on its own line above the title. */
  .cal-agenda-row { display: flex; align-items: baseline; gap: 8px; }
  .cal-agenda-row .cal-agenda-date,
  .cal-agenda-row .cal-agenda-time { flex-shrink: 0; }
  .cal-agenda-row .cal-agenda-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-agenda-date {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
  }
  .cal-agenda-time { font-family: var(--font-mono); font-size: 12px; color: var(--gold); }
  .cal-agenda-title { font-weight: 600; font-size: 14px; color: var(--ink); }
  /* Flags an event you were invited to rather than created yourself — only the
     organizer (or a guest with guestsCanModify) can edit one of these, so opening it
     shows a read-only view instead of the normal editable form (see isEventEditable). */
  .cal-agenda-badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 1px 5px;
  }

  .cal-compose-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 1200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .cal-compose-overlay.open { display: flex; }
  .cal-compose-panel {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    width: 100%;
    max-width: 460px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    box-sizing: border-box;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .cal-compose-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-compose-head h2 {
    font-family: var(--font-header);
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: var(--letter-spacing-header);
  }
  .cal-compose-close {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 26px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
  }
  .cal-compose-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .cal-compose-field input {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-line);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .cal-compose-field input:focus { outline: none; border-color: var(--ink); }
  .cal-compose-field input:disabled { opacity: 0.55; cursor: not-allowed; }
  /* Delete sits on the far left (its own flex item, default flex-start) opposite
     status+Save on the far right (.cal-compose-actions-right, pinned via its own
     margin-left: auto — not justify-content: space-between on the parent, since that
     would misplace the right group when Delete is hidden and it's the only item left). */
  .cal-compose-actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .cal-compose-actions-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .cal-compose-status { font-size: 13px; color: var(--gold); }
  .cal-compose-status.error { color: var(--expense); }
  .save-btn.cal-delete-btn { background: none; color: var(--expense); border: 1.5px solid var(--expense); }
  .save-btn.cal-delete-btn:hover { background: var(--expense); color: var(--paper); }

  @media (max-width: 680px) {
    .cal-day { padding: 4px; gap: 2px; }
    .cal-day-num { font-size: 12px; }
    .cal-event-chip { font-size: 9px; padding: 1px 4px; }
    /* Anything under 16px makes iOS Safari zoom the whole page in on focus. */
    .cal-compose-field input { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-header-sticky">
  <div class="app-header-inner">
  <div class="save-bar">
    <div class="brand-block">
      <div class="tool-dropdown">
        <button class="tool-dropdown-toggle" id="tool-dropdown-toggle" onclick="toggleToolMenu(event)" aria-haspopup="true" aria-expanded="false">
          <span id="tool-dropdown-label" class="dropdown-label-full">Calendar</span>
          <span id="tool-dropdown-label-short" class="dropdown-label-short" aria-hidden="true">C</span>
          <span class="tool-dropdown-caret">&#9662;</span>
        </button>
        <div class="tool-dropdown-menu" id="tool-menu" role="menu" aria-label="Tool">
          <button type="button" class="tool-dropdown-item" data-value="budget" role="menuitemradio" onclick="setActiveTool('budget')">Budget Planner</button>
          <button type="button" class="tool-dropdown-item" data-value="email" role="menuitemradio" onclick="setActiveTool('email')">E-Mail</button>
          <button type="button" class="tool-dropdown-item" data-value="calendar" role="menuitemradio" onclick="setActiveTool('calendar')">Calendar</button>
          <button type="button" class="tool-dropdown-item" data-value="scratch" role="menuitemradio" onclick="setActiveTool('scratch')">Scratch</button>
        </div>
      </div>
      <div class="signed-in-banner" id="signed-in-banner"></div>
    </div>
    <div class="tool-controls" id="tool-controls">
      <button class="save-btn export-btn" id="google-signin-btn" onclick="handleGoogleSignIn()">Google Sign-In</button>
      <span class="save-status" id="save-status"></span>
    </div>
    <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleAppearance()" aria-label="Switch to light mode">
      <span class="theme-toggle-thumb"></span>
      <svg class="theme-toggle-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      <svg class="theme-toggle-icon moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
  <div class="cal-upcoming" id="cal-upcoming" hidden="">
    <div class="cal-upcoming-head">
      <h2 class="cal-upcoming-title" id="cal-upcoming-title">Upcoming</h2>
      <button type="button" class="save-btn" id="cal-add-event-btn" onclick="CalendarApp.openCompose()" hidden="">+ Add event</button>
    </div>
    <div class="cal-upcoming-list" id="cal-upcoming-list"></div>
  </div>
  </div>
  </div>

  <div id="app-content">
  <div class="cal-app" id="cal-app">
    <div class="cal-status-row"><span class="cal-status" id="cal-status"></span></div>
    <div class="cal-weekday-row">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div id="cal-months"></div>
  </div>
  </div>
  <p class="app-footnote">Ry's Tools</p>

  <div class="cal-compose-overlay" id="cal-compose-overlay" onclick="if (event.target === this) CalendarApp.closeCompose()">
    <div class="cal-compose-panel">
      <div class="cal-compose-head">
        <h2 id="cal-compose-heading">New event</h2>
        <button type="button" class="cal-compose-close" onclick="CalendarApp.closeCompose()" aria-label="Close">&times;</button>
      </div>
      <label class="cal-compose-field">
        <span>Title</span>
        <input type="text" id="cal-compose-title">
      </label>
      <label class="cal-compose-field">
        <span>Start time (leave blank for all-day)</span>
        <input type="time" id="cal-compose-start-time">
      </label>
      <label class="cal-compose-field">
        <span>Location (optional)</span>
        <input type="text" id="cal-compose-location">
      </label>
      <div class="cal-compose-actions">
        <button type="button" class="save-btn cal-delete-btn" id="cal-compose-delete-btn" onclick="CalendarApp.deleteEvent()" hidden="">Delete</button>
        <div class="cal-compose-actions-right">
          <span class="cal-compose-status" id="cal-compose-status"></span>
          <button type="button" class="save-btn" id="cal-compose-save-btn" onclick="CalendarApp.saveEvent()">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function setAppearance(appearance) {
    if (appearance === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      appearance = 'light';
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem('munny_appearance', appearance); } catch (e) {}
    syncThemeToggle(appearance);
  }

  function toggleAppearance() {
    setAppearance(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }

  // Shrinks the tool dropdown's toggle label to a single initial only when the
  // current label text would otherwise force something onto a new line. Re-checked
  // whenever a label's text changes or the window resizes, never a fixed viewport
  // breakpoint. Kept in sync with the same function in budget.html/email.html. The
  // theme toggle isn't part of this check — it just wraps to its own line via
  // .save-bar's flex-wrap if it doesn't fit, since "Light"/"Dark" are already as
  // short as they can get.
  function updateDropdownLabelFit() {
    const saveBar = document.querySelector('.save-bar');
    const toolDropdown = document.querySelector('.tool-dropdown');
    const toolControls = document.getElementById('tool-controls');
    if (!saveBar || !toolDropdown) return;

    function rowTops() {
      const els = [toolDropdown];
      if (toolControls && !toolControls.hidden) els.push(toolControls);
      return els.map(function (el) { return Math.round(el.getBoundingClientRect().top); });
    }

    function sameRow(tops) {
      return tops.every(function (t) { return t === tops[0]; });
    }

    saveBar.classList.remove('labels-short');
    if (sameRow(rowTops())) return;

        const isAllDay = !!ev.start.date;
        const start = isAllDay ? new Date(startStr + 'T00:00:00') : new Date(startStr);
        const end = endStr ? (isAllDay ? new Date(endStr + 'T00:00:00') : new Date(endStr)) : null;
        const isHappeningNow = !!end && start <= now && now < end;
        const editable = isEventEditable(ev);

        const item = document.createElement('div');
        item.className = 'cal-agenda-item';

        // Date, time and title all on one line here — no location, unlike
        // renderSelectedDay's fuller per-event layout below.
        const row = document.createElement('div');
        row.className = 'cal-agenda-row';
        const dateLine = document.createElement('div');
        dateLine.className = 'cal-agenda-date';
        dateLine.textContent = relativeDayLabel(start);
        row.appendChild(dateLine);
        const time = document.createElement('div');
        time.className = 'cal-agenda-time' + (isHappeningNow ? ' cal-upcoming-now' : '');
        time.textContent = isHappeningNow ? 'Now' : (isAllDay ? 'All day' : formatTime(start));
        row.appendChild(time);
        const title = document.createElement('div');
        title.className = 'cal-agenda-title';
        title.textContent = ev.summary || '(No title)';
        row.appendChild(title);
        if (!editable) row.appendChild(buildInvitedBadge());
        item.appendChild(row);

        attachEditHandlers(item, {
          id: ev.id,
          title: ev.summary || '(No title)',
          location: ev.location || '',
          isAllDay: isAllDay,
          start: start,
          end: end,
          editable: editable
        });

        listEl.appendChild(item);
      });
    }

    // Starts at the floor (see getMinDate — "last week", the topmost date the page will
    // ever load) and loads every month through next month, then grows forward one month
    // at a time as the page nears its bottom edge (see attachInfiniteScroll) — it
    // never grows past the floor at the top. Runs once per page load.
    function initMonths() {
      monthsInitialized = true;
      const monthsEl = document.getElementById('cal-months');
      if (!monthsEl) return;
      const now = new Date();
      monthsEl.innerHTML = '';
      monthEntries = [];

      let nextMonthYear = now.getFullYear(), nextMonthMonth = now.getMonth() + 1;
      if (nextMonthMonth > 11) { nextMonthMonth = 0; nextMonthYear++; }
      const endIndex = nextMonthYear * 12 + nextMonthMonth;

      const minDate = getMinDate();
      let year = minDate.getFullYear(), month = minDate.getMonth();
      while (year * 12 + month <= endIndex) {
        monthsEl.appendChild(buildMonthSection(year, month));
        monthEntries.push({ year: year, month: month });
        month++; if (month > 11) { month = 0; year++; }
      }

      attachInfiniteScroll();
      // Land on today once the layout has settled, so there's no "Today" button to need.
      requestAnimationFrame(function () {
        const todayEl = document.querySelector('.cal-day[data-date="' + dateKey(now) + '"]');
        if (todayEl) todayEl.scrollIntoView({ block: 'center' });
      });
    }

    function buildMonthSection(year, month) {
      const section = document.createElement('div');
      section.className = 'cal-month-section';

      const heading = document.createElement('div');
      heading.className = 'cal-month-heading';
      heading.textContent = MONTH_NAMES[month] + ' ' + year;
      section.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'cal-grid';
      section.appendChild(grid);

      const todayKey = dateKey(new Date());
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const minDate = getMinDate();
      const isFloorMonth = (year === minDate.getFullYear() && month === minDate.getMonth());
      const startDay = isFloorMonth ? minDate.getDate() : 1;

      // Leading blanks keep each month's day-1 lined up under the right weekday column
      // in the sticky header above — no trailing padding needed since the next month's
      // section just continues directly underneath. The floor month skips this: its
      // start date is always a Sunday by construction, so it already lines up under
      // the first column with nothing blank (and nothing earlier) ahead of it.
      if (!isFloorMonth) {
        const firstDay = new Date(year, month, 1);
        for (let i = 0; i < firstDay.getDay(); i++) {
          grid.appendChild(document.createElement('div'));
        }
      }
      for (let d = startDay; d <= daysInMonth; d++) {
        const key = dateKey(new Date(year, month, d));

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cal-day'
          + (key === todayKey ? ' is-today' : '')
          + (key === selectedDate ? ' has-selected' : '');
        btn.dataset.date = key;

        const num = document.createElement('div');
        num.className = 'cal-day-num';
        num.textContent = d;
        btn.appendChild(num);

        const evWrap = document.createElement('div');
        evWrap.className = 'cal-day-events';
        btn.appendChild(evWrap);

        btn.addEventListener('click', function () { selectDate(key); });
        grid.appendChild(btn);
      }

      return section;
    }

    function loadEventsForMonth(year, month) {
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      // Clear this month's own dates before repopulating — loadEventsForMonth can be
      // called again for an already-loaded month (e.g. right after signing in), and
      // without this a refetch would just pile duplicate chips onto the existing ones.
      for (let d = 1; d <= daysInMonth; d++) {
        delete eventsByDate[year + '-' + pad2(month + 1) + '-' + pad2(d)];
      }
      if (!GoogleDriveSync.isSignedIn() || !GoogleDriveSync.hasCalendarScope()) return;

      const start = new Date(year, month, 1);
      const end = new Date(year, month + 1, 1);
      GoogleDriveSync.gcalListEvents(start.toISOString(), end.toISOString()).then(function (events) {
        events.forEach(function (ev) {
          const startStr = ev.start && (ev.start.date || ev.start.dateTime);
          if (!startStr) return;
          const isAllDay = !!ev.start.date;
          const startDate = isAllDay ? new Date(startStr + 'T00:00:00') : new Date(startStr);
          const endStr = ev.end && (ev.end.date || ev.end.dateTime);
          const endDate = endStr ? (isAllDay ? new Date(endStr + 'T00:00:00') : new Date(endStr)) : null;
          const key = dateKey(startDate);
          if (!eventsByDate[key]) eventsByDate[key] = [];
          eventsByDate[key].push({
            id: ev.id,
            title: ev.summary || '(No title)',
            location: ev.location || '',
            isAllDay: isAllDay,
            start: startDate,
            end: endDate,
            editable: isEventEditable(ev)
          });
        });
        Object.keys(eventsByDate).forEach(function (key) {
          eventsByDate[key].sort(function (a, b) {
            if (a.isAllDay !== b.isAllDay) return a.isAllDay ? -1 : 1;
            return a.start - b.start;
          });
        });
        renderGridEvents();
        if (selectedDate) renderSelectedDay(selectedDate);
      }).catch(function (e) {
        setStatus("Couldn't load events: " + e.message, true);
      });
    }

    // Scrolling the page itself near either edge of the loaded range loads one more
    // month there — this is the whole "navigation" model now, replacing the old
    // prev/next/Today buttons. No bordered box any more — this watches the page's own
    // scroll position, not an internal scrollable element.
    function attachInfiniteScroll() {
      const TRIGGER_PX = 300;
      window.addEventListener('scroll', function () {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight;
        if (scrollTop < TRIGGER_PX) {
          prependMonth();
        } else if (scrollHeight - scrollTop - window.innerHeight < TRIGGER_PX) {
          appendMonth();
        }
      });
    }

    function prependMonth() {
      if (isPrepending || monthEntries.length === 0) return;
      const first = monthEntries[0];
      // initMonths() always starts exactly at the floor month, so in practice this is
      // already true from the very first scroll — kept explicit as the real guarantee
      // behind "no rows before last week," not just a byproduct of the starting state.
      if (first.year * 12 + first.month <= minDateIndex()) return;
      let year = first.year, month = first.month - 1;
      if (month < 0) { month = 11; year--; }
      if (monthEntries.length >= MAX_MONTHS_RANGE) return;

      isPrepending = true;
      const monthsEl = document.getElementById('cal-months');
      const prevScrollHeight = document.documentElement.scrollHeight;
      monthsEl.insertBefore(buildMonthSection(year, month), monthsEl.firstChild);
      monthEntries.unshift({ year: year, month: month });
      loadEventsForMonth(year, month);
      // Keep the currently-visible content pinned in place instead of jumping down
      // when new content is inserted above it.
      requestAnimationFrame(function () {
        window.scrollBy(0, document.documentElement.scrollHeight - prevScrollHeight);
        isPrepending = false;
      });
    }

    function appendMonth() {
      if (isAppending || monthEntries.length === 0) return;
      const last = monthEntries[monthEntries.length - 1];
      let year = last.year, month = last.month + 1;
      if (month > 11) { month = 0; year++; }
      if (monthEntries.length >= MAX_MONTHS_RANGE) return;

      isAppending = true;
      const monthsEl = document.getElementById('cal-months');
      monthsEl.appendChild(buildMonthSection(year, month));
      monthEntries.push({ year: year, month: month });
      loadEventsForMonth(year, month);
      isAppending = false;
    }

    // Extends the loaded range (in either direction, bounded by MAX_MONTHS_RANGE going
    // forward and by the floor going backward) until it covers the given month — used
    // when creating an event further out than what's currently loaded, so jumping to it
    // doesn't need a missing day cell. A target month earlier than the floor just
    // clamps to the floor — that date's day cell was never meant to exist.
    function ensureMonthLoaded(year, month) {
      if (monthEntries.length === 0) return;
      const targetIndex = Math.max(year * 12 + month, minDateIndex());
      const monthsEl = document.getElementById('cal-months');

      let first = monthEntries[0];
      while (targetIndex < first.year * 12 + first.month && first.year * 12 + first.month > minDateIndex()) {
        let y = first.year, m = first.month - 1;
        if (m < 0) { m = 11; y--; }
        monthsEl.insertBefore(buildMonthSection(y, m), monthsEl.firstChild);
        monthEntries.unshift({ year: y, month: m });
        loadEventsForMonth(y, m);
        first = monthEntries[0];
      }

      let last = monthEntries[monthEntries.length - 1];
      while (targetIndex > last.year * 12 + last.month && monthEntries.length < MAX_MONTHS_RANGE) {
        let y = last.year, m = last.month + 1;
        if (m > 11) { m = 0; y++; }
        monthsEl.appendChild(buildMonthSection(y, m));
        monthEntries.push({ year: y, month: m });
        loadEventsForMonth(y, m);
        last = monthEntries[monthEntries.length - 1];
      }
    }

    function renderGridEvents() {
      const MAX_CHIPS = 2;
      document.querySelectorAll('.cal-day').forEach(function (dayEl) {
        const key = dayEl.dataset.date;
        const evWrap = dayEl.querySelector('.cal-day-events');
        if (!evWrap) return;
        evWrap.innerHTML = '';
        const evs = eventsByDate[key] || [];
        evs.slice(0, MAX_CHIPS).forEach(function (ev) {
          const chip = document.createElement('div');
          chip.className = 'cal-event-chip' + (ev.isAllDay ? ' all-day' : '');
          // Just the time, not the title — keeps every box the same fixed height
          // regardless of how long an event's name is. The full name is still one
          // hover away via the title attribute.
          chip.textContent = ev.isAllDay ? 'All day' : formatTime(ev.start);
          chip.title = ev.title;
          evWrap.appendChild(chip);
        });
        if (evs.length > MAX_CHIPS) {
          const more = document.createElement('div');
          more.className = 'cal-day-more';
          more.textContent = '+' + (evs.length - MAX_CHIPS) + ' more';
          evWrap.appendChild(more);
        }
      });
    }

    // Tapping a day cell selects it, unless it's already the selected one — a second
    // tap on the same day clears the selection instead. Either way this is the only
    // entry point a day-cell click goes through (see applySelection/clearSelection).
    function selectDate(key) {
      if (selectedDate === key) {
        clearSelection();
      } else {
        applySelection(key);
      }
    }

    // Unlike selectDate, always selects the given day regardless of what's currently
    // selected — used right after creating an event, where the intent is "show me what
    // I just added" unconditionally, not "toggle."
    function applySelection(key) {
      selectedDate = key;
      document.querySelectorAll('.cal-day').forEach(function (el) {
        el.classList.toggle('has-selected', el.dataset.date === key);
      });
      renderSelectedDay(key);
      updateAddEventVisibility();
    }

    function clearSelection() {
      selectedDate = null;
      updateAddEventVisibility();
      document.querySelectorAll('.cal-day').forEach(function (el) { el.classList.remove('has-selected'); });
      const titleEl = document.getElementById('cal-upcoming-title');
      if (titleEl) titleEl.textContent = 'Upcoming';
      loadUpcoming();
    }

    // A tapped day's events take over the Upcoming box in place (title becomes that
    // day's date, list becomes that day's events) rather than showing in a separate
    // box below the grid — restored to the actual next-3-events view by clearSelection.
    function renderSelectedDay(key) {
      const titleEl = document.getElementById('cal-upcoming-title');
      const listEl = document.getElementById('cal-upcoming-list');
      if (!listEl) return;

      const d = new Date(key + 'T00:00:00');
      if (titleEl) titleEl.textContent = WEEKDAY_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();

      const evs = eventsByDate[key] || [];
      listEl.innerHTML = '';
      if (!evs.length) {
        const empty = document.createElement('div');
        empty.className = 'cal-agenda-empty';
        empty.textContent = 'No events.';
        listEl.appendChild(empty);
        return;
      }
      evs.forEach(function (ev) {
        const item = document.createElement('div');
        item.className = 'cal-agenda-item';

        // Same single-line layout as renderUpcoming's items (time + title, no
        // location) — just without a .cal-agenda-date, since every item here is
        // already the same day, which the box's own title (set above) already says.
        const row = document.createElement('div');
        row.className = 'cal-agenda-row';
        const time = document.createElement('div');
        time.className = 'cal-agenda-time';
        time.textContent = ev.isAllDay ? 'All day' : formatTime(ev.start);
        row.appendChild(time);
        const title = document.createElement('div');
        title.className = 'cal-agenda-title';
        title.textContent = ev.title;
        row.appendChild(title);
        if (ev.editable === false) row.appendChild(buildInvitedBadge());
        item.appendChild(row);

        // ev is already the normalized shape (from eventsByDate) attachEditHandlers
        // expects, so it's passed straight through.
        attachEditHandlers(item, ev);

        listEl.appendChild(item);
      });
    }

    // Opens the compose overlay pre-filled for editing when this item is activated —
    // used by both renderUpcoming and renderSelectedDay's items. ev is the normalized
    // shape eventsByDate stores: {id, title, location, isAllDay, start, end}.
    function buildInvitedBadge() {
      const badge = document.createElement('span');
      badge.className = 'cal-agenda-badge';
      badge.textContent = 'Invited';
      return badge;
    }

    function attachEditHandlers(item, ev) {
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');
      item.addEventListener('click', function () { openCompose(ev); });
      item.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCompose(ev); }
      });
    }

    function setComposeStatus(text, isError) {
      const el = document.getElementById('cal-compose-status');
      if (!el) return;
      el.textContent = text || '';
      el.classList.toggle('error', !!isError);
    }

    // Same form either way — Title, Start time (blank means all-day), Location — so
    // creating and editing look almost identical. With no argument: a blank form for
    // whichever day is currently selected ("+ Add event" only ever shows once one is —
    // see updateAddEventVisibility), which becomes the new event's fixed date (no picker
    // for it, tracked in composeDate rather than a form field at all). With an event
    // (the same normalized shape eventsByDate stores — {id, title, location, isAllDay,
    // start, end}, a Date object per start/end), it prefills the form and switches to
    // editing that event instead — the only visible difference is the Delete button.
    // Its date is likewise fixed (composeDate = its existing date, not editable), so
    // editing can no longer move an event to a different day — a deliberate loss of
    // that capability in exchange for the two forms actually looking the same.
    const COMPOSE_FIELD_IDS = ['cal-compose-title', 'cal-compose-start-time', 'cal-compose-location'];

    function openCompose(ev) {
      const overlay = document.getElementById('cal-compose-overlay');
      if (!overlay) return;
      const isCreating = !ev;
      editingEventId = ev ? ev.id : null;
      editingOriginalDate = ev ? ev.start : null;
      editingReadOnly = !!(ev && ev.editable === false);
      composeDate = ev ? dateKey(ev.start) : (selectedDate || dateKey(new Date()));

      const headingEl = document.getElementById('cal-compose-heading');
      if (headingEl) headingEl.textContent = editingReadOnly ? 'Invited event' : (ev ? 'Edit event' : 'New event');
      const saveBtn = document.getElementById('cal-compose-save-btn');
      if (saveBtn) {
        saveBtn.textContent = ev ? 'Save changes' : 'Save';
        saveBtn.hidden = editingReadOnly;
      }
      // Only for an existing event that's actually yours to edit — nothing to delete
      // when creating, and no delete action offered on someone else's invited event.
      const deleteBtn = document.getElementById('cal-compose-delete-btn');
      if (deleteBtn) deleteBtn.hidden = isCreating || editingReadOnly;

      document.getElementById('cal-compose-title').value = ev ? ev.title : '';
      document.getElementById('cal-compose-location').value = ev ? ev.location : '';
      // Blank means all-day for both creating and editing — a currently-all-day event
      // opens with this blank too, exactly like a new event does by default.
      document.getElementById('cal-compose-start-time').value = (ev && !ev.isAllDay) ? timeInputValue(ev.start) : '';

      COMPOSE_FIELD_IDS.forEach(function (id) {
        const el = document.getElementById(id);
        if (el) el.disabled = editingReadOnly;
      });
      setComposeStatus(editingReadOnly ? "You're invited to this event — only the organizer can edit it." : '');
      overlay.classList.add('open');
      if (!editingReadOnly) document.getElementById('cal-compose-title').focus();
    }

    function closeCompose() {
      const overlay = document.getElementById('cal-compose-overlay');
      if (overlay) overlay.classList.remove('open');
      editingEventId = null;
      editingOriginalDate = null;
      editingReadOnly = false;
      composeDate = null;
      // Undo the read-only lockout unconditionally, so a future "+ Add event" (or
      // editing an event that IS yours) doesn't inherit disabled fields from whatever
      // was open last.
      COMPOSE_FIELD_IDS.forEach(function (id) {
        const el = document.getElementById(id);
        if (el) el.disabled = false;
      });
    }

    async function saveEvent() {
      // Belt-and-suspenders — the Save button is hidden for a read-only (invited)
      // event, so this shouldn't be reachable, but a PATCH attempt here would just
      // reproduce the confusing "Invalid start time." error this whole thing exists
      // to avoid.
      if (editingReadOnly) return;

      const title = document.getElementById('cal-compose-title').value.trim();
      const date = composeDate;
      const location = document.getElementById('cal-compose-location').value.trim();
      const saveBtn = document.getElementById('cal-compose-save-btn');

      const editingId = editingEventId;

      if (!title) { setComposeStatus('Title is required.', true); return; }
      if (!date) { setComposeStatus('Date is required.', true); return; }

      const eventResource = { summary: title };
      // Sent unconditionally, even empty — a PATCH only touches fields present in the
      // body, so clearing this field out during an edit needs an explicit '' to
      // actually clear it server-side rather than silently leaving the old value.
      eventResource.location = location;

      // Same rule for creating and editing: a blank Start time means all-day. A timed
      // event is always fixed at 15 minutes long, computed from the start rather than
      // a separate End time field — there's only ever one time field in this form.
      const startTimeVal = document.getElementById('cal-compose-start-time').value;
      const isAllDay = !startTimeVal;

      if (isAllDay) {
        // The Calendar API's end.date is exclusive, so a one-day all-day event still
        // needs an end date of the *next* day.
        const endDate = new Date(date + 'T00:00:00');
        endDate.setDate(endDate.getDate() + 1);
        eventResource.start = { date: date };
        eventResource.end = { date: dateKey(endDate) };
      } else {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const startStr = localDateTimeString(date, startTimeVal);
        // Computed from the start, not read from a field — 15 minutes is fixed, and
        // this recomputes the date too (via dateKey), not just the time, in case a
        // start right before midnight pushes the end into the next day.
        const endDateObj = new Date(startStr);
        endDateObj.setMinutes(endDateObj.getMinutes() + 15);
        eventResource.start = { dateTime: startStr, timeZone: timeZone };
        eventResource.end = { dateTime: localDateTimeString(dateKey(endDateObj), timeInputValue(endDateObj)), timeZone: timeZone };
      }

      if (saveBtn) saveBtn.disabled = true;
      setComposeStatus('Saving…');
      try {
        if (editingId) {
          await GoogleDriveSync.gcalUpdateEvent(editingId, eventResource);
        } else {
          await GoogleDriveSync.gcalCreateEvent(eventResource);
        }
        closeCompose();
        // Jump to the event's day and refresh so it shows up right away —
        // ensureMonthLoaded/applySelection are effectively no-ops in practice here,
        // since this date was always already-visible (it's either the day that was
        // already selected, or an existing event's own unchangeable date), but stay
        // cheap and harmless as a defensive fallback.
        const d = new Date(date + 'T00:00:00');
        ensureMonthLoaded(d.getFullYear(), d.getMonth());
        applySelection(date);
        loadEventsForMonth(d.getFullYear(), d.getMonth());
        const dayEl = document.querySelector('.cal-day[data-date="' + date + '"]');
        if (dayEl) dayEl.scrollIntoView({ block: 'center' });
      } catch (e) {
        setComposeStatus("Couldn't save event: " + e.message, true);
      } finally {
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    async function deleteEvent() {
      // Same belt-and-suspenders reasoning as saveEvent's guard — the button is hidden
      // for read-only/new-event states, this just makes sure a stray call can't do
      // anything even if it somehow gets through.
      if (!editingEventId || editingReadOnly) return;

      const title = document.getElementById('cal-compose-title').value.trim() || 'this event';
      if (!window.confirm('Delete "' + title + '"? This can\'t be undone.')) return;

      const eventId = editingEventId;
      const eventDate = editingOriginalDate;
      const deleteBtn = document.getElementById('cal-compose-delete-btn');

      if (deleteBtn) deleteBtn.disabled = true;
      setComposeStatus('Deleting…');
      try {
        await GoogleDriveSync.gcalDeleteEvent(eventId);
        closeCompose();
        // loadEventsForMonth's own callback already re-renders the selected day (if
        // there is one) once the refetch resolves — only need the explicit Upcoming
        // refresh for the case this event was reached from that list instead, with no
        // day selected (see the same pattern/reasoning in refreshView).
        if (eventDate) loadEventsForMonth(eventDate.getFullYear(), eventDate.getMonth());
        if (!selectedDate) loadUpcoming();
      } catch (e) {
        setComposeStatus("Couldn't delete event: " + e.message, true);
      } finally {
        if (deleteBtn) deleteBtn.disabled = false;
      }
    }

    return { render, openCompose, closeCompose, saveEvent, deleteEvent };
  })();

  function setGoogleSignedInUi(signedIn) {
    const signinBtn = document.getElementById('google-signin-btn');
    if (signinBtn) signinBtn.hidden = signedIn;
    updateDropdownLabelFit();
  }

  async function showSignedInBanner() {
    const banner = document.getElementById('signed-in-banner');
    if (!banner) return;
    try {
      const email = await GoogleDriveSync.getUserEmail();
      banner.textContent = email || 'Signed in to Google';
    } catch (e) {
      banner.textContent = 'Signed in to Google'; // email lookup failed — still confirm sign-in
    }
  }

  async function handleGoogleSignIn() {
    const status = document.getElementById('save-status');
    status.style.color = 'var(--gold)';
    status.textContent = 'Signing in to Google…';
    try {
      await GoogleDriveSync.signIn();
      setGoogleSignedInUi(true);
      status.textContent = '';
      await showSignedInBanner();
      CalendarApp.render();
    } catch (e) {
      status.style.color = 'var(--expense)';
      status.textContent = 'Google sign-in failed: ' + e.message;
    }
  }

  async function loadApp() {
    // A still-valid access token from an earlier sign-in (saved in localStorage) can be
    // restored without any popup — so a refresh doesn't force signing in again until that
    // token actually expires. If it already has, trySilentSignIn attempts a silent,
    // invisible reauth before falling back to requiring an explicit "Google Sign-In"
    // click — so a browser that's still logged into Google (and has granted this app
    // access before) stays signed in indefinitely, same as Gmail itself.
    setGoogleSignedInUi(false);
    setAppearance(currentAppearance());
    syncToolMenu(CURRENT_TOOL);
    updateTabLabelFit();

    let signedIn = GoogleDriveSync.restoreSession();
    if (!signedIn) signedIn = await GoogleDriveSync.trySilentSignIn();
    if (signedIn) {
      setGoogleSignedInUi(true);
      await showSignedInBanner();
    }
    CalendarApp.render();
  }

  loadApp();
</script>

</body></html>
