<!DOCTYPE html>
<html lang="en"><head>
<script>(function(){try{var a=localStorage.getItem('munny_appearance');if(a!=='light'&&a!=='dark'){a=(localStorage.getItem('munny_theme')==='light')?'light':'dark';}if(a==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ry's Tools</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Sans+Pro:wght@400;600&amp;display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async="" defer=""></script>
<style>
  :root {
    --paper: #F3E9CE;
    --paper-line: #D9C79C;
    --ink: #3B2A16;
    --ink-soft: #7A6142;
    --income: #3F6B33;
    --income-bg: #E4EDD7;
    --expense: #93402A;
    --expense-bg: #F1DCC9;
    --gold: #8A6423;
    --gold-bg: #EBDBAF;
    --danger: #93402A;
    --font-header: 'Source Sans Pro', sans-serif;
    --font-body: 'Source Sans Pro', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --bg-texture: none;
    --letter-spacing-header: -0.01em;
  }
  :root[data-theme="dark"] {
    --paper: #000000;
    --paper-line: #1C1C1C;
    --ink: #F0F0EA;
    --ink-soft: #8C8C84;
    --income: #6FCF7A;
    --income-bg: #101F13;
    --expense: #E2685A;
    --expense-bg: #241211;
    --gold: #D9B25E;
    --gold-bg: #1F1A0E;
    --danger: #EF5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-texture), var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    transition: background-color .15s ease, color .15s ease;
    padding: 0 20px 80px;
    overflow-x: hidden;
  }

  /* ---------- app shell / header (shared chrome — keep in sync with budget.html/email.html) ---------- */
  .app-shell { max-width: 820px; margin: 0 auto; }
  .app-header-sticky {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--paper);
    padding-top: 10px;
    padding-bottom: 1px;
    width: 100vw;
    margin-left: 50%;
    transform: translateX(-50%);
    border-bottom: 1px solid var(--paper-line);
  }
  .app-header-inner { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .save-bar { display: flex; align-items: flex-start; justify-content: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  /* The tool dropdown now sits where the page title used to be, with the signed-in
     banner still stacked underneath it — everything in the header stays inline and
     wraps naturally at any width now, no more separate mobile layout/drawer. */
  .brand-block { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .tool-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-left: auto; }
  .tool-controls[hidden] { display: none; }
  .tool-dropdown { position: relative; }
  .tool-dropdown-toggle {
    height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border-radius: 17px;
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tool-dropdown-toggle:hover, .tool-dropdown-toggle.is-open { background: var(--paper-line); }
  .tool-dropdown-caret {
    font-size: 9px;
    color: var(--ink-soft);
    transition: transform .15s ease;
  }
  .tool-dropdown-toggle.is-open .tool-dropdown-caret { transform: rotate(180deg); }
  .tool-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 160px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 50;
  }
  .tool-dropdown-menu.expanded {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .tool-dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tool-dropdown-item:hover { background: var(--paper-line); color: var(--ink); }
  .tool-dropdown-item.active { color: var(--ink); background: var(--gold-bg); }
  .dropdown-label-short { display: none; }
  .save-bar.labels-short .dropdown-label-full { display: none; }
  .save-bar.labels-short .dropdown-label-short { display: inline; }
  /* Plain single-click toggle (not a dropdown). margin-left: auto keeps it pinned to
     the right edge of the header at every width. */
  .theme-toggle-btn {
    height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border-radius: 17px;
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-left: auto;
    flex-shrink: 0;
  }
  .theme-toggle-btn:hover { background: var(--paper-line); }
  .save-btn {
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  .save-btn:hover { opacity: 0.88; }
  .save-btn[hidden] { display: none; }
  .save-btn.export-btn {
    background: none;
    color: var(--ink);
    border: 1.5px solid var(--ink);
  }
  .save-btn.export-btn:hover { opacity: 1; background: var(--paper-line); }
  .save-status { font-size: 13px; color: var(--income); min-height: 16px; }
  .signed-in-banner {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: left;
    min-height: 16px;
  }
  .app-footnote {
    max-width: 820px;
    margin: 30px auto 0;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }

  /* ---------- Calendar tool ---------- */
  .cal-app { max-width: 860px; margin: 12px auto 0; }
  .cal-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .cal-nav-btn {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .cal-nav-btn:hover { background: var(--paper-line); }
  .cal-month-label {
    font-family: var(--font-header);
    font-weight: 600;
    font-size: 20px;
    color: var(--ink);
    flex: 1;
    text-align: center;
    letter-spacing: var(--letter-spacing-header);
  }
  .cal-today-btn { margin-left: auto; }
  .cal-status-row { min-height: 18px; margin-bottom: 8px; }
  .cal-status { font-size: 13px; color: var(--gold); }
  .cal-status.error { color: var(--expense); }
  .cal-weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .cal-weekday-row span {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day {
    height: 84px;
    padding: 6px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    background: var(--paper);
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-family: var(--font-body);
    overflow: hidden;
  }
  .cal-day:hover { background: var(--paper-line); }
  .cal-day.outside-month { opacity: 0.4; }
  .cal-day.is-today { border-color: var(--gold); border-width: 2px; }
  .cal-day.has-selected { background: var(--gold-bg); border-color: var(--gold); }
  .cal-day-num { font-size: 13px; font-weight: 600; color: var(--ink); font-family: var(--font-mono); }
  .cal-day-events { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .cal-event-chip {
    font-size: 10.5px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--gold-bg);
    color: var(--gold);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }
  .cal-event-chip.all-day { background: var(--income-bg); color: var(--income); }
  .cal-day-more { font-size: 10px; color: var(--ink-soft); }

  .cal-agenda { margin-top: 20px; border: 1.5px solid var(--ink); border-radius: 10px; padding: 16px; }
  .cal-agenda-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-agenda-head h2 {
    font-family: var(--font-header);
    font-weight: 600;
    font-size: 18px;
    margin: 0;
    letter-spacing: var(--letter-spacing-header);
  }
  .cal-agenda-close { background: none; border: none; color: var(--ink); font-size: 22px; cursor: pointer; line-height: 1; padding: 2px 6px; }
  .cal-agenda-list { display: flex; flex-direction: column; gap: 10px; }
  .cal-agenda-empty { color: var(--ink-soft); font-size: 14px; }
  .cal-agenda-item { display: flex; gap: 12px; align-items: baseline; }
  .cal-agenda-time { flex-shrink: 0; width: 76px; font-family: var(--font-mono); font-size: 12px; color: var(--gold); }
  .cal-agenda-body { flex: 1; }
  .cal-agenda-title { font-weight: 600; font-size: 14px; color: var(--ink); }
  .cal-agenda-location { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }

  .cal-compose-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 1200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .cal-compose-overlay.open { display: flex; }
  .cal-compose-panel {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    width: 100%;
    max-width: 460px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    box-sizing: border-box;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .cal-compose-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-compose-head h2 {
    font-family: var(--font-header);
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: var(--letter-spacing-header);
  }
  .cal-compose-close {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 26px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
  }
  .cal-compose-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .cal-compose-field input {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-line);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .cal-compose-field input:focus { outline: none; border-color: var(--ink); }
  .cal-compose-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 12px;
    cursor: pointer;
  }
  .cal-compose-time-row { display: flex; gap: 12px; }
  .cal-compose-time-row[hidden] { display: none; }
  .cal-compose-time-row .cal-compose-field { flex: 1; }
  .cal-compose-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 4px; }
  .cal-compose-status { font-size: 13px; color: var(--gold); }
  .cal-compose-status.error { color: var(--expense); }

  @media (max-width: 680px) {
    .cal-day { height: 72px; padding: 4px; gap: 2px; }
    .cal-day-num { font-size: 12px; }
    .cal-event-chip { font-size: 9px; padding: 1px 4px; }
    .cal-agenda-time { width: 60px; }
    /* Anything under 16px makes iOS Safari zoom the whole page in on focus. */
    .cal-compose-field input { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-header-sticky">
  <div class="app-header-inner">
  <div class="save-bar">
    <div class="brand-block">
      <div class="tool-dropdown">
        <button class="tool-dropdown-toggle" id="tool-dropdown-toggle" onclick="toggleToolMenu(event)" aria-haspopup="true" aria-expanded="false">
          <span id="tool-dropdown-label" class="dropdown-label-full">Calendar</span>
          <span id="tool-dropdown-label-short" class="dropdown-label-short" aria-hidden="true">C</span>
          <span class="tool-dropdown-caret">&#9662;</span>
        </button>
        <div class="tool-dropdown-menu" id="tool-menu" role="menu" aria-label="Tool">
          <button type="button" class="tool-dropdown-item" data-value="budget" role="menuitemradio" onclick="setActiveTool('budget')">Budget Planner</button>
          <button type="button" class="tool-dropdown-item" data-value="email" role="menuitemradio" onclick="setActiveTool('email')">E-Mail</button>
          <button type="button" class="tool-dropdown-item" data-value="calendar" role="menuitemradio" onclick="setActiveTool('calendar')">Calendar</button>
        </div>
      </div>
      <div class="signed-in-banner" id="signed-in-banner"></div>
    </div>
    <div class="tool-controls" id="tool-controls">
      <button class="save-btn export-btn" id="google-signin-btn" onclick="handleGoogleSignIn()">Google Sign-In</button>
      <span class="save-status" id="save-status"></span>
    </div>
    <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleAppearance()">Dark</button>
  </div>
  </div>
  </div>

  <div id="app-content">
  <div class="cal-app" id="cal-app">
    <div class="cal-toolbar">
      <button type="button" class="cal-nav-btn" onclick="CalendarApp.prevMonth()" aria-label="Previous month">&#8249;</button>
      <div class="cal-month-label" id="cal-month-label"></div>
      <button type="button" class="cal-nav-btn" onclick="CalendarApp.nextMonth()" aria-label="Next month">&#8250;</button>
      <button type="button" class="save-btn export-btn cal-today-btn" onclick="CalendarApp.goToday()">Today</button>
      <button type="button" class="save-btn" id="cal-add-event-btn" onclick="CalendarApp.openCompose()" hidden="">+ Add event</button>
    </div>
    <div class="cal-status-row"><span class="cal-status" id="cal-status"></span></div>
    <div class="cal-weekday-row">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <div class="cal-agenda" id="cal-agenda" hidden="">
      <div class="cal-agenda-head">
        <h2 id="cal-agenda-date"></h2>
        <button type="button" class="cal-agenda-close" onclick="CalendarApp.closeAgenda()" aria-label="Close">&times;</button>
      </div>
      <div class="cal-agenda-list" id="cal-agenda-list"></div>
    </div>
  </div>
  </div>
  <p class="app-footnote">Ry's Tools</p>

  <div class="cal-compose-overlay" id="cal-compose-overlay" onclick="if (event.target === this) CalendarApp.closeCompose()">
    <div class="cal-compose-panel">
      <div class="cal-compose-head">
        <h2>New event</h2>
        <button type="button" class="cal-compose-close" onclick="CalendarApp.closeCompose()" aria-label="Close">&times;</button>
      </div>
      <label class="cal-compose-field">
        <span>Title</span>
        <input type="text" id="cal-compose-title">
      </label>
      <label class="cal-compose-field">
        <span>Date</span>
        <input type="date" id="cal-compose-date">
      </label>
      <label class="cal-compose-checkbox">
        <input type="checkbox" id="cal-compose-allday" onchange="CalendarApp.onAllDayToggle()">
        <span>All day</span>
      </label>
      <div class="cal-compose-time-row" id="cal-compose-time-row">
        <label class="cal-compose-field">
          <span>Start time</span>
          <input type="time" id="cal-compose-start-time">
        </label>
        <label class="cal-compose-field">
          <span>End time</span>
          <input type="time" id="cal-compose-end-time">
        </label>
      </div>
      <label class="cal-compose-field">
        <span>Location (optional)</span>
        <input type="text" id="cal-compose-location">
      </label>
      <div class="cal-compose-actions">
        <span class="cal-compose-status" id="cal-compose-status"></span>
        <button type="button" class="save-btn" id="cal-compose-save-btn" onclick="CalendarApp.createEvent()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
  function setAppearance(appearance) {
    if (appearance === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      appearance = 'light';
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem('munny_appearance', appearance); } catch (e) {}
    syncThemeToggle(appearance);
  }

  function toggleAppearance() {
    setAppearance(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }

  // Shrinks the tool dropdown's toggle label to a single initial only when the
  // current label text would otherwise force something onto a new line. Re-checked
  // whenever a label's text changes or the window resizes, never a fixed viewport
  // breakpoint. Kept in sync with the same function in budget.html/email.html. The
  // theme toggle isn't part of this check — it just wraps to its own line via
  // .save-bar's flex-wrap if it doesn't fit, since "Light"/"Dark" are already as
  // short as they can get.
  function updateDropdownLabelFit() {
    const saveBar = document.querySelector('.save-bar');
    const toolDropdown = document.querySelector('.tool-dropdown');
    const toolControls = document.getElementById('tool-controls');
    if (!saveBar || !toolDropdown) return;

    function rowTops() {
      const els = [toolDropdown];
      if (toolControls && !toolControls.hidden) els.push(toolControls);
      return els.map(function (el) { return Math.round(el.getBoundingClientRect().top); });
    }

    function sameRow(tops) {
      return tops.every(function (t) { return t === tops[0]; });
    }

    saveBar.classList.remove('labels-short');
    if (sameRow(rowTops())) return;

    saveBar.classList.add('labels-short');
    if (!sameRow(rowTops())) {
      saveBar.classList.remove('labels-short');
    }
  }

  let dropdownLabelFitResizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(dropdownLabelFitResizeTimer);
    dropdownLabelFitResizeTimer = setTimeout(updateDropdownLabelFit, 100);
  });

  // No tab bar on this page — kept as a harmless no-op so shared init code that calls
  // it doesn't need a page-specific fork.
  function updateTabLabelFit() {
    const tabsEl = document.querySelector('.tabs');
    const scrollEl = document.querySelector('.tabs-scroll');
    if (!tabsEl || !scrollEl) return;
    function fits() { return scrollEl.scrollWidth <= scrollEl.clientWidth + 1; }

    tabsEl.classList.remove('labels-medium', 'labels-short');
    if (fits()) return;

    tabsEl.classList.add('labels-medium');
    if (fits()) return;

    tabsEl.classList.remove('labels-medium');
    tabsEl.classList.add('labels-short');
  }

  function syncThemeToggle(appearance) {
    const btn = document.getElementById('theme-toggle-btn');
    if (btn) btn.textContent = appearance === 'dark' ? 'Dark' : 'Light';
    updateDropdownLabelFit();
  }

  function toggleDropdown(e, toggleId, menuId) {
    if (e) e.stopPropagation();
    const panel = document.getElementById(menuId);
    const toggle = document.getElementById(toggleId);
    if (!panel || !toggle) return;
    const isOpen = panel.classList.toggle('expanded');
    toggle.classList.toggle('is-open', isOpen);
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  }

  function closeDropdown(toggleId, menuId) {
    const panel = document.getElementById(menuId);
    const toggle = document.getElementById(toggleId);
    if (panel) panel.classList.remove('expanded');
    if (toggle) { toggle.classList.remove('is-open'); toggle.setAttribute('aria-expanded', 'false'); }
  }

  function toggleToolMenu(e) { toggleDropdown(e, 'tool-dropdown-toggle', 'tool-menu'); }
  function closeToolMenu() { closeDropdown('tool-dropdown-toggle', 'tool-menu'); }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      const composeOverlay = document.getElementById('cal-compose-overlay');
      if (composeOverlay && composeOverlay.classList.contains('open')) CalendarApp.closeCompose();
    }
  });

  document.addEventListener('click', function (e) {
    [
      ['tool-dropdown-toggle', 'tool-menu', '.tool-dropdown']
    ].forEach(function (entry) {
      const toggleId = entry[0], menuId = entry[1], wrapSelector = entry[2];
      const panel = document.getElementById(menuId);
      const wrap = document.querySelector(wrapSelector);
      if (!panel || !wrap || !panel.classList.contains('expanded')) return;
      if (wrap.contains(e.target)) return;
      closeDropdown(toggleId, menuId);
    });
  });

  // Each tool lives on its own page — CURRENT_TOOL says which one this page is, so
  // selecting a different tool from the dropdown navigates instead of toggling in place.
  // Kept in sync with the matching block in budget.html/email.html.
  const CURRENT_TOOL = 'calendar';
  const TOOL_PAGES = { budget: 'budget.html', email: 'email.html', calendar: 'cal.html' };
  const TOOL_LABELS = { budget: 'Budget Planner', email: 'E-Mail', calendar: 'Calendar' };

  function setActiveTool(tool) {
    if (!TOOL_PAGES[tool]) tool = CURRENT_TOOL;
    if (tool !== CURRENT_TOOL) {
      window.location.href = TOOL_PAGES[tool];
      return;
    }
    syncToolMenu(tool);
    closeToolMenu();
  }

  function syncToolMenu(tool) {
    const label = TOOL_LABELS[tool] || TOOL_LABELS[CURRENT_TOOL];
    const toggleLabel = document.getElementById('tool-dropdown-label');
    if (toggleLabel) toggleLabel.textContent = label;
    const toggleLabelShort = document.getElementById('tool-dropdown-label-short');
    if (toggleLabelShort) toggleLabelShort.textContent = label.charAt(0);
    updateDropdownLabelFit();
    document.querySelectorAll('#tool-menu .tool-dropdown-item').forEach(function (item) {
      const isActive = item.dataset.value === tool;
      item.classList.toggle('active', isActive);
      item.setAttribute('aria-checked', isActive ? 'true' : 'false');
    });
  }

  function currentAppearance() {
    let appearance;
    try { appearance = localStorage.getItem('munny_appearance'); } catch (e) {}
    if (appearance === 'light' || appearance === 'dark') return appearance;
    // Anything else — the older dark-mode-only toggle, or a stale Elder/Machina
    // value from before those themes were removed — falls back to dark.
    let theme;
    try { theme = localStorage.getItem('munny_theme'); } catch (e) {}
    return theme === 'light' ? 'light' : 'dark';
  }

  /* ================= Google sign-in (shared session with every tool page via the
     same localStorage token — kept in sync with the same module in budget.html/
     email.html). Requests the full cross-tool scope union (see SCOPE below) even
     though this page only ever calls the Calendar/identity endpoints — no Drive file
     persistence or Gmail calls here, those scopes just ride along unused so a
     sign-in from this page also covers the other tools. ================= */
  const GoogleDriveSync = (function () {
    // Client IDs are meant to be public (unlike API tokens) — the real gate is the
    // Google sign-in + consent screen each user goes through, not a hidden secret.
    const CLIENT_ID = '575902569700-4l05lkmf0kbrgq5kdr58canigcvafv3j.apps.googleusercontent.com';
    // Every tool page requests this same full set of scopes (not just what this page
    // itself uses) so signing in once, from any tool, grants everything every other
    // tool needs too — no per-tool "reconnect" prompts later. Keep this identical to
    // the SCOPE constant in budget.html/email.html any time a tool's needs change.
    const SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/calendar.events';
    const TOKEN_KEY = 'munny_google_token';

    let tokenClient = null;
    let accessToken = null;

    function persistToken(token, expiresInSeconds, scope) {
      try {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          access_token: token,
          expires_at: Date.now() + (expiresInSeconds || 3600) * 1000,
          scope: scope || ''
        }));
      } catch (e) {}
    }
    function clearPersistedToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    // Google's token client never restores a session on its own after a reload — a
    // still-valid access token has to be saved and re-hydrated by hand. Once the real
    // expiry passes (usually ~1hr), the next Calendar request 401s and clears it.
    function restoreSession() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { stored = null; }
      if (!stored || !stored.access_token || !stored.expires_at) return false;
      if (Date.now() > stored.expires_at - 60000) { clearPersistedToken(); return false; }
      accessToken = stored.access_token;
      return true;
    }

    function isSignedIn() {
      return !!accessToken;
    }

    // A token saved by a sign-in on another tool page (or by an earlier version of this
    // page that only requested read-only Calendar access) is still valid for
    // isSignedIn() but will 403 on write calls unless it actually includes this exact
    // scope — checked against the granted scopes split into whole tokens, not a
    // substring match, since 'calendar.events' is itself a substring of the older
    // 'calendar.events.readonly' scope and a naive indexOf() would wrongly treat that
    // as sufficient.
    const REQUIRED_CALENDAR_SCOPES = ['https://www.googleapis.com/auth/calendar.events'];
    function hasCalendarScope() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { stored = null; }
      if (!stored || typeof stored.scope !== 'string') return false;
      const granted = stored.scope.split(/\s+/);
      return REQUIRED_CALENDAR_SCOPES.every(function (s) { return granted.indexOf(s) !== -1; });
    }

    function signIn() {
      return new Promise(function (resolve, reject) {
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          reject(new Error('Google sign-in script hasn\'t loaded yet — try again in a moment.'));
          return;
        }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: function () {} // replaced per-request below
          });
        }
        let settled = false;
        // If the popup gets closed/dismissed without Google ever calling back
        // (e.g. blocked, or the user closes it), don't hang forever.
        const timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          reject(new Error('Sign-in timed out — the popup may have been closed or blocked. Try again.'));
        }, 60000);
        tokenClient.callback = function (resp) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (resp.error) { reject(new Error(resp.error)); return; }
          accessToken = resp.access_token;
          persistToken(accessToken, resp.expires_in, resp.scope);
          resolve(accessToken);
        };
        // prompt:'' asks Google to try a silent, invisible sign-in first — in Safari this
        // seems to open the popup, fail to complete quietly, and close itself before you
        // can interact with it. Forcing consent every time is a little more friction but
        // actually shows the real interactive screen instead of a flash-and-close window.
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });
    }

    async function api(url, options) {
      if (!accessToken) throw new Error('not signed in');
      const headers = Object.assign({ 'Authorization': 'Bearer ' + accessToken }, (options && options.headers) || {});
      const controller = new AbortController();
      const timer = setTimeout(function () { controller.abort(); }, 15000);
      let resp;
      try {
        resp = await fetch(url, Object.assign({ cache: 'no-store' }, options, { headers: headers, signal: controller.signal }));
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('Google Calendar request timed out — check your connection and try again.');
        throw new Error('Network error talking to Google Calendar: ' + e.message);
      } finally {
        clearTimeout(timer);
      }
      if (resp.status === 401) { accessToken = null; clearPersistedToken(); } // expired/revoked — isSignedIn() will now correctly report false
      return resp;
    }

    async function getUserEmail() {
      const resp = await api('https://www.googleapis.com/oauth2/v3/userinfo');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      return json.email || '';
    }

    // Google's error responses carry a real explanation (e.g. "Calendar API has not been
    // used in project ... before or it is disabled", or an insufficient-scope message) —
    // surfacing that instead of just the status code is the difference between a useful
    // error and a guessing game.
    async function errorFromResponse(resp) {
      try {
        const json = await resp.json();
        if (json && json.error && json.error.message) return json.error.message;
      } catch (e) {}
      return 'HTTP ' + resp.status;
    }

    // ---- Calendar (this page's addition — the other tool pages don't need this) ----
    async function gcalListEvents(timeMinISO, timeMaxISO) {
      const params = new URLSearchParams({
        timeMin: timeMinISO,
        timeMax: timeMaxISO,
        singleEvents: 'true',
        orderBy: 'startTime',
        maxResults: '250'
      });
      const resp = await api('https://www.googleapis.com/calendar/v3/calendars/primary/events?' + params.toString());
      if (!resp.ok) throw new Error(await errorFromResponse(resp));
      const json = await resp.json();
      return json.items || [];
    }

    // eventResource is a plain Calendar API Event body — {summary, location, start, end}
    // with start/end each either {date: 'YYYY-MM-DD'} for an all-day event or
    // {dateTime, timeZone} for a timed one. Built by the caller (see CalendarApp's
    // compose form) rather than here, so this stays a thin wrapper like the others.
    async function gcalCreateEvent(eventResource) {
      const resp = await api('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(eventResource)
      });
      if (!resp.ok) throw new Error(await errorFromResponse(resp));
      return resp.json();
    }

    return { isSignedIn, signIn, restoreSession, getUserEmail, hasCalendarScope, gcalListEvents, gcalCreateEvent };
  })();

  /* ================= Calendar app (namespaced) ================= */
  const CalendarApp = (function () {
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WEEKDAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    let viewYear, viewMonth; // viewMonth is 0-indexed
    let eventsByDate = {}; // 'YYYY-MM-DD' -> sorted array of events
    let selectedDate = null;
    let loadToken = 0; // guards against a slow request landing after a newer one

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

    function formatTime(d) {
      let h = d.getHours();
      const m = d.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      return h + (m ? ':' + pad2(m) : '') + ampm;
    }

    function setStatus(text, isError) {
      const el = document.getElementById('cal-status');
      if (!el) return;
      el.textContent = text || '';
      el.classList.toggle('error', !!isError);
    }

    // The month grid (toolbar, weekday header, day cells) is always visible now — no
    // separate "Connect Calendar" gate screen. Signing in happens from the one shared
    // Google Sign-In button in the header; until that's done (or a stale session is
    // missing the Calendar scope), the grid just renders empty and "+ Add event" stays
    // hidden (creating an event needs a real connection, unlike just looking at dates).
    function render() {
      const appEl = document.getElementById('cal-app');
      if (!appEl) return;

      if (viewYear === undefined) {
        const now = new Date();
        viewYear = now.getFullYear();
        viewMonth = now.getMonth();
      }
      refreshView();
    }

    function refreshView() {
      const addBtn = document.getElementById('cal-add-event-btn');
      const signedIn = GoogleDriveSync.isSignedIn();
      const ready = signedIn && GoogleDriveSync.hasCalendarScope();
      if (addBtn) addBtn.hidden = !ready;

      if (ready) {
        loadMonth();
      } else {
        eventsByDate = {};
        renderMonthSkeleton();
        renderGridEvents();
        setStatus(signedIn
          ? 'Signed in, but Calendar access hasn\'t been granted yet — click Google Sign-In above to reconnect.'
          : 'Sign in to view your events.');
      }
    }

    // The grid always shows 6 full weeks (42 days) so the layout height never jumps
    // between months, and it's rendered in two passes: the day cells themselves first
    // (instant, no network), then each day's events once the Calendar request resolves —
    // so navigating months feels immediate even while events are still loading.
    function gridStartFor(year, month) {
      const start = new Date(year, month, 1);
      start.setDate(start.getDate() - start.getDay());
      return start;
    }

    function renderMonthSkeleton() {
      const monthLabel = document.getElementById('cal-month-label');
      if (monthLabel) monthLabel.textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;
      renderGridSkeleton(gridStartFor(viewYear, viewMonth));
    }

    function loadMonth() {
      renderMonthSkeleton();

      const gridStart = gridStartFor(viewYear, viewMonth);
      const gridEnd = new Date(gridStart);
      gridEnd.setDate(gridEnd.getDate() + 42);

      const myToken = ++loadToken;
      setStatus('Loading events…');
      GoogleDriveSync.gcalListEvents(gridStart.toISOString(), gridEnd.toISOString()).then(function (events) {
        if (myToken !== loadToken) return; // a newer month nav superseded this request
        eventsByDate = {};
        events.forEach(function (ev) {
          const startStr = ev.start && (ev.start.date || ev.start.dateTime);
          if (!startStr) return;
          const isAllDay = !!ev.start.date;
          const startDate = isAllDay ? new Date(startStr + 'T00:00:00') : new Date(startStr);
          const key = dateKey(startDate);
          if (!eventsByDate[key]) eventsByDate[key] = [];
          eventsByDate[key].push({
            title: ev.summary || '(No title)',
            location: ev.location || '',
            isAllDay: isAllDay,
            start: startDate
          });
        });
        Object.keys(eventsByDate).forEach(function (key) {
          eventsByDate[key].sort(function (a, b) {
            if (a.isAllDay !== b.isAllDay) return a.isAllDay ? -1 : 1;
            return a.start - b.start;
          });
        });
        setStatus('');
        renderGridEvents();
        if (selectedDate) renderAgenda(selectedDate);
      }).catch(function (e) {
        if (myToken !== loadToken) return;
        setStatus("Couldn't load events: " + e.message, true);
      });
    }

    function renderGridSkeleton(gridStart) {
      const gridEl = document.getElementById('cal-grid');
      if (!gridEl) return;
      gridEl.innerHTML = '';
      const todayKey = dateKey(new Date());
      for (let i = 0; i < 42; i++) {
        const d = new Date(gridStart);
        d.setDate(d.getDate() + i);
        const key = dateKey(d);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cal-day'
          + (d.getMonth() !== viewMonth ? ' outside-month' : '')
          + (key === todayKey ? ' is-today' : '')
          + (key === selectedDate ? ' has-selected' : '');
        btn.dataset.date = key;

        const num = document.createElement('div');
        num.className = 'cal-day-num';
        num.textContent = d.getDate();
        btn.appendChild(num);

        const evWrap = document.createElement('div');
        evWrap.className = 'cal-day-events';
        btn.appendChild(evWrap);

        btn.addEventListener('click', function () { selectDate(key); });
        gridEl.appendChild(btn);
      }
    }

    function renderGridEvents() {
      const MAX_CHIPS = 2;
      document.querySelectorAll('.cal-day').forEach(function (dayEl) {
        const key = dayEl.dataset.date;
        const evWrap = dayEl.querySelector('.cal-day-events');
        if (!evWrap) return;
        evWrap.innerHTML = '';
        const evs = eventsByDate[key] || [];
        evs.slice(0, MAX_CHIPS).forEach(function (ev) {
          const chip = document.createElement('div');
          chip.className = 'cal-event-chip' + (ev.isAllDay ? ' all-day' : '');
          // Just the time, not the title — keeps every box the same fixed height
          // regardless of how long an event's name is. The full name is still one
          // hover away via the title attribute.
          chip.textContent = ev.isAllDay ? 'All day' : formatTime(ev.start);
          chip.title = ev.title;
          evWrap.appendChild(chip);
        });
        if (evs.length > MAX_CHIPS) {
          const more = document.createElement('div');
          more.className = 'cal-day-more';
          more.textContent = '+' + (evs.length - MAX_CHIPS) + ' more';
          evWrap.appendChild(more);
        }
      });
    }

    function selectDate(key) {
      selectedDate = key;
      document.querySelectorAll('.cal-day').forEach(function (el) {
        el.classList.toggle('has-selected', el.dataset.date === key);
      });
      renderAgenda(key);
    }

    function renderAgenda(key) {
      const agendaEl = document.getElementById('cal-agenda');
      const dateEl = document.getElementById('cal-agenda-date');
      const listEl = document.getElementById('cal-agenda-list');
      if (!agendaEl || !listEl) return;
      agendaEl.hidden = false;

      const d = new Date(key + 'T00:00:00');
      if (dateEl) dateEl.textContent = WEEKDAY_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();

      const evs = eventsByDate[key] || [];
      listEl.innerHTML = '';
      if (!evs.length) {
        const empty = document.createElement('div');
        empty.className = 'cal-agenda-empty';
        empty.textContent = 'No events.';
        listEl.appendChild(empty);
        return;
      }
      evs.forEach(function (ev) {
        const item = document.createElement('div');
        item.className = 'cal-agenda-item';

        const time = document.createElement('div');
        time.className = 'cal-agenda-time';
        time.textContent = ev.isAllDay ? 'All day' : formatTime(ev.start);

        const body = document.createElement('div');
        body.className = 'cal-agenda-body';
        const title = document.createElement('div');
        title.className = 'cal-agenda-title';
        title.textContent = ev.title;
        body.appendChild(title);
        if (ev.location) {
          const loc = document.createElement('div');
          loc.className = 'cal-agenda-location';
          loc.textContent = ev.location;
          body.appendChild(loc);
        }

        item.appendChild(time);
        item.appendChild(body);
        listEl.appendChild(item);
      });
    }

    function closeAgenda() {
      selectedDate = null;
      const agendaEl = document.getElementById('cal-agenda');
      if (agendaEl) agendaEl.hidden = true;
      document.querySelectorAll('.cal-day').forEach(function (el) { el.classList.remove('has-selected'); });
    }

    function prevMonth() {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      refreshView();
    }
    function nextMonth() {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      refreshView();
    }
    function goToday() {
      const now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth();
      refreshView();
    }

    function setComposeStatus(text, isError) {
      const el = document.getElementById('cal-compose-status');
      if (!el) return;
      el.textContent = text || '';
      el.classList.toggle('error', !!isError);
    }

    // Defaults to whichever day is currently selected in the agenda, or today if none —
    // whichever the person was just looking at is the most likely day they want to add
    // something to.
    function openCompose() {
      const overlay = document.getElementById('cal-compose-overlay');
      if (!overlay) return;
      document.getElementById('cal-compose-title').value = '';
      document.getElementById('cal-compose-location').value = '';
      document.getElementById('cal-compose-allday').checked = false;
      document.getElementById('cal-compose-start-time').value = '09:00';
      document.getElementById('cal-compose-end-time').value = '10:00';
      document.getElementById('cal-compose-date').value = selectedDate || dateKey(new Date());
      setComposeStatus('');
      onAllDayToggle();
      overlay.classList.add('open');
      document.getElementById('cal-compose-title').focus();
    }

    function closeCompose() {
      const overlay = document.getElementById('cal-compose-overlay');
      if (overlay) overlay.classList.remove('open');
    }

    function onAllDayToggle() {
      const allDayInput = document.getElementById('cal-compose-allday');
      const timeRow = document.getElementById('cal-compose-time-row');
      if (timeRow) timeRow.hidden = !!(allDayInput && allDayInput.checked);
    }

    async function createEvent() {
      const title = document.getElementById('cal-compose-title').value.trim();
      const date = document.getElementById('cal-compose-date').value;
      const isAllDay = document.getElementById('cal-compose-allday').checked;
      const location = document.getElementById('cal-compose-location').value.trim();
      const saveBtn = document.getElementById('cal-compose-save-btn');

      if (!title) { setComposeStatus('Title is required.', true); return; }
      if (!date) { setComposeStatus('Date is required.', true); return; }

      const eventResource = { summary: title };
      if (location) eventResource.location = location;

      if (isAllDay) {
        // The Calendar API's end.date is exclusive, so a one-day all-day event still
        // needs an end date of the *next* day.
        const endDate = new Date(date + 'T00:00:00');
        endDate.setDate(endDate.getDate() + 1);
        eventResource.start = { date: date };
        eventResource.end = { date: dateKey(endDate) };
      } else {
        const startTime = document.getElementById('cal-compose-start-time').value || '09:00';
        const endTime = document.getElementById('cal-compose-end-time').value || '10:00';
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        eventResource.start = { dateTime: date + 'T' + startTime + ':00', timeZone: timeZone };
        eventResource.end = { dateTime: date + 'T' + endTime + ':00', timeZone: timeZone };
      }

      if (saveBtn) saveBtn.disabled = true;
      setComposeStatus('Saving…');
      try {
        await GoogleDriveSync.gcalCreateEvent(eventResource);
        closeCompose();
        // Jump the grid to the new event's month/day and refresh so it shows up right away.
        const d = new Date(date + 'T00:00:00');
        viewYear = d.getFullYear();
        viewMonth = d.getMonth();
        selectedDate = date;
        loadMonth();
      } catch (e) {
        setComposeStatus("Couldn't save event: " + e.message, true);
      } finally {
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    return { render, prevMonth, nextMonth, goToday, closeAgenda, openCompose, closeCompose, onAllDayToggle, createEvent };
  })();

  function setGoogleSignedInUi(signedIn) {
    const signinBtn = document.getElementById('google-signin-btn');
    if (signinBtn) signinBtn.hidden = signedIn;
    updateDropdownLabelFit();
  }

  async function showSignedInBanner() {
    const banner = document.getElementById('signed-in-banner');
    if (!banner) return;
    try {
      const email = await GoogleDriveSync.getUserEmail();
      banner.textContent = email || 'Signed in to Google';
    } catch (e) {
      banner.textContent = 'Signed in to Google'; // email lookup failed — still confirm sign-in
    }
  }

  async function handleGoogleSignIn() {
    const status = document.getElementById('save-status');
    status.style.color = 'var(--gold)';
    status.textContent = 'Signing in to Google…';
    try {
      await GoogleDriveSync.signIn();
      setGoogleSignedInUi(true);
      status.textContent = '';
      await showSignedInBanner();
      CalendarApp.render();
    } catch (e) {
      status.style.color = 'var(--expense)';
      status.textContent = 'Google sign-in failed: ' + e.message;
    }
  }

  async function loadApp() {
    // Google's sign-in popup needs a real click, so a brand-new sign-in can't happen
    // automatically on page load. But a still-valid access token from an earlier sign-in
    // (saved in localStorage) can be restored without any popup — so a refresh doesn't
    // force signing in again until that token actually expires (usually ~1hr).
    setGoogleSignedInUi(false);
    setAppearance(currentAppearance());
    syncToolMenu(CURRENT_TOOL);
    updateTabLabelFit();

    if (GoogleDriveSync.restoreSession()) {
      setGoogleSignedInUi(true);
      await showSignedInBanner();
    }
    CalendarApp.render();
  }

  loadApp();
</script>

</body></html>
